name: Tests

on:
  push:
  pull_request:

jobs:
  web-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: Android
      - run: npm run validate:assets
        working-directory: Android
