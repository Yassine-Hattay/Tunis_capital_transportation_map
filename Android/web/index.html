    function saveRecording() {
      const routeName = document.getElementById('dc-route-name').value.trim() || 'unnamed_route';

      if (recordedTrack.length < 2 && markedPoints.length === 0) {
        alert('Not enough points recorded! Try again.');
        resetDCUI();
        return;
      }

      const coordinates = recordedTrack.map(p => [p.lon, p.lat]);

      const features = [];

      // 1. Add the route line if we have enough points
      if (recordedTrack.length >= 2) {
        features.push({
          type: "Feature",
          properties: {
            name: routeName,
            start_time: recordingStartTime,
            end_time: new Date().toISOString(),
            total_points: recordedTrack.length,
            source: "atlas_data_collection",
            feature_type: "route"
          },
          geometry: {
            type: "LineString",
            coordinates: recordedTrack.map(p => [p.lon, p.lat])
          }
        });
      }

      // 2. Add all marked points as separate Point features
      markedPoints.forEach((pt, idx) => {
        features.push({
          type: "Feature",
          properties: {
            name: `${routeName} - ${pt.type} ${idx + 1}`,
            point_type: pt.type,
            timestamp: pt.timestamp,
            source: "atlas_data_collection",
            feature_type: "marked_point"
          },
          geometry: {
            type: "Point",
            coordinates: [pt.lon, pt.lat]
          }
        });
      });

      const geojson = {
        type: "FeatureCollection",
        features: features
      };

      const geojsonStr = JSON.stringify(geojson, null, 2);
      const filename = `${routeName.replace(/\s+/g, '_').toLowerCase()}.geojson`;

      // ── Show the modal with the content (ALWAYS works) ──
      const modal = document.getElementById('save-modal');
      const textarea = document.getElementById('save-modal-textarea');
      textarea.value = geojsonStr;
      modal.classList.add('open');

      // Store for sharing
      window._lastSavedFile = { filename, content: geojsonStr };

      // ── Try to download (works on desktop browsers) ──
      try {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(geojsonStr);
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", filename);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        dbg(`💾 Download triggered: ${filename}`);
      } catch (e) {
        dbg(`⚠️ Download failed: ${e.message}`);
      }

      // ── Try to save via Capacitor Filesystem (Android/iOS) ──
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem) {
        Capacitor.Plugins.Filesystem.writeFile({
          path: filename,
          data: geojsonStr,
          directory: 'DOCUMENTS',
          encoding: 'utf8', // <-- FORCE UTF-8 TO PREVENT GARBLED TEXT
          recursive: true
        }).then(result => {
          dbg(`✅ Saved to Capacitor: ${result.uri}`);
          showToast(`✅ Saved to Documents/${filename}`);
        }).catch(err => {
          dbg(`⚠️ Capacitor save failed: ${err.message}`);
        });
      }
    }

      };
      const fmtDist = m => m < 950 ? `${Math.round(m / 10) * 10} ${t('meters')}` : `${(m / 1000).toFixed(1)} ${t('km')}`;
      const clock = s => new Date(Date.now() + s * 1000).toLocaleTimeString(LANG === 'ar' ? 'ar-TN' : 'en-US', { hour: '2-digit', minute: '2-digit', hour12: true }); const stopIcon = s => s.kind === 'station' ? ' 🚉' : s.kind === 'bench' ? ' 🪑' : '';
      const lineChip = dl => `<span class="chip" style="background:${CFG.MODES[dl.mode].color}">${CFG.MODES[dl.mode].icon} ${esc(lineLabel(dl))}</span>`;
      const OR = '<span class="chip-or">or</span>';
      const allLines = l => [l.dl, ...(l.alts || []).map(a => a.dl)];
      const getTowards = (dl) => dl.towards === 'last recorded stop' ? t('last_recorded_stop') : dl.towards;
      const linesList = l => allLines(l).map(dl => `<b style="color:${CFG.MODES[dl.mode].color}">${esc(lineLabel(dl))}</b>`).join('<br><span style="font-size: 11px; font-style: italic; color: var(--c-muted); display: inline-block; margin: 2px 0 2px 18px;">' + t('or') + '</span><br>'); const lineLabel = dl => {
        // Extract just the number from short codes like "M1", "M2", "A", "D", "E"
        const num = dl.short.replace(/^[A-Z]+/, '');
        if (dl.mode === 'bus') return `${t('bus')} ${num || dl.short}`;
        if (dl.mode === 'metro') return `${t('metro')} ${num || dl.short}`;
        if (dl.mode === 'rfr') return `${t('rfr')} ${num || dl.short}`;
        return dl.base;
      };
      // total trip distance: walking legs + distance along the track/route for each transit leg
      const optDist = o => o.legs.reduce((s, l) => s + (l.type === 'walk' ? l.meters : Math.abs(l.b.d - l.a.d)), 0);
      let runId = 0, lastDest = null, options = [], selectedSig = null;
      let sortPreference = 'fastest';

      // Expose a safe global refresh function for language switching
      window.refreshTripUI = function () {
        if (options && options.length) {
          renderOptions();
          const o = options.find(x => x.sig === selectedSig);
          if (o && map.getSource('trip-pts')) drawOption(o, false);   // relabel stops on the map
        }
      };

      function openSheet() { $('trip-sheet').classList.add('open', 'expanded'); $('trip-sheet').classList.remove('collapsed'); }
      function toggleSheet(force) { const sh = $('trip-sheet'); sh.classList.toggle('collapsed', force ?? !sh.classList.contains('collapsed')); }
      function closeTrip() {
        runId++; lastDest = null; options = [];
        $('trip-sheet').classList.remove('open');
      }
      function setBody(html) { $('trip-list').innerHTML = html; }
      function renderOptions(note) {
        const fmtStopName = (name) => esc(name.replace('· bench', ` · ${t('bench')}`).replace('· stop', ` · ${t('stop')}`));
        const o0 = options[0];
        $('trip-title').textContent = `${t('to')} ${dispName(o0.ctx.dest.name)}`;
        const sel0 = options.find(x => x.sig === selectedSig) || o0;
        const orWord = ' ' + t('or') + ' ';
        $('trip-mini').innerHTML = `<b>${fmtMin(sel0.total)}</b> · ` + (sel0.legs.filter(l => l.type === 'transit').map(l => allLines(l).map(lineLabel).join(orWord)).join(' + ') || t('walking_only')) + ' · ' + t('tap_show');
        $('trip-sub').innerHTML = `${o0.ctx.origin.source === 'gps' ? t('from_location') : t('from_test')}${note ? ' · ' + note : ''}`;

        $('trip-list').innerHTML = options.map((o, i) => {
          const sel = o.sig === selectedSig;
          const chips = o.legs.map(l => l.type === 'walk'
            ? `<span class="chip chip-walk">🚶 ${fmtMin(l.sec)}</span>`
            : `<div style="display:inline-flex; flex-direction:column; align-items:flex-start; vertical-align:middle; margin: 0 4px;">${allLines(l).map(lineChip).join('<span class="chip-or" style="display:block; text-align:center; width:100%; margin: 1px 0;">' + t('or') + '</span>')}</div>`
          ).join('<span class="chip-sep">›</span>');

          const tl = o.legs.filter(l => l.type === 'transit');
          const sub = tl.length
            ? `${i === 0 ? `<b class="tag">${t('best')}</b> ` : ''}${t('walk')} ${fmtMin(o.walkSec)} · ${o.transfers ? (o.transfers > 1 ? t('transfer_many', { n: o.transfers }) : t('transfer_one')) : t('no_transfer')}`
            : `${i === 0 ? `<b class="tag">${t('best')}</b> ` : ''}${t('walking_only')} · ${fmtDist(o.legs[0].meters)}`;

          const steps = sel ? `<div class="trip-steps">${o.legs.map(l => l.type === 'walk'
            ? `<div class="step"><span class="ico">🚶</span><div>${fmtMin(l.sec)} ${t('walk')}<br><small>${t('to')} <b><bdi>${l.toStop ? fmtStopName(l.toStop.name) : esc(dispName(l.toName))}</bdi></b></small></div></div>`
            : `<div class="step"><span class="ico">${CFG.MODES[l.dl.mode].icon}</span><div><small>${t('at_station')} <b><bdi>${fmtStopName(l.a.stop.name)}</bdi></b>${l.a.stop.kind === 'bench' ? ' 🪑' : ''} ${t('board')}<br>
${linesList(l)}<br>
${t('get_off')} <b><bdi>${fmtStopName(l.b.stop.name)}</bdi></b>${l.b.stop.kind === 'bench' ? ' 🪑' : ''}</small></div></div>`
          ).join('')}</div>` : '';

          return `<div class="trip-card${sel ? ' sel' : ''}" data-sig="${esc(o.sig)}">
<div class="trip-top"><span class="trip-time">${fmtMin(o.total)} <span class="trip-dist">· ${fmtDist(optDist(o))}</span></span></div>
<div class="trip-chips">${chips}</div><div class="trip-subline">${sub}</div>${steps}</div>`;
        }).join('') + `<div class="trip-foot">${t('estimates')}</div>`;
      }
      const EMPTY = { type: 'FeatureCollection', features: [] };
      function ensureLayers() {
        if (map.getSource('trip')) return;
        map.addSource('trip', { type: 'geojson', data: EMPTY });
        map.addSource('trip-pts', { type: 'geojson', data: EMPTY });
        map.addLayer({ id: 'trip-walk', type: 'line', source: 'trip', filter: ['==', ['get', 'kind'], 'walk'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#374151', 'line-width': 4, 'line-dasharray': [0.1, 2] } });
        map.addLayer({ id: 'trip-transit-casing', type: 'line', source: 'trip', filter: ['==', ['get', 'kind'], 'transit'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 9 } });
        map.addLayer({ id: 'trip-transit', type: 'line', source: 'trip', filter: ['==', ['get', 'kind'], 'transit'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': ['get', 'color'], 'line-width': 5.5 } });
        map.addLayer({ id: 'trip-pts-circle', type: 'circle', source: 'trip-pts', paint: { 'circle-radius': 6.5, 'circle-color': '#ffffff', 'circle-stroke-width': 3, 'circle-stroke-color': ['get', 'color'] } });
        map.addLayer({ id: 'trip-pts-label', type: 'symbol', source: 'trip-pts', layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Regular'], 'text-size': 11, 'text-offset': [0, 1.2], 'text-anchor': 'top', 'text-allow-overlap': false }, paint: { 'text-color': '#111827', 'text-halo-color': '#ffffff', 'text-halo-width': 1.6 } });
      }
      function drawOption(o, fit) {
        ensureLayers();
        const feats = [], pts = [], all = [];
        o.legs.forEach(l => {
          const color = l.type === 'walk' ? '#374151' : CFG.MODES[l.dl.mode].color;
          feats.push({ type: 'Feature', properties: { kind: l.type === 'walk' ? 'walk' : 'transit', color }, geometry: { type: 'LineString', coordinates: l.coords } });
          l.coords.forEach(c => all.push(c));
          if (l.type === 'transit') {
            pts.push({ type: 'Feature', properties: { color, label: l.a.stop.name }, geometry: { type: 'Point', coordinates: [l.a.stop.lon, l.a.stop.lat] } });
            pts.push({ type: 'Feature', properties: { color, label: l.b.stop.name }, geometry: { type: 'Point', coordinates: [l.b.stop.lon, l.b.stop.lat] } });
          }
        });
        map.getSource('trip').setData({ type: 'FeatureCollection', features: feats });
        map.getSource('trip-pts').setData({ type: 'FeatureCollection', features: pts });
        if (fit && all.length) {
          const b = all.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(all[0], all[0]));
          map.fitBounds(b, { padding: { top: 90, bottom: Math.min(window.innerHeight * 0.55, 420), left: 40, right: 40 }, maxZoom: 16, duration: 600 });
        }
      }
      function selectOption(sig, fit = true) {
        selectedSig = sig;
        const o = options.find(x => x.sig === sig); if (!o) return;
        renderOptions(); drawOption(o, fit);
      }

      async function planTripTo(lat, lon, name) {
        const my = ++runId; lastDest = { lat, lon, name };
        openSheet();
        $('trip-title').textContent = `${t('to')} ${dispName(name)}`; $('trip-sub').textContent = '';
        setBody('<div class="trip-msg">Finding the best way…</div>');
        let origin;
        try { origin = await resolveOrigin(); } catch (e) { return; }
        try { await loadTransitData(); } catch (e) { return; }
        if (my !== runId) return;
        if (!G.stops.length) { setBody('<div class="trip-msg">No transit data found.</div>'); return; }
        options = computeOptions(origin, { lat, lon, name });
        if (!options.length) {
          setBody(`< div class="trip-msg" > No connection found.</div >`);
          return;
        }
        options = sortOptions(options, sortPreference);
        selectedSig = options[0].sig;
        selectOption(selectedSig, true);
      }

      function initTransitPlanner() {
        $('trip-close').onclick = closeTrip;
        $('trip-toggle').onclick = () => toggleSheet();
        $('trip-handle').onclick = () => toggleSheet();
        $('trip-list').addEventListener('click', e => { const c = e.target.closest('.trip-card'); if (c && c.dataset.sig !== selectedSig) selectOption(c.dataset.sig); });

        const sortEl = $('trip-sort');
        if (sortEl) {
          sortEl.onchange = (e) => {
            sortPreference = e.target.value;
            if (options.length) {
              options = sortOptions(options, sortPreference);
              const keep = options.find(o => o.sig === selectedSig) ? selectedSig : options[0].sig;
              selectOption(keep, false);
            }
          };
        }

        if (CFG.USE_TEST_ORIGIN) setOriginMarker(testOrigin);
        loadTransitData().catch(e => dbg('❌ Transit data: ' + e.message));
      }
      window.initTransitPlanner = initTransitPlanner;
      window.planTripTo = planTripTo;
      window.closeTrip = closeTrip;
    })();

    // ── UI TOGGLE LOGIC ───────────────────────────────────────────────────────
    document.getElementById('ui-toggle-btn').onclick = function () {
      const panel = document.getElementById('data-collection-panel');
      panel.classList.toggle('visible');
      const isCollecting = panel.classList.contains('visible');
      document.body.classList.toggle('data-collecting', isCollecting);
      this.innerText = isCollecting ? '❌' : '⚙️';
    };

    // Initialize everything on load, then render markers once the map is ready
    window.onload = function () {
      setLang(LANG);   // Apply saved language + translate the search placeholder
      init();
      // Small timeout ensures the map object is fully initialized before placing markers
      setTimeout(() => {
        if (map) {
          if (DEV_UI) {
            renderHomeMarkers();
            renderBusMarkers();
            drawPrimaryPath();
          }
        }
      }, 500);
    };
  </script>
</body>
