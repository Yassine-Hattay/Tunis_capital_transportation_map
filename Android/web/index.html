<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: file: data: gap: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; img-src 'self' data: blob: file: https:; connect-src 'self' https://localhost https://localhost:* http://localhost http://localhost:* https://*; font-src 'self' data: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <style>
    :root {
      --c-bg: #f5f3f0;
      --c-surface: #ffffff;
      --c-border: rgba(0, 0, 0, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #333333;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      color: var(--c-text);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #c8dff0;
    }

    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    #search-wrap {
      flex: 1;
      min-width: 0;
      /* Crucial: allows the search bar to shrink on narrow screens */
      position: relative;
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      direction: rtl;
      text-align: right;
    }

    #search-input:not(:placeholder-shown) {
      direction: ltr;
      text-align: left;
    }

    #search-clear {
      cursor: pointer;
      display: none;
      padding: 4px;
      opacity: 0.6;
      font-size: 16px;
    }

    #search-clear.visible {
      display: block;
    }

    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow: hidden;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      /* Crucial: prevents buttons from shrinking and clipping */
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
    }

    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    #routing-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--c-surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      z-index: 400;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
    }

    #panel.open {
      display: block;
    }

    .route-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--c-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--c-border);
    }

    .route-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .route-input {
      width: 100%;
      min-width: 0;
      /* Crucial: allows grid items to shrink and prevents cutoff */
      box-sizing: border-box;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--c-text);
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
    }

    /* Highlight effect when the user taps the field */
    .route-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
      outline: none;
      background: #ffffff;
    }

    /* Toast Notification Styling */
    #toast {
      position: fixed;
      top: 80px;
      /* Positioned just below the top bar */
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      /* Allows tapping through the message to the map */
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: var(--c-warn);
      color: #92400e;
      /* Dark amber for error text */
    }

    #bus-panel,
    #Ligne-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    .bus-route-item,
    .Ligne-route-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--c-border);
    }

    .bus-route-item:last-child,
    .Ligne-route-item:last-child {
      border-bottom: none;
    }

    .bus-route-item label,
    .Ligne-route-item label {
      flex: 1;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .bus-route-item input[type="checkbox"],
    .Ligne-route-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--c-accent2);
      cursor: pointer;
    }

    .Ligne-route-item input[type="checkbox"] {
      accent-color: #dc2626;
      /* Red for Ligne */
    }

    #coord-picker-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      max-height: 400px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-accent2);
      border-radius: var(--r);
      padding: 12px;
      z-index: 260;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
      font-family: monospace;
      font-size: 11px;
    }

    #coord-picker-panel.open {
      display: block;
    }

    #coord-picker-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--c-text);
      font-family: inherit;
    }

    #coord-list {
      max-height: 220px;
      overflow-y: auto;
      background: var(--c-bg);
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #coord-picker-panel button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-right: 4px;
    }

    /* ── DATA COLLECTION MODE: Hide existing UI ─────────────────────────────── */
    #topbar,
    #routing-panel,
    #bus-panel,
    #Ligne-panel,
    #debug-panel,
    #coord-picker-panel {
      display: none !important;
    }

    /* ── Data Collection Panel Styles ───────────────────────────────────────── */
    #data-collection-panel {
      display: none;
      /* Hidden by default */
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: var(--c-surface);
      border: 1.5px solid var(--c-accent);
      border-radius: var(--r);
      padding: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #data-collection-panel.visible {
      display: block !important;
    }

    .dc-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 14px;
      color: var(--c-text);
    }

    .dc-status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      /* Red = stopped */
    }

    .dc-status-dot.ready {
      background: #fbbf24;
    }

    /* Yellow = GPS ready */
    .dc-status-dot.recording {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }

    .dc-status-dot.saved {
      background: #4ade80;
    }

    .dc-status-dot.requesting {
      background: #fbbf24;
      animation: pulse 1s infinite;
    }

    /* Green = saved */
    /* ── Pulsating Location Marker ────────────────────────────────────────── */
    .location-marker {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
      animation: pulse-location 2s infinite;
    }

    @keyframes pulse-location {
      0% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(59, 130, 246, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      }
    }

    /* ── Marked Point Markers ─────────────────────────────────────────────── */
    .marked-point-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .marked-point-marker.in {
      background: #16a34a;
      /* Green */
    }

    .marked-point-marker.out {
      background: #ef4444;
      /* Red */
    }

    .marked-point-marker.point {
      background: #3b82f6;
      /* Blue */
    }

    .marked-point-marker.bench {
      background: #d97706;
      /* Amber/Brown for Benches */
    }

    .marked-point-marker.ticket_booth {
      background: #8b5cf6;
      /* Violet for Ticket Booths */
    }

    /* Blue */

    .dc-btn-mark {
      background: var(--c-accent2);
      color: white;
    }

    .dc-btn-mark:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-btn-follow.active {
      background: #ef4444 !important;
      /* Turns red when actively following */
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .dc-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 15px;
      box-sizing: border-box;
      background: var(--c-bg);
      color: var(--c-text);
    }

    .dc-input:focus {
      outline: none;
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
    }

    .dc-buttons {
      display: flex;
      gap: 8px;
    }

    .dc-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dc-btn-start {
      background: var(--c-accent);
      color: #0f1117;
    }

    .dc-btn-start:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-btn-stop {
      background: #ef4444;
      color: white;
    }

    .dc-btn-stop:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-info {
      margin-top: 12px;
      font-size: 12px;
      color: var(--c-muted);
      text-align: center;
      font-family: monospace;
    }

    /* ── DATA COLLECTION MODE: Mask existing UI (Do not delete) ────────────────── */
    #topbar,
    #routing-panel,
    #bus-panel,
    #Ligne-panel,
    #debug-panel,
    #coord-picker-panel,
    #panel {
      display: none !important;
    }


    /* ── Save Result Modal ──────────────────────────────────────────────────── */
    #save-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #save-modal.open {
      display: flex;
    }

    #save-modal-content {
      background: var(--c-surface);
      border-radius: var(--r);
      padding: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #save-modal-content h3 {
      margin: 0;
      font-size: 16px;
    }

    #save-modal-content textarea {
      width: 100%;
      min-height: 200px;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }

    #save-modal-content button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    #save-modal-content .btn-copy {
      background: var(--c-accent);
      color: #0f1117;
    }

    #save-modal-content .btn-close {
      background: var(--c-muted);
      color: white;
    }

    /* ── Interactive Decision Tree UI ──────────────────────────────────────── */
    .tree-container {
      padding: 10px;
    }

    .tree-node {
      margin-left: 16px;
      border-left: 2px solid var(--c-border);
      padding-left: 12px;
      margin-bottom: 8px;
    }

    .tree-label {
      background: var(--c-surface);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--c-border);
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--c-text);
    }

    .tree-children {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tree-branch {
      position: relative;
      padding-left: 16px;
    }

    .tree-branch::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      width: 12px;
      height: 2px;
      background: var(--c-border);
    }

    .tree-choice-btn {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tree-choice-btn:hover {
      background: var(--c-accent2);
      color: white;
      border-color: var(--c-accent2);
    }

    .tree-choice-btn.yes {
      border-left: 3px solid #22c55e;
    }

    .tree-choice-btn.no {
      border-left: 3px solid #ef4444;
    }

    .tree-children-content {
      margin-top: 8px;
    }

    .tree-leaf {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid #22c55e;
      color: #15803d;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-left: 16px;
      border-left: 3px solid #22c55e;
    }

    .tree-leaf.active {
      background: rgba(129, 140, 248, 0.15);
      color: var(--c-accent2);
      border-color: var(--c-accent2);
      font-weight: 600;
    }

    /* ── Custom Transfer & Home Markers ────────────────────────────────────── */
    .custom-marker-number {
      width: 26px;
      height: 26px;
      background: #ef4444;
      color: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .custom-marker-home {
      width: 30px;
      height: 30px;
      background: #f59e0b;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- UI Toggle Button -->
  <button id="ui-toggle-btn"
    style="position: fixed; top: 14px; right: 12px; z-index: 1000; width: 48px; height: 48px; border-radius: 14px; background: #ffffff; border: 1.5px solid rgba(0,0,0,0.09); box-shadow: 0 4px 24px rgba(0,0,0,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px;"
    title="Toggle UI">⚙️</button>

  <!-- ── DATA COLLECTION PANEL ─────────────────────────────────────────────── -->
  <!-- ── SAVE RESULT MODAL ─────────────────────────────────────────────────── -->
  <div id="save-modal">
    <div id="save-modal-content">
      <h3>✅ Route Saved!</h3>
      <p style="margin:0;font-size:12px;color:var(--c-muted)">Copy the GeoJSON below or share it:</p>
      <textarea id="save-modal-textarea" readonly></textarea>
      <button class="btn-copy" onclick="copyModalContent()">📋 Copy to Clipboard</button>
      <button class="btn-close" onclick="closeSaveModal()">✖ Close</button>
    </div>
  </div>

  <div id="data-collection-panel">
    <div class="dc-status">
      <div id="dc-status-dot" class="dc-status-dot"></div>
      <span id="dc-status-text">Initializing GPS...</span>
    </div>

    <input type="text" id="dc-route-name" class="dc-input" placeholder="Route Name (e.g., 23 Aller)" />

    <div class="dc-buttons">
      <button id="dc-btn-start" class="dc-btn dc-btn-start" onclick="startRecording()" disabled>▶ Start</button>
      <button id="dc-btn-stop" class="dc-btn dc-btn-stop" onclick="stopRecording()" disabled>⏹ Stop & Save</button>
    </div>
    <select id="dc-point-type" class="dc-input" style="margin-bottom: 8px; padding: 10px;">
      <option value="point" selected>📍 Point (Default)</option>
      <option value="in">🟢 In</option>
      <option value="out">🔴 Out</option>
      <option value="bench">🪑 Bench</option>
      <option value="ticket_booth">🎟️ Ticket Booth</option>
    </select>
    <div class="dc-buttons" style="margin-top: 8px;">
      <button id="dc-btn-mark" class="dc-btn dc-btn-mark" onclick="markCurrentPoint()" disabled>📍 Mark Point</button>
      <button id="dc-btn-follow" class="dc-btn" style="background: var(--c-accent2); color: white;"
        onclick="toggleFollowMode()">🎯 Follow</button>
    </div>

  <div id="panel">
    <div id="panel-title" style="font-weight:bold;font-size:16px"></div>

  </div>

  <script>
    // ── GLOBALS ──────────────────────────────────────────────────────────────
    let map = null;
    let _protocolAdded = false;
    let _fileCache = null;
    let _fetchPromise = null;
    let _offlinePlaces = [];
    let routingClickActive = false;
    let activeRouteInput = null; // Tracks which input is waiting for a map tap
    let pickerMode = false;
    let pickedCoords = [];
    let pickedMarkers = [];
    let clickMarker = null; // Tracks the click-to-coordinates marker
    const PMTILES_PATH = '/data/tunis.pmtiles';

    // Bus routes state
    let selectedRoutes = new Set();
    let availableRoutes = [];

    // Ligne routes state
    let selectedLigneRoutes = new Set();
    let availableLigneRoutes = [];

    // ── DEBUG ────────────────────────────────────────────────────────────────
    function dbg(msg) {
      console.log('[Atlas]', msg);
      const content = document.getElementById('debug-content');
      if (!content) return;
      const div = document.createElement('div');
      div.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.1);padding:2px 0';
      div.innerHTML = `<span style="color:var(--c-muted)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
      content.appendChild(div);
      content.scrollTop = content.scrollHeight;
    }

    // ── PMTILES RANGE FETCH POLYFILL (STABLE) ─────────────────────────────────
    const _origFetch = window.fetch;
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      let range = null;
      if (init?.headers) {
        if (typeof init.headers.get === 'function') range = init.headers.get('Range');
        else range = init.headers['Range'] || init.headers['range'];
      }
      if (range && url.includes('tunis.pmtiles')) {
        const match = range.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          if (!_fileCache) {
            if (!_fetchPromise) {
              _fetchPromise = (async () => {
                dbg('📥 Caching PMTiles...');
                try {
                  const r = await _origFetch.call(window, url);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const buf = await r.arrayBuffer();
                  _fileCache = buf;
                  dbg('✅ PMTiles Cached');
                  return _fileCache;
                } catch (e) {
                  dbg('❌ Cache Failed: ' + e.message);
                  _fetchPromise = null;
                  throw e;
                }
              })();
            }
            await _fetchPromise;
          }
          if (_fileCache) {
            const start = parseInt(match[1]), end = parseInt(match[2]);
            const slice = _fileCache.slice(start, end + 1);
            return new Response(slice, { status: 206, headers: { 'Content-Range': `bytes ${start}-${end}/${_fileCache.byteLength}`, 'Content-Length': String(slice.byteLength), 'Content-Type': 'application/octet-stream' } });
          }
        }
      }
      return _origFetch.apply(window, arguments);
    };

    // ── STYLE BUILDER (FULL ORIGINAL THEME RE-INTEGRATED) ─────────────────────
    async function buildStyle(theme) {
      const isDark = theme === 'dark';
      const c = isDark ? {
        bg: '#0a0e14', land: '#121826', water: '#0d253f', waterLine: '#1a4a7a', ocean: '#081a33',
        forest: '#1a3a2e', park: '#1e4a3a', grass: '#2a3a2e', sand: '#3a3a2a', beach: '#4a4a3a', industrial: '#2a2a3a', residential: '#1a1e2a', cemetery: '#2a2a3a', wetland: '#1a2a3a', scrub: '#2a3a2e',
        roadMotorway: '#f07030', roadTrunk: '#e86820', roadPrimary: '#d05818', roadSecondary: '#b05030', roadMinor: '#8a5040', roadPath: '#6a4030', roadRail: '#5a4a6a',
        building: '#1e2230', buildingTop: '#2a2e3c', buildingOutline: '#3a3a4a',
        siteSchool: '#1e3a3a', siteHospital: '#3a2a3a', siteParking: '#2a2a3a',
        placeLabel: '#b8c8e8', roadLabel: '#9aa8c8', poiLabel: '#a8b8d8', waterLabel: '#7a9ab8', addressLabel: '#8a9ab8',
        boundary: '#4a4a6a', boundaryDisputed: '#6a4a5a', poiIcon: '#8a9ab8', ferry: '#2a4a7a', aerialway: '#5a5a7a', halo: '#0a0e14', haloLight: 'rgba(10,14,20,0.85)'
      } : {
        bg: '#f5f3f0', land: '#f5f3f0', water: '#c8dff0', waterLine: '#88b0d0', ocean: '#b8d0e8',
        forest: '#d4e8c8', park: '#ddeedd', grass: '#e8f0dc', sand: '#f0e8d0', beach: '#f8f0e0', industrial: '#e4e0e8', residential: '#efefef', cemetery: '#e0e0d8', wetland: '#ccddf0', scrub: '#dce8d0',
        roadMotorway: '#e8952a', roadTrunk: '#e8952a', roadPrimary: '#f0b050', roadSecondary: '#f8d090', roadMinor: '#ffffff', roadPath: '#e8e0d8', roadRail: '#aaaaaa',
        building: '#e8e4de', buildingTop: '#f0ece8', buildingOutline: '#d0ccc8',
        siteSchool: '#eaf0e0', siteHospital: '#f0e8e8', siteParking: '#ececec',
        placeLabel: '#333333', roadLabel: '#666666', poiLabel: '#555555', waterLabel: '#4a7a9a', addressLabel: '#888888',
        boundary: '#bbbbbb', boundaryDisputed: '#cc9999', poiIcon: '#777777', ferry: '#88b0d0', aerialway: '#aaaaaa', halo: '#f5f3f0', haloLight: 'rgba(245,243,240,0.9)'
      };

      const PMTILES_URL = 'pmtiles://' + new URL('./data/tunis.pmtiles', window.location.href).href;
      const spriteUrl = new URL('./sprites/sprites', window.location.href).href;
      const glyphsUrl = new URL('./font', window.location.href).href + '/{fontstack}/{range}.pbf';

      const style = {
        version: 8, name: "Tunis Professional", sources: { omt: { type: 'vector', url: PMTILES_URL } },
        sprite: spriteUrl, glyphs: glyphsUrl, layers: []
      };

      style.layers.push({ id: 'background', type: 'background', paint: { 'background-color': isDark ? c.ocean : c.ocean } });
      style.layers.push({ id: 'land-polygons', type: 'fill', source: 'omt', 'source-layer': 'land_polygons', paint: { 'fill-color': c.land } });
      style.layers.push({ id: 'land-base', type: 'fill', source: 'omt', 'source-layer': 'land', paint: { 'fill-color': c.land } });
      style.layers.push({ id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water_polygons', paint: { 'fill-color': c.water } });
      style.layers.push({ id: 'water-lines', type: 'line', source: 'omt', 'source-layer': 'water_lines', minzoom: 4, filter: ['in', 'class', 'river', 'stream', 'canal'], paint: { 'line-color': c.waterLine, 'line-width': { stops: [[10, 0.8], [14, 2]] } } });

      const landCoverTypes = [
        { kind: 'forest', color: c.forest, minzoom: 11 }, { kind: 'park', color: c.park, minzoom: 12, filter: ['in', 'class', 'park', 'recreation_ground'] },
        { kind: 'grass', color: c.grass, minzoom: 12, filter: ['in', 'class', 'grass', 'meadow'] }, { kind: 'sand', color: c.sand, minzoom: 12, filter: ['in', 'class', 'sand', 'beach'] },
        { kind: 'cemetery', color: c.cemetery, minzoom: 14 }, { kind: 'wetland', color: c.wetland, minzoom: 13 }, { kind: 'scrub', color: c.scrub, minzoom: 13 },
        { kind: 'residential', color: c.residential, minzoom: 13 }, { kind: 'industrial', color: c.industrial, minzoom: 13, filter: ['in', 'class', 'industrial', 'commercial', 'retail'] }
      ];
      landCoverTypes.forEach(cfg => {
        style.layers.push({ id: `land-${cfg.kind}`, type: 'fill', source: 'omt', 'source-layer': 'land', minzoom: cfg.minzoom, filter: cfg.filter || ['==', 'class', cfg.kind], paint: { 'fill-color': cfg.color, 'fill-opacity': 0.6 } });
      });

      style.layers.push(
        { id: 'sites-university', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['in', 'class', 'university', 'college'], minzoom: 13, paint: { 'fill-color': isDark ? '#6d597a' : '#e0d1ea', 'fill-opacity': 0.7 } },
        { id: 'sites-school', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['==', 'class', 'school'], minzoom: 13, paint: { 'fill-color': isDark ? '#52796f' : '#b7d4c8', 'fill-opacity': 0.7 } },
        { id: 'sites-hospital', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['==', 'class', 'hospital'], minzoom: 13, paint: { 'fill-color': isDark ? '#a44a3f' : '#f2c6c2', 'fill-opacity': 0.7 } },
        { id: 'sites-park', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['in', 'class', 'park', 'garden'], minzoom: 13, paint: { 'fill-color': isDark ? '#2d6a4f' : '#74c69d', 'fill-opacity': 0.7 } },

        // NEW: Generic fallback for any other site class (clinics, museums, stadiums, etc.)
        {
          id: 'sites-generic-fill',
          type: 'fill',
          source: 'omt',
          'source-layer': 'sites',
          filter: ['all', ['has', 'class'], ['!', ['in', ['get', 'class'], ['literal', ['university', 'college', 'school', 'hospital', 'park', 'garden']]]]],
          minzoom: 13,
          paint: { 'fill-color': isDark ? '#3a404d' : '#d4d8de', 'fill-opacity': 0.5 }
        },
        {
          id: 'sites-generic-label',
          type: 'symbol',
          source: 'omt',
          'source-layer': 'sites',
          filter: ['all', ['has', 'class'], ['!', ['in', ['get', 'class'], ['literal', ['university', 'college', 'school', 'hospital', 'park', 'garden']]]]],
          minzoom: 14,
          layout: {
            'text-field': ['coalesce', ['get', 'name:ar'], ['get', 'name:en'], ['get', 'name:fr'], ['get', 'name']],
            'text-font': ['Noto Sans Regular'],
            'text-size': 11,
            'text-anchor': 'center',
            'text-allow-overlap': false
          },
          paint: {
            'text-color': c.poiLabel,
            'text-halo-color': c.haloLight,
            'text-halo-width': 1.2
          }
        }
      );

      style.layers.push(
        { id: 'aeroway-apron', type: 'fill', source: 'omt', 'source-layer': 'aeroways', filter: ['in', 'class', 'apron', 'terminal'], minzoom: 10, paint: { 'fill-color': isDark ? '#2a2a38' : '#d8d8e4' } },
        { id: 'aeroway-runway', type: 'line', source: 'omt', 'source-layer': 'aeroways', filter: ['==', 'class', 'runway'], minzoom: 10, paint: { 'line-color': isDark ? '#4a4a5a' : '#b8b8c8', 'line-width': { stops: [[10, 4], [14, 30]] } } }
      );

      const roadStyles = [
        { kinds: ['motorway', 'trunk'], color: c.roadMotorway, widths: { stops: [[6, 1], [14, 8]] }, minzoom: 6 },
        { kinds: ['primary', 'secondary'], color: c.roadPrimary, widths: { stops: [[10, 0.8], [14, 5]] }, minzoom: 10 },
        { kinds: ['tertiary'], color: c.roadSecondary, widths: { stops: [[12, 0.8], [14, 4]] }, minzoom: 12 },
        { kinds: ['residential', 'service', 'footway', 'path'], color: c.roadMinor, widths: { stops: [[13, 0.5], [18, 6]] }, minzoom: 13 },
      ];

      roadStyles.forEach(cfg => {
        const layerDef = {
          id: `streets-${cfg.kinds[0]}`,
          type: 'line',
          source: 'omt',
          'source-layer': 'streets',
          filter: ['in', 'class', ...cfg.kinds],
          minzoom: cfg.minzoom,
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': cfg.color, 'line-width': cfg.widths }
        };
        style.layers.push(layerDef);
      });

      style.layers.push({ id: 'bridges-streets', type: 'line', source: 'omt', 'source-layer': 'streets', minzoom: 13, filter: ['==', ['get', 'bridge'], 'yes'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': isDark ? '#e6b800' : '#c49000', 'line-width': { stops: [[12, 2.5], [18, 13]] } } });
      style.layers.push({ id: 'buildings', type: 'fill', source: 'omt', 'source-layer': 'buildings', minzoom: 13, paint: { 'fill-color': c.building, 'fill-outline-color': c.buildingOutline, 'fill-opacity': 0.7 } });

      // ── RAIL / METRO / TRAM ────────────────────────────────────────────────

      return style;
    }

    // ── CSV PARSER (Handles Comma, Tab, or Semicolon separated files) ─────────
    function parseCSV(text) {
      const firstLine = text.split('\n')[0];
      let delimiter = ',';
      if (firstLine.split('\t').length > firstLine.split(',').length) delimiter = '\t';
      else if (firstLine.split(';').length > firstLine.split(',').length) delimiter = ';';

      const rows = [];
      let cur = '';
      let inQuotes = false;
      let row = [];
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { cur += '"'; i++; }
            else inQuotes = false;
          } else {
            cur += c;
          }
        } else {
          if (c === '"') inQuotes = true;
          else if (c === delimiter) { row.push(cur); cur = ''; }
          else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (c === '\r') { }
          else cur += c;
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    const ZOOM_BY_CLASS = {

      hamlet: 15,
      locality: 15,

    async function initOfflineSearch() {
      try {
        const r = await fetch('./data/places.json');
        _offlinePlaces = await r.json();
        dbg(`🔍 Loaded ${_offlinePlaces.length} places`);
      } catch (e) { dbg('❌ Search load failed'); }
      const input = document.getElementById('search-input'), resultsEl = document.getElementById('search-results');

      // NEW: Handle Enter key to fly to coordinates
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const val = input.value.trim();
          // Regex to match "lat, lon" or "lat,lon" (with or without spaces)
          const match = val.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
          if (match) {
            const lat = parseFloat(match[1]);
            const lon = parseFloat(match[3]);
            // Basic validation to ensure it's a valid lat/lon
            if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
              e.preventDefault();
              flyToCoordinates(lat, lon);
            }
          }
        }
      });

      input.addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
        if (q.length < 2) { resultsEl.classList.remove('open'); return; }
        const allMatches = _offlinePlaces.filter(p => (p.na || '').toLowerCase().includes(q) || (p.nl || '').toLowerCase().includes(q) || (p.n || '').toLowerCase().includes(q));
        const matches = allMatches.slice(0, 10);
        dbg(`🔎 Search "${q}": ${allMatches.length} total matches, showing top ${matches.length}`);
        resultsEl.innerHTML = matches.map(p => `<div class="search-result-item" onclick="goToPlace(${p.lo},${p.la},'${(p.na || p.nl || p.n).replace(/'/g, "\\'")}','${(p.c || '').replace(/'/g, "\\'")}')"><div class="sri-icon">📍</div><div><div class="sri-name">${p.na || p.nl || p.n}</div><div class="sri-sub">${p.c || ''}</div></div></div>`).join('');
        resultsEl.classList.add('open');

    async function planRoute(mode) {
      const fromS = document.getElementById('from-input').value, toS = document.getElementById('to-input').value;
      if (!fromS || !toS) { dbg('⚠ Enter both points'); return; }
      const from = fromS.split(',').map(Number), to = toS.split(',').map(Number);

      // 🔌 Check if Capacitor and Valhalla plugin are actually available
      if (typeof Capacitor === 'undefined' || !Capacitor.Plugins?.Valhalla) {
        dbg('❌ Capacitor Valhalla plugin not found! (Are you running in a native container?)');
        document.getElementById('route-result').innerText = 'Routing plugin missing';
        return;
      }

      dbg(`🚗 Routing (${mode}) from [${from}] to [${to}]`);
      document.getElementById('route-result').innerText = 'Calculating...';

      try {
        const startTime = performance.now();
        const res = await Capacitor.Plugins.Valhalla.route({
          start: { lat: from[0], lon: from[1] },
          end: { lat: to[0], lon: to[1] },
          profile: mode === 'walk' ? 'pedestrian' : 'auto'
        });
        const endTime = performance.now();

        dbg(`✅ Route calculated in ${(endTime - startTime).toFixed(0)}ms | Dist: ${res.distance.toFixed(2)} km`);
        document.getElementById('route-result').innerHTML = `<b>${res.distance.toFixed(2)} km</b> · ${Math.round(res.duration / 60)} min`;

        if (res.geometry) {
          const coords = decodeValhallaPolyline(res.geometry);
          dbg(`📏 Route decoded: ${coords.length} coordinate points`);
          drawRoute(coords);
        }
      } catch (e) {
        dbg('❌ Route error: ' + e.message);
        document.getElementById('route-result').innerText = 'Failed';
      }
    }

    function decodeValhallaPolyline(encoded) {
      let inv = 1 / 1e6, index = 0, lat = 0, lng = 0, coords = [];
      while (index < encoded.length) {
        let b, shift = 0, res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (res & 1 ? ~(res >> 1) : (res >> 1));
        shift = 0; res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (res & 1 ? ~(res >> 1) : (res >> 1));
        coords.push([lng * inv, lat * inv]);
      }
      return coords;
    }

    function drawRoute(coords) {
      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#4ade80', 'line-width': 6, 'line-opacity': 0.8 } });
      map.fitBounds(maplibregl.LngLatBounds.convert([coords[0], coords[coords.length - 1]]), { padding: 50 });
    }

    // ── RAIL DEBUG ────────────────────────────────────────────────────────────
    // Answers two questions:
    //   Q1 — What features/classes are actually in the public_transport layer?
    //        This tells us whether rail lines are there at all, and what class
    //        strings the tile generator used (could be 'rail', 'light_rail',
    //        'tram', or something custom). LineString entries are the tracks.
    //   Q2 — Are the style layers registered and visible?
    // Run by tapping "🚆 Rails" in the debug panel, or call debugRails() in
    // the browser console. Re-run after panning to a known rail area.
    window.debugRails = function () {
      if (!map) { dbg('⚠️ debugRails: map not ready'); return; }
      dbg('🚆 ── Rail Debug (public_transport layer) ──');

      let features = [];
      try {
        features = map.querySourceFeatures('omt', { sourceLayer: 'public_transport' });
      } catch (e) {
        dbg('❌ querySourceFeatures failed: ' + e.message);
        return;
      }

      dbg(`📦 public_transport — ${features.length} features in viewport`);
      if (features.length === 0) {
        dbg('   ⚠️ 0 features. Pan to a rail/transit area and run again.');
      } else {
        // Break down by geometry type AND class so we can see exactly
        // what the tile generator put in this layer.
        const summary = {};
        features.forEach(f => {
          const geomType = f.geometry?.type || '?';
          const cls = f.properties?.class || '(no class)';
          const key = `${geomType} | class="${cls}"`;
          summary[key] = (summary[key] || 0) + 1;
        });
        Object.entries(summary)
          .sort((a, b) => b[1] - a[1])
          .forEach(([key, n]) => {
            const isLine = key.startsWith('LineString');
            dbg(`   ${isLine ? '🚆' : '  '} ${key}: ${n}${isLine ? ' ← potential rail track' : ''}`);
          });
      }

      // Q2: style layer registration
      ['rail-casing', 'rail-line'].forEach(id => {
        const layer = map.getLayer(id);
        if (!layer) {
          dbg(`❌ Style layer "${id}" NOT found — buildStyle() may have errored`);
        } else {
          const vis = map.getLayoutProperty(id, 'visibility') || 'visible';
          dbg(`✅ Style layer "${id}" | visibility: ${vis}`);
        }
      });
      dbg('🚆 ───────────────────────────────────────');
    };

    function inspectMapCenter() {
      if (!map) return;
      const center = map.getCenter();
      const point = map.project(center);

      // Query all rendered features at the center pixel
      const features = map.queryRenderedFeatures(point);

      dbg(`🔍 Inspecting features at map center (${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}) | Zoom: ${map.getZoom().toFixed(1)}`);

      // Group by source-layer and class
      const grouped = {};
      features.forEach(f => {
        const layer = f.layer['source-layer'] || f.layer.id;
        const cls = f.properties.class || f.properties.subclass || 'N/A';
        const key = `${layer} -> ${cls}`;
        if (!grouped[key]) grouped[key] = 0;
        grouped[key]++;
      });

      const keys = Object.keys(grouped).sort();
      if (keys.length === 0) {
        dbg("   ⚠️ No features found at this zoom level / location.");
      } else {
        keys.forEach(k => {
          dbg(`   📦 ${k}: ${grouped[k]} features`);
        });
      }
    }

    function copyDebugLogs() { const t = Array.from(document.getElementById('debug-content').children).map(el => el.innerText).join('\n'); navigator.clipboard.writeText(t).then(() => dbg('✓ Copied')); }
    // ── COORDINATE ORDER DEBUG ────────────────────────────────────────────────
    // Loads any route .json and places a numbered label at every coordinate
    // so you can visually confirm the points are in the right sequential order.
    //
    // Uses MapLibre markers with custom HTML so:
    //   • Numbers are always readable (white text on coloured pill)
    //   • First point (0) = green, last point = red, rest = blue
    //   • All markers are tracked in _coordDebugMarkers so clearCoordDebug()
    //     removes them without affecting any other map layer
    let _coordDebugMarkers = [];

    window.debugRouteCoords = function () {
      const select = document.getElementById('coord-debug-file');
      const status = document.getElementById('coord-debug-status');
      const file = select.value;
      if (!file) { status.textContent = 'Pick a file first.'; return; }

      status.textContent = '⏳ Loading…';
      clearCoordDebug();   // remove any previous set before adding new ones

      fetch(`./data/${file}`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status} — file not in assets/public/data/`);
          return res.json();
        })
        .then(data => {
          const feat = data.features[0];
          const coords = feat.geometry.coordinates;   // each is [lon, lat]
          const total = coords.length;

          // Only label every Nth point when there are a lot, to avoid
          // overlapping labels at tight zoom. Adjust STEP to taste.
          // At step=1 every single point gets a label.
          const STEP = total > 200 ? 5 : total > 100 ? 3 : total > 50 ? 2 : 1;

          coords.forEach(([lon, lat], i) => {
            if (i % STEP !== 0 && i !== total - 1) return;   // always show last

            const isFirst = i === 0;
            const isLast = i === total - 1;
            const bg = isFirst ? '#16a34a' : isLast ? '#dc2626' : '#2563eb';

            // Custom HTML element — a small pill with the index number
            const el = document.createElement('div');
            el.style.cssText = `
              background:${bg}; color:#fff; font-size:9px; font-weight:700;
              padding:1px 4px; border-radius:4px; white-space:nowrap;
              border:1px solid rgba(255,255,255,0.5);
              pointer-events:none; line-height:14px;
            `;
            el.textContent = String(i);

            const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
              .setLngLat([lon, lat])
              .addTo(map);

            _coordDebugMarkers.push(marker);
          });

          const shown = _coordDebugMarkers.length;
          status.textContent = `✅ ${total} coords — showing ${shown} label(s) (step=${STEP}). Green=0, Red=${total - 1}.`;
          dbg(`🔢 Coord debug: ${file} — ${total} points, ${shown} labels shown`);

          // Fly to the first coordinate so it's immediately visible
          map.flyTo({ center: coords[0], zoom: Math.max(map.getZoom(), 14) });
        })
        .catch(err => {
          status.textContent = `❌ ${err.message}`;
          dbg(`❌ Coord debug failed: ${err.message}`);
        });
    };

    window.clearCoordDebug = function () {
      _coordDebugMarkers.forEach(m => m.remove());
      _coordDebugMarkers = [];
      const status = document.getElementById('coord-debug-status');
      if (status) status.textContent = 'Labels cleared.';
    };

    // ── DATA COLLECTION LOGIC ─────────────────────────────────────────────────
    let recordedTrack = [];
    let recordingStartTime = null;
    let markedPoints = [];
    let markedPointMarkers = [];
    let locationMarker = null;
    let watchId = null;
    let isRecording = false;
    let isFollowingLocation = false;

    const dcStatusDot = document.getElementById('dc-status-dot');
    const dcStatusText = document.getElementById('dc-status-text');
    const dcBtnStart = document.getElementById('dc-btn-start');
    const dcBtnStop = document.getElementById('dc-btn-stop');
    const dcInfoText = document.getElementById('dc-info-text');

    function updateDCStatus(state, message) {
      dcStatusDot.className = 'dc-status-dot ' + state;
      dcStatusText.innerText = message;
    }

    function updateLocationMarker(lat, lon) {
      if (!locationMarker) {
        const el = document.createElement('div');
        el.className = 'location-marker';
        locationMarker = new maplibregl.Marker({ element: el })
          .setLngLat([lon, lat])
          .addTo(map);
      } else {
        locationMarker.setLngLat([lon, lat]);
      }

      // Auto-center map if follow mode is active
      if (isFollowingLocation) {
        map.easeTo({ center: [lon, lat], duration: 500 });
      }
    }

    function markCurrentPoint() {
      if (!navigator.geolocation) {
        showToast('❌ GPS not supported', true);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;

          // Get type from the dropdown (defaults to "point")
          const selectElement = document.getElementById('dc-point-type');
          const finalType = selectElement ? selectElement.value : 'point';

          markedPoints.push({
            lon: longitude,
            lat: latitude,
            type: finalType,
            timestamp: new Date().toISOString()
          });

          // Add visual marker to map
          const el = document.createElement('div');
          el.className = `marked-point-marker ${finalType}`;

          // Set icon based on type
          let icon = '📍';
          if (finalType === 'in') icon = '🟢';
          else if (finalType === 'out') icon = '🔴';

          el.innerText = icon;

          const marker = new maplibregl.Marker({ element: el })
            .setLngLat([longitude, latitude])
            .setPopup(new maplibregl.Popup().setHTML(`<b>${finalType.toUpperCase()}</b><br>Lat: ${latitude.toFixed(7)}<br>Lng: ${longitude.toFixed(7)}`))
            .addTo(map);

          markedPointMarkers.push(marker);
          showToast(`✅ Marked as ${finalType}`);
          dbg(`📍 Marked ${finalType} at ${latitude}, ${longitude}`);
        },
        (error) => {
          showToast('❌ Could not get current location', true);
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }

    function requestLocation() {
      updateDCStatus('requesting', '📡 Getting your location...');
      dcInfoText.innerText = 'Please wait...';

      if ("geolocation" in navigator) {
        // Use watchPosition to continuously update location even before pressing Start
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, accuracy, speed, heading } = position.coords;

            // Enable buttons on first successful fix
            if (dcBtnStart.disabled && !isRecording) {
              updateDCStatus('ready', `✅ Location acquired`);
              dcBtnStart.disabled = false;
              document.getElementById('dc-btn-mark').disabled = false;
              map.flyTo({ center: [longitude, latitude], zoom: 16 });
            }

            // Always update the pulsating marker in real-time
            updateLocationMarker(latitude, longitude);

            // Update info text and record if active
            if (isRecording) {
              recordedTrack.push({
                lon: longitude,
                lat: latitude,
                accuracy: accuracy,
                speed: speed,
                heading: heading,
                timestamp: new Date().toISOString()
              });
              dcInfoText.innerText = `Recording: ${recordedTrack.length} pts | Acc: ${Math.round(accuracy)}m | Speed: ${speed ? (speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}`;
            } else {
              dcInfoText.innerText = `Lat: ${latitude.toFixed(7)}, Lng: ${longitude.toFixed(7)} | Accuracy: ${Math.round(accuracy)}m`;
            }
          },
          (error) => {
            console.error("GPS Error:", error);
            if (error.code === 3) { // TIMEOUT
              if (!isRecording) dcInfoText.innerText = '⏳ GPS timed out. Retrying...';
            } else {
              updateDCStatus('', '❌ Location failed');
              dcInfoText.innerText = `Error: ${error.message}. Please enable GPS.`;
            }
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        updateDCStatus('', '❌ GPS not supported');
        dcInfoText.innerText = 'Your device does not support geolocation.';
      }
    }
    // 1. Initialize GPS on load so it's ready before you board
    requestLocation();

    // 2. Start Recording
    function startRecording() {
      const routeName = document.getElementById('dc-route-name').value.trim();
      if (!routeName) {
        alert('Please enter a Route Name first! (e.g., "23 Aller")');
        return;
      }

      recordedTrack = [];
      recordingStartTime = new Date().toISOString();
      isRecording = true;
      dcBtnStart.disabled = true;
      dcBtnStop.disabled = false;
      document.getElementById('dc-route-name').disabled = true;
      updateDCStatus('recording', 'Recording Route...');

      // The watchPosition is already running from requestLocation().
      // It will automatically start pushing to recordedTrack because isRecording is now true.
    }
    // 3. Stop Recording & Auto-Save
    function stopRecording() {
      isRecording = false;
      dcBtnStop.disabled = true;
      updateDCStatus('saved', 'Recording Stopped. Saving...');
      dcInfoText.innerText = `Captured ${recordedTrack.length} points.`;

      saveRecording();

      // We intentionally DO NOT clear watchId here. 
      // This keeps the pulsating marker updating your location in the background 
      // even after you stop recording, ready for the next route.
    }
    function saveRecording() {
      const routeName = document.getElementById('dc-route-name').value.trim() || 'unnamed_route';

      if (recordedTrack.length < 2 && markedPoints.length === 0) {
        alert('Not enough points recorded! Try again.');
        resetDCUI();
        return;
      }

      const coordinates = recordedTrack.map(p => [p.lon, p.lat]);

      const features = [];

      // 1. Add the route line if we have enough points
      if (recordedTrack.length >= 2) {
        features.push({
          type: "Feature",
          properties: {
            name: routeName,
            start_time: recordingStartTime,
            end_time: new Date().toISOString(),
            total_points: recordedTrack.length,
            source: "atlas_data_collection",
            feature_type: "route"
          },
          geometry: {
            type: "LineString",
            coordinates: recordedTrack.map(p => [p.lon, p.lat])
          }
        });
      }

      // 2. Add all marked points as separate Point features
      markedPoints.forEach((pt, idx) => {
        features.push({
          type: "Feature",
          properties: {
            name: `${routeName} - ${pt.type} ${idx + 1}`,
            point_type: pt.type,
            timestamp: pt.timestamp,
            source: "atlas_data_collection",
            feature_type: "marked_point"
          },
          geometry: {
            type: "Point",
            coordinates: [pt.lon, pt.lat]
          }
        });
      });

      const geojson = {
        type: "FeatureCollection",
        features: features
      };

      const geojsonStr = JSON.stringify(geojson, null, 2);
      const filename = `${routeName.replace(/\s+/g, '_').toLowerCase()}.geojson`;

      // ── Show the modal with the content (ALWAYS works) ──
      const modal = document.getElementById('save-modal');
      const textarea = document.getElementById('save-modal-textarea');
      textarea.value = geojsonStr;
      modal.classList.add('open');

      // Store for sharing
      window._lastSavedFile = { filename, content: geojsonStr };

      // ── Try to download (works on desktop browsers) ──
      try {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(geojsonStr);
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", filename);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        dbg(`💾 Download triggered: ${filename}`);
      } catch (e) {
        dbg(`⚠️ Download failed: ${e.message}`);
      }

      // ── Try to save via Capacitor Filesystem (Android/iOS) ──
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem) {
        Capacitor.Plugins.Filesystem.writeFile({
          path: filename,
          data: geojsonStr,
          directory: 'DOCUMENTS',
          encoding: 'utf8', // <-- FORCE UTF-8 TO PREVENT GARBLED TEXT
          recursive: true
        }).then(result => {
          dbg(`✅ Saved to Capacitor: ${result.uri}`);
          showToast(`✅ Saved to Documents/${filename}`);
        }).catch(err => {
          dbg(`⚠️ Capacitor save failed: ${err.message}`);
        });
      }
    }

    function copyModalContent() {
      const textarea = document.getElementById('save-modal-textarea');
      textarea.select();
      textarea.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(textarea.value).then(() => {
        showToast('✅ Copied to clipboard!');
        dbg('📋 GeoJSON copied to clipboard');
      }).catch(err => {
        // Fallback for older browsers
        document.execCommand('copy');
        showToast('✅ Copied!');
      });
    }

    function closeSaveModal() {
      document.getElementById('save-modal').classList.remove('open');
      resetDCUI();
    }

    function toggleFollowMode() {
      isFollowingLocation = !isFollowingLocation;
      const btn = document.getElementById('dc-btn-follow');
      if (!btn) return;

      if (isFollowingLocation) {
        btn.classList.add('active');
        btn.innerText = '🔓 Unfollow';
        // Immediately center on current location if we have it
        if (locationMarker) {
          const lngLat = locationMarker.getLngLat();
          map.flyTo({ center: lngLat, zoom: 17 });
        }
      } else {
        btn.classList.remove('active');
        btn.innerText = '🎯 Follow';
      }
    }


    // 5. Reset UI for next route
    function resetDCUI() {
      recordedTrack = [];
      markedPoints = [];

      // Remove all marked point markers from the map
      markedPointMarkers.forEach(m => m.remove());
      markedPointMarkers = [];

      document.getElementById('dc-route-name').value = '';
      document.getElementById('dc-route-name').disabled = false;
      dcBtnStart.disabled = false;
      document.getElementById('dc-btn-mark').disabled = false;

      updateDCStatus('ready', 'GPS Ready. Enter route name and press Start.');
      dcInfoText.innerText = 'Waiting for next recording...';
    }
    // ── ROUTE NAVIGATOR & HOME MARKERS ──────────────────────────────────────
    let stepMarkers = [];
    let homeMarkers = [];

    const homePoints = [
      { lat: 36.8037336, lon: 10.1780922, text: "🏠 Home: through 89" },
      { lat: 36.7976742, lon: 10.162871, text: "🏠 Home: through 89, 33B" },
      { lat: 36.788588, lon: 10.1803401, text: "🏠 Home: through 32 A" },
      { lat: 36.7184497, lon: 10.1616443, text: "🏠 Home: through 33" },
      { lat: 36.7251325, lon: 10.3061252, text: "🏠 Home: 85 first then i take 33" },
      { lat: 36.7984512, lon: 10.106279, text: "🏠 Home: through 87" }
    ];

    function renderHomeMarkers() {
      homeMarkers.forEach(m => m.remove());
      homeMarkers = [];
      homePoints.forEach(pt => {
        const el = document.createElement('div');
        el.className = 'custom-marker-home';
        el.innerText = '🏠';
        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([pt.lon, pt.lat])
          .setPopup(new maplibregl.Popup({ offset: 25, maxWidth: '250px' }).setHTML(pt.text))
          .addTo(map);
        homeMarkers.push(marker);
      });
    }

    function drawPrimaryPath() {
      // Clear previous markers
      stepMarkers.forEach(m => m.remove());
      stepMarkers = [];

      // Fetch the routes data
      fetch('./data/routes.json')
        .then(res => {
          if (!res.ok) throw new Error('routes.json not found');
          return res.json();
        })
        .then(data => {
          // Find the first path (the primary "all YES" path)
          const primaryPath = data.paths[0];

          if (!primaryPath) {
            document.getElementById('nav-info').innerHTML = 'No routes found.';
            return;
          }

          document.getElementById('nav-info').innerHTML = `<b>Primary Route:</b> ${primaryPath.name}`;

          // Draw all points for the primary path
          primaryPath.points.forEach((pt, index) => {
            const stepNum = index + 1;
            const label = pt.label.replace(/\|/g, '<br>');

            // Generate a small random offset (approx +/- 5 meters) to prevent overlapping
            const randomOffsetLat1 = (Math.random() - 0.5) * 0.0001;
            const randomOffsetLng1 = (Math.random() - 0.5) * 0.0001;

            const randomOffsetLat2 = (Math.random() - 0.5) * 0.0001;
            const randomOffsetLng2 = (Math.random() - 0.5) * 0.0001;

            // 1. Boarding Point Marker (Blue)
            if (pt.boarding_lat != null && pt.boarding_lng != null) {
              const elBoard = document.createElement('div');
              elBoard.className = 'custom-marker-number';
              elBoard.innerText = pt.marker_text || stepNum; // <-- UPDATED LINE
              elBoard.style.background = '#3b82f6'; // Blue for Boarding

              const markerBoard = new maplibregl.Marker({ element: elBoard })
                .setLngLat([pt.boarding_lng + randomOffsetLng1, pt.boarding_lat + randomOffsetLat1])
                .setPopup(new maplibregl.Popup({ offset: 25, maxWidth: '250px' }).setHTML(`<b>Step ${stepNum} - Board Here 🚌</b><br>${label}`))
                .addTo(map);
              stepMarkers.push(markerBoard);
            }

            // 2. Dropping Off Point Marker (Red)
            if (pt.dropping_lat != null && pt.dropping_lng != null) {
              const elDrop = document.createElement('div');
              elDrop.className = 'custom-marker-number';
              elDrop.innerText = pt.marker_text || stepNum; // <-- UPDATED LINE
              elDrop.style.background = '#ef4444'; // Red for Dropping Off

              const markerDrop = new maplibregl.Marker({ element: elDrop })
                .setLngLat([pt.dropping_lng + randomOffsetLng2, pt.dropping_lat + randomOffsetLat2])
                .setPopup(new maplibregl.Popup({ offset: 25, maxWidth: '250px' }).setHTML(`<b>Step ${stepNum} - Get Off Here 🚶</b><br>${label}`))
                .addTo(map);
              stepMarkers.push(markerDrop);
            }
          });

          // ── BRANCH MARKERS ─────────────────────────────────────────────────
          // Scan every path (not just the primary) for points that carry a
          // non-empty marker_text. These represent branch alternatives (like
          // "3B") that belong alongside the primary steps but exist in a
          // secondary path in routes.json. We collect unique boarding/dropping
          // coords so the same physical stop isn't double-plotted if the point
          // appears in more than one non-primary path.
          const branchSeen = new Set();

          data.paths.slice(1).forEach(path => {
            path.points.forEach(pt => {
              if (!pt.marker_text) return; // only process explicitly-labelled branch points
              const label = pt.label.replace(/\|/g, '<br>');

              if (pt.boarding_lat != null && pt.boarding_lng != null) {
                const boardKey = `${pt.boarding_lat},${pt.boarding_lng}`;
                if (!branchSeen.has(boardKey)) {
                  branchSeen.add(boardKey);
                  const el = document.createElement('div');
                  el.className = 'custom-marker-number';
                  el.innerText = pt.marker_text;
                  el.style.background = '#3b82f6'; // same blue as boarding
                  el.style.opacity = '0.85';
                  const m = new maplibregl.Marker({ element: el })
                    .setLngLat([pt.boarding_lng, pt.boarding_lat])
                    .setPopup(new maplibregl.Popup({ offset: 25, maxWidth: '250px' })
                      .setHTML(`<b>Branch ${pt.marker_text} - Board Here 🚌</b><br>${label}`))
                    .addTo(map);
                  stepMarkers.push(m);
                }
              }

              if (pt.dropping_lat != null && pt.dropping_lng != null) {
                const dropKey = `drop:${pt.dropping_lat},${pt.dropping_lng}`;
                if (!branchSeen.has(dropKey)) {
                  branchSeen.add(dropKey);
                  const el = document.createElement('div');
                  el.className = 'custom-marker-number';
                  el.innerText = pt.marker_text;
                  el.style.background = '#ef4444'; // same red as dropping
                  el.style.opacity = '0.85';
                  const m = new maplibregl.Marker({ element: el })
                    .setLngLat([pt.dropping_lng, pt.dropping_lat])
                    .setPopup(new maplibregl.Popup({ offset: 25, maxWidth: '250px' })
                      .setHTML(`<b>Branch ${pt.marker_text} - Get Off Here 🚶</b><br>${label}`))
                    .addTo(map);
                  stepMarkers.push(m);
                }
              }
            });
          });
        })
        .catch(err => {
          console.error(err);
          document.getElementById('nav-info').innerText = "Error loading routes.";
        });
    }
    // ── UI TOGGLE LOGIC ───────────────────────────────────────────────────────
    document.getElementById('ui-toggle-btn').onclick = function () {
      const panel = document.getElementById('data-collection-panel');
      panel.classList.toggle('visible');
      this.innerText = panel.classList.contains('visible') ? '❌' : '⚙️';
    };

    // Initialize everything on load, then render markers once the map is ready
    window.onload = function () {
      init();
      // Small timeout ensures the map object is fully initialized before placing markers
      setTimeout(() => {
        if (map) {
          renderHomeMarkers();
          drawPrimaryPath();
        }
      }, 500);
    };
  </script>
</body>
