<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: file: data: gap: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; img-src 'self' data: blob: file: https:; connect-src 'self' https://localhost https://localhost:* http://localhost http://localhost:* https://*; font-src 'self' data: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <style>
    :root {
      --c-bg: #f5f3f0;
      --c-surface: #ffffff;
      --c-border: rgba(0, 0, 0, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #333333;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    html,
    body {
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      color: var(--c-text);
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
      position: relative;
      touch-action: none;
      background: #c8dff0;
    }

    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    #search-wrap {
      flex: 1;
      position: relative;
      display: none;
      /* Hidden for testing */
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      direction: rtl;
      text-align: right;
    }

    #search-input:not(:placeholder-shown) {
      direction: ltr;
      text-align: left;
    }

    #search-clear {
      cursor: pointer;
      display: none;
      padding: 4px;
      opacity: 0.6;
      font-size: 16px;
    }

    #search-clear.visible {
      display: block;
    }

    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow: hidden;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
    }

    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    #routing-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--c-surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      z-index: 400;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
    }

    #panel.open {
      display: block;
    }

    .route-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--c-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--c-border);
    }

    .route-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .route-input {
      width: 100%;
      min-width: 0;
      /* Crucial: allows grid items to shrink and prevents cutoff */
      box-sizing: border-box;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--c-text);
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
    }

    /* Highlight effect when the user taps the field */
    .route-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
      outline: none;
      background: #ffffff;
    }

    /* Toast Notification Styling */
    #toast {
      position: fixed;
      top: 80px;
      /* Positioned just below the top bar */
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      /* Allows tapping through the message to the map */
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: var(--c-warn);
      color: #92400e;
      /* Dark amber for error text */
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="topbar">
    <div id="search-wrap">
      <div id="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          opacity="0.4">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input id="search-input" type="text" placeholder="وين تحب تمشي؟" autocomplete="off" />
        <span id="search-clear">✕</span>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- NEW: Geolocation Button -->
    <button class="icon-btn" id="btn-geolocate" title="My Location" style="margin-left: auto;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>

    <button class="icon-btn" id="btn-route" title="Route"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg></button>
    <button class="icon-btn" id="btn-debug" title="Debug"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg></button>
  </div>
  <div id="debug-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span
        style="font-weight:600">Debug Logs</span><button onclick="copyDebugLogs()"
        style="background:var(--c-accent);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">📋
        Copy</button></div>
    <div id="debug-content"></div>
  </div>
  <div id="routing-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🗺️ Route</span><button onclick="toggleRoutingPanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px">
      <input id="from-input" class="route-input" type="text" placeholder="From: lat,lng" readonly
        onfocus="setActiveRouteInput('from-input')">
      <span style="color:var(--c-muted);font-size:12px">→</span>
      <input id="to-input" class="route-input" type="text" placeholder="To: lat,lng" readonly
        onfocus="setActiveRouteInput('to-input')">
    </div>


    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button onclick="planRoute('car')"
        style="flex:1;padding:10px;background:var(--c-accent2);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚗
        Car</button>
      <button onclick="planRoute('walk')"
        style="flex:1;padding:10px;background:var(--c-warn);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚶
        Walk</button>
    </div>
    <div id="route-result" style="text-align:center;font-size:13px;color:var(--c-muted);min-height:20px"></div>
  </div>
  <!-- Toast Message Container -->
  <div id="toast"></div>

  <div id="panel">
    <div id="panel-title" style="font-weight:bold;font-size:16px"></div>
    <div id="panel-sub" style="font-size:12px;color:var(--c-muted);margin-bottom:12px"></div>
    <div id="panel-content"></div>
    <button onclick="closePanel()"
      style="width:100%;padding:10px;margin-top:15px;background:var(--c-border);border:none;border-radius:8px;color:var(--c-text)">Close</button>
  </div>

  <script>
    // ── GLOBALS ──────────────────────────────────────────────────────────────
    let map = null;
    let _protocolAdded = false;
    let _fileCache = null;
    let _fetchPromise = null;
    let _offlinePlaces = [];
    let routingClickActive = false;
    let activeRouteInput = null; // Tracks which input is waiting for a map tap
    const PMTILES_PATH = '/data/tunis.pmtiles';

    // ── DEBUG ────────────────────────────────────────────────────────────────
    function dbg(msg) {
      console.log('[Atlas]', msg);
      const content = document.getElementById('debug-content');
      if (!content) return;
      const div = document.createElement('div');
      div.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.1);padding:2px 0';
      div.innerHTML = `<span style="color:var(--c-muted)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
      content.appendChild(div);
      content.scrollTop = content.scrollHeight;
    }

    // ── PMTILES RANGE FETCH POLYFILL (STABLE) ─────────────────────────────────
    const _origFetch = window.fetch;
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      let range = null;
      if (init?.headers) {
        if (typeof init.headers.get === 'function') range = init.headers.get('Range');
        else range = init.headers['Range'] || init.headers['range'];
      }
      if (range && url.includes('tunis.pmtiles')) {
        const match = range.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          if (!_fileCache) {
            if (!_fetchPromise) {
              _fetchPromise = (async () => {
                dbg('📥 Caching PMTiles...');
                try {
                  const r = await _origFetch.call(window, url);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const buf = await r.arrayBuffer();
                  _fileCache = buf;
                  dbg('✅ PMTiles Cached');
                  return _fileCache;
                } catch (e) {
                  dbg('❌ Cache Failed: ' + e.message);
                  _fetchPromise = null;
                  throw e;
                }
              })();
            }
            await _fetchPromise;
          }
          if (_fileCache) {
            const start = parseInt(match[1]), end = parseInt(match[2]);
            const slice = _fileCache.slice(start, end + 1);
            return new Response(slice, { status: 206, headers: { 'Content-Range': `bytes ${start}-${end}/${_fileCache.byteLength}`, 'Content-Length': String(slice.byteLength), 'Content-Type': 'application/octet-stream' } });
          }
        }
      }
      return _origFetch.apply(window, arguments);
    };

    // ── STYLE BUILDER (FULL ORIGINAL THEME RE-INTEGRATED) ─────────────────────
    async function buildStyle(theme) {
      const isDark = theme === 'dark';
      const c = isDark ? {
        bg: '#0a0e14', land: '#121826', water: '#0d253f', waterLine: '#1a4a7a', ocean: '#081a33',
        forest: '#1a3a2e', park: '#1e4a3a', grass: '#2a3a2e', sand: '#3a3a2a', beach: '#4a4a3a', industrial: '#2a2a3a', residential: '#1a1e2a', cemetery: '#2a2a3a', wetland: '#1a2a3a', scrub: '#2a3a2e',
        roadMotorway: '#f07030', roadTrunk: '#e86820', roadPrimary: '#d05818', roadSecondary: '#b05030', roadMinor: '#8a5040', roadPath: '#6a4030', roadRail: '#5a4a6a',
        building: '#1e2230', buildingTop: '#2a2e3c', buildingOutline: '#3a3a4a',
        siteSchool: '#1e3a3a', siteHospital: '#3a2a3a', siteParking: '#2a2a3a',
        placeLabel: '#b8c8e8', roadLabel: '#9aa8c8', poiLabel: '#a8b8d8', waterLabel: '#7a9ab8', addressLabel: '#8a9ab8',
        boundary: '#4a4a6a', boundaryDisputed: '#6a4a5a', poiIcon: '#8a9ab8', ferry: '#2a4a7a', aerialway: '#5a5a7a', halo: '#0a0e14', haloLight: 'rgba(10,14,20,0.85)'
      } : {
        bg: '#f5f3f0', land: '#f5f3f0', water: '#c8dff0', waterLine: '#88b0d0', ocean: '#b8d0e8',
        forest: '#d4e8c8', park: '#ddeedd', grass: '#e8f0dc', sand: '#f0e8d0', beach: '#f8f0e0', industrial: '#e4e0e8', residential: '#efefef', cemetery: '#e0e0d8', wetland: '#ccddf0', scrub: '#dce8d0',
        roadMotorway: '#e8952a', roadTrunk: '#e8952a', roadPrimary: '#f0b050', roadSecondary: '#f8d090', roadMinor: '#ffffff', roadPath: '#e8e0d8', roadRail: '#aaaaaa',
        building: '#e8e4de', buildingTop: '#f0ece8', buildingOutline: '#d0ccc8',
        siteSchool: '#eaf0e0', siteHospital: '#f0e8e8', siteParking: '#ececec',
        placeLabel: '#333333', roadLabel: '#666666', poiLabel: '#555555', waterLabel: '#4a7a9a', addressLabel: '#888888',
        boundary: '#bbbbbb', boundaryDisputed: '#cc9999', poiIcon: '#777777', ferry: '#88b0d0', aerialway: '#aaaaaa', halo: '#f5f3f0', haloLight: 'rgba(245,243,240,0.9)'
      };

      const PMTILES_URL = 'pmtiles://' + new URL('./data/tunis.pmtiles', window.location.href).href;
      const spriteUrl = new URL('./sprites/sprites', window.location.href).href;
      const glyphsUrl = new URL('./font', window.location.href).href + '/{fontstack}/{range}.pbf';

      const style = {
        version: 8, name: "Tunis Professional", sources: { omt: { type: 'vector', url: PMTILES_URL } },
        sprite: spriteUrl, glyphs: glyphsUrl, layers: []
      };

      style.layers.push({ id: 'background', type: 'background', paint: { 'background-color': isDark ? c.ocean : c.ocean } });
      style.layers.push({ id: 'land-polygons', type: 'fill', source: 'omt', 'source-layer': 'land_polygons', paint: { 'fill-color': c.land } });
      style.layers.push({ id: 'land-base', type: 'fill', source: 'omt', 'source-layer': 'land', paint: { 'fill-color': c.land } });
      style.layers.push({ id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water_polygons', paint: { 'fill-color': c.water } });
      style.layers.push({ id: 'water-lines', type: 'line', source: 'omt', 'source-layer': 'water_lines', minzoom: 4, filter: ['in', 'class', 'river', 'stream', 'canal'], paint: { 'line-color': c.waterLine, 'line-width': { stops: [[10, 0.8], [14, 2]] } } });

      const landCoverTypes = [
        { kind: 'forest', color: c.forest, minzoom: 11 }, { kind: 'park', color: c.park, minzoom: 12, filter: ['in', 'class', 'park', 'recreation_ground'] },
        { kind: 'grass', color: c.grass, minzoom: 12, filter: ['in', 'class', 'grass', 'meadow'] }, { kind: 'sand', color: c.sand, minzoom: 12, filter: ['in', 'class', 'sand', 'beach'] },
        { kind: 'cemetery', color: c.cemetery, minzoom: 14 }, { kind: 'wetland', color: c.wetland, minzoom: 13 }, { kind: 'scrub', color: c.scrub, minzoom: 13 },
        { kind: 'residential', color: c.residential, minzoom: 13 }, { kind: 'industrial', color: c.industrial, minzoom: 13, filter: ['in', 'class', 'industrial', 'commercial', 'retail'] }
      ];
      landCoverTypes.forEach(cfg => {
        style.layers.push({ id: `land-${cfg.kind}`, type: 'fill', source: 'omt', 'source-layer': 'land', minzoom: cfg.minzoom, filter: cfg.filter || ['==', 'class', cfg.kind], paint: { 'fill-color': cfg.color, 'fill-opacity': 0.6 } });
      });

      style.layers.push(
        { id: 'sites-university', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['in', 'class', 'university', 'college'], minzoom: 13, paint: { 'fill-color': isDark ? '#6d597a' : '#e0d1ea', 'fill-opacity': 0.7 } },
        { id: 'sites-school', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['==', 'class', 'school'], minzoom: 13, paint: { 'fill-color': isDark ? '#52796f' : '#b7d4c8', 'fill-opacity': 0.7 } },
        { id: 'sites-hospital', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['==', 'class', 'hospital'], minzoom: 13, paint: { 'fill-color': isDark ? '#a44a3f' : '#f2c6c2', 'fill-opacity': 0.7 } },
        { id: 'sites-park', type: 'fill', source: 'omt', 'source-layer': 'sites', filter: ['in', 'class', 'park', 'garden'], minzoom: 13, paint: { 'fill-color': isDark ? '#2d6a4f' : '#74c69d', 'fill-opacity': 0.7 } }
      );

      style.layers.push(
        { id: 'aeroway-apron', type: 'fill', source: 'omt', 'source-layer': 'aeroways', filter: ['in', 'class', 'apron', 'terminal'], minzoom: 10, paint: { 'fill-color': isDark ? '#2a2a38' : '#d8d8e4' } },
        { id: 'aeroway-runway', type: 'line', source: 'omt', 'source-layer': 'aeroways', filter: ['==', 'class', 'runway'], minzoom: 10, paint: { 'line-color': isDark ? '#4a4a5a' : '#b8b8c8', 'line-width': { stops: [[10, 4], [14, 30]] } } }
      );

      const roadStyles = [
        { kinds: ['motorway', 'trunk'], color: c.roadMotorway, widths: { stops: [[6, 1], [14, 8]] }, minzoom: 6 },
        { kinds: ['primary', 'secondary'], color: c.roadPrimary, widths: { stops: [[10, 0.8], [14, 5]] }, minzoom: 10 },
        { kinds: ['tertiary'], color: c.roadSecondary, widths: { stops: [[12, 0.8], [14, 4]] }, minzoom: 12 },
        { kinds: ['residential', 'service', 'footway', 'path'], color: c.roadMinor, widths: { stops: [[13, 0.5], [18, 6]] }, minzoom: 13 }
      ];
      roadStyles.forEach(cfg => {
        style.layers.push({ id: `streets-${cfg.kinds[0]}`, type: 'line', source: 'omt', 'source-layer': 'streets', filter: ['in', 'class', ...cfg.kinds], minzoom: cfg.minzoom, layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': cfg.color, 'line-width': cfg.widths } });
      });

      style.layers.push({ id: 'bridges-streets', type: 'line', source: 'omt', 'source-layer': 'streets', minzoom: 13, filter: ['==', ['get', 'bridge'], 'yes'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': isDark ? '#e6b800' : '#c49000', 'line-width': { stops: [[12, 2.5], [18, 13]] } } });
      style.layers.push({ id: 'buildings', type: 'fill', source: 'omt', 'source-layer': 'buildings', minzoom: 13, paint: { 'fill-color': c.building, 'fill-outline-color': c.buildingOutline, 'fill-opacity': 0.7 } });

      const spriteAlias = { 'icon-platform': 'icon-bus', 'icon-stop_position': 'icon-bus', 'icon-light_rail': 'icon-rail', 'icon-museum': 'icon-historic', 'icon-park': 'icon-pitch', 'icon-garden': 'icon-pitch' };
      const poiIconExpr = ['case', ['all', ['has', 'class'], ['!=', ['get', 'class'], '']], ['coalesce', ['get', ['concat', 'icon-', ['get', 'class']], ['literal', spriteAlias]], ['concat', 'icon-', ['get', 'class']]], ['all', ['has', 'kind'], ['!=', ['get', 'kind'], '']], ['coalesce', ['get', ['concat', 'icon-', ['get', 'kind']], ['literal', spriteAlias]], ['concat', 'icon-', ['get', 'kind']]], 'icon-shop'];

      style.layers.push({ id: 'public-transport', type: 'symbol', source: 'omt', 'source-layer': 'public_transport', minzoom: 13, layout: { 'icon-image': poiIconExpr, 'icon-optional': true, 'text-field': '{name}', 'text-font': ['Noto Sans Regular'], 'text-size': 10, 'text-anchor': 'top', 'text-offset': [0, 0.5] }, paint: { 'text-color': c.poiLabel, 'text-halo-color': c.haloLight, 'text-halo-width': 1 } });
      style.layers.push({ id: 'pois', type: 'symbol', source: 'omt', 'source-layer': 'pois', minzoom: 14, layout: { 'icon-image': poiIconExpr, 'icon-optional': true, 'text-field': '{name}', 'text-font': ['Noto Sans Regular'], 'text-size': 11, 'text-anchor': 'top', 'text-offset': [0, 0.6] }, paint: { 'text-color': c.poiLabel, 'text-halo-color': c.haloLight, 'text-halo-width': 1 } });
      style.layers.push({ id: 'place-labels', type: 'symbol', source: 'omt', 'source-layer': 'place_labels', layout: { 'text-field': '{name}', 'text-font': ['Noto Sans Bold'], 'text-size': { stops: [[7, 12], [10, 16]] } }, paint: { 'text-color': c.placeLabel, 'text-halo-color': c.halo, 'text-halo-width': 1.5 } });
      style.layers.push({ id: 'street-labels', type: 'symbol', source: 'omt', 'source-layer': 'street_labels', minzoom: 13, layout: { 'symbol-placement': 'line', 'text-field': '{name}', 'text-font': ['Noto Sans Regular'], 'text-size': 11 }, paint: { 'text-color': c.roadLabel, 'text-halo-color': c.haloLight, 'text-halo-width': 1 } });

      return style;
    }

    // ── INITIALIZATION ───────────────────────────────────────────────────────
    async function init() {
      dbg('🚀 Booting Atlas...');
      try {
        maplibregl.setRTLTextPlugin('./lib/mapbox-gl-rtl-text.js', null, true);
        const pmtilesUrl = new URL('./data/tunis.pmtiles', window.location.href).href;
        if (!_protocolAdded) {
          const protocol = new pmtiles.Protocol();
          maplibregl.addProtocol('pmtiles', protocol.tile);
          protocol.add(new pmtiles.PMTiles(pmtilesUrl));
          _protocolAdded = true;
          dbg('✅ Protocol Ready');
        }

        const style = await buildStyle('light');
        map = new maplibregl.Map({
          container: 'map', style, center: [10.1815, 36.8065], zoom: 13,
          attributionControl: false, antialias: false, maxTileCacheSize: 20,
          failIfMajorPerformanceCaveat: false
        });

        map.on('load', () => { dbg('✓ MAP LOADED'); map.resize(); });
        map.on('error', e => { if (!e.error?.message?.includes('canceled')) dbg('❌ MAP ERR: ' + (e.error?.message || e.message || 'Unknown')); });

        window.map = map;
        setupUI();
        initOfflineSearch();
      } catch (e) { dbg('❌ FATAL: ' + e.message); }
    }

    function setupUI() {
      document.getElementById('btn-debug').onclick = () => document.getElementById('debug-panel').classList.toggle('show');
      document.getElementById('btn-route').onclick = toggleRoutingPanel;
      document.getElementById('search-clear').onclick = clearSearch;

      let userMarker = null; // Variable to keep track of the location marker

      // Geolocation button logic
      document.getElementById('btn-geolocate').onclick = () => {
        if (navigator.geolocation) {
          dbg('📍 Requesting location...');
          showToast('📍 Finding your location...');

          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              const coords = [longitude, latitude];

              // 1. Fly to the location
              map.flyTo({ center: coords, zoom: 15 });

              // 2. Add or update the marker
              if (userMarker) {
                userMarker.setLngLat(coords);
              } else {
                userMarker = new maplibregl.Marker({ color: '#4ade80' })
                  .setLngLat(coords)
                  .addTo(map);
              }

              dbg(`✅ Location found: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
              showToast('✅ Location found!');
            },
            (error) => {
              dbg('❌ Geolocation error: ' + error.message);
              let msg = 'Could not find your location.';

              // Check specific error codes for better user feedback
              if (error.code === 1) { // PERMISSION_DENIED
                msg = '🚫 Location access denied. Please enable it in your phone settings.';
              } else if (error.code === 2) { // POSITION_UNAVAILABLE
                msg = '📡 Location unavailable. GPS works best outdoors with a clear view of the sky.';
              } else if (error.code === 3) { // TIMEOUT
                msg = '⏳ Location request timed out. Try again, preferably outdoors.';
              }

              showToast(msg, true); // 'true' makes it show the error styling
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        } else {
          dbg('❌ Geolocation not supported');
          showToast('❌ Geolocation is not supported by this device.', true);
        }
      };
      // ── MAP CLICK LOGIC ──────────────────────────────────────────────────
      map.on('click', e => {
        const { lat, lng } = e.lngLat;
        const v = `${lat.toFixed(5)},${lng.toFixed(5)}`;

        // 1. Check if an input field is actively selected for picking
        if (activeRouteInput) {
          document.getElementById(activeRouteInput).value = v;
          dbg(`✅ Set ${activeRouteInput} to ${v}`);

          // Remove focus so it doesn't stay highlighted green
          document.activeElement.blur();
          activeRouteInput = null;
          return;
        }

        // 2. Fallback for routing mode (if they just open panel and tap map without focusing an input)
        if (routingClickActive) {
          const from = document.getElementById('from-input'), to = document.getElementById('to-input');
          if (!from.value) from.value = v;
          else if (!to.value) { to.value = v; dbg('🏁 Points set'); }
          return;
        }

        // 3. Default map click behavior (shows the bottom info panel)
        showPanel(`${lat.toFixed(5)}, ${lng.toFixed(5)}`, 'Tapped location',
          `<div class="route-card" onclick="setRouteDest(${lat},${lng})"><div class="route-icon" style="background:rgba(74,222,128,.15)">📍</div><div><b>Route here</b><br><small>Set as destination</small></div></div>`);
      });
    }
    // ── SEARCH ────────────────────────────────────────────────────────────────
    async function initOfflineSearch() {
      try {
        const r = await fetch('./data/places.json');
        _offlinePlaces = await r.json();
        dbg(`🔍 Loaded ${_offlinePlaces.length} places`);
      } catch (e) { dbg('❌ Search load failed'); }

      const input = document.getElementById('search-input'), resultsEl = document.getElementById('search-results');
      input.addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
        if (q.length < 2) { resultsEl.classList.remove('open'); return; }
        const matches = _offlinePlaces.filter(p => (p.na || '').toLowerCase().includes(q) || (p.nl || '').toLowerCase().includes(q) || (p.n || '').toLowerCase().includes(q)).slice(0, 10);
        resultsEl.innerHTML = matches.map(p => `<div class="search-result-item" onclick="goToPlace(${p.lo},${p.la},'${(p.na || p.nl || p.n).replace(/'/g, "\\'")}')"><div class="sri-icon">📍</div><div><div class="sri-name">${p.na || p.nl || p.n}</div><div class="sri-sub">${p.c || ''}</div></div></div>`).join('');
        resultsEl.classList.add('open');
      });
    }

    window.goToPlace = (lon, lat, name) => {
      map.flyTo({ center: [lon, lat], zoom: 15 });
      document.getElementById('search-input').value = name;
      document.getElementById('search-results').classList.remove('open');
    };

    function clearSearch() { document.getElementById('search-input').value = ''; document.getElementById('search-results').classList.remove('open'); document.getElementById('search-clear').classList.remove('visible'); }

    // ── ROUTING ──────────────────────────────────────────────────────────────
    // Called when the user taps the input field
    window.setActiveRouteInput = (id) => {
      activeRouteInput = id;
      dbg(`🎯 Waiting for map tap for ${id}`);
    };
    function toggleRoutingPanel() {
      const p = document.getElementById('routing-panel');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
      routingClickActive = p.style.display === 'block';
      document.getElementById('btn-route').classList.toggle('active', routingClickActive);
    }

    function setRouteDest(lat, lng) {
      document.getElementById('to-input').value = `${lat.toFixed(5)},${lng.toFixed(5)}`;
      toggleRoutingPanel();
      closePanel();
    }

    async function planRoute(mode) {
      const fromS = document.getElementById('from-input').value, toS = document.getElementById('to-input').value;
      if (!fromS || !toS) { dbg('⚠ Enter both points'); return; }
      const from = fromS.split(',').map(Number), to = toS.split(',').map(Number);
      document.getElementById('route-result').innerText = 'Calculating...';
      try {
        const { Plugins } = Capacitor;
        const res = await Plugins.Valhalla.route({ start: { lat: from[0], lon: from[1] }, end: { lat: to[0], lon: to[1] }, profile: mode === 'walk' ? 'pedestrian' : 'auto' });
        dbg(`✅ Route: ${res.distance.toFixed(2)} km`);
        document.getElementById('route-result').innerHTML = `<b>${res.distance.toFixed(2)} km</b> · ${Math.round(res.duration / 60)} min`;
        if (res.geometry) drawRoute(decodeValhallaPolyline(res.geometry));
      } catch (e) { dbg('❌ Route error: ' + e.message); document.getElementById('route-result').innerText = 'Failed'; }
    }

    function decodeValhallaPolyline(encoded) {
      let inv = 1 / 1e6, index = 0, lat = 0, lng = 0, coords = [];
      while (index < encoded.length) {
        let b, shift = 0, res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (res & 1 ? ~(res >> 1) : (res >> 1));
        shift = 0; res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (res & 1 ? ~(res >> 1) : (res >> 1));
        coords.push([lng * inv, lat * inv]);
      }
      return coords;
    }

    function drawRoute(coords) {
      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#4ade80', 'line-width': 6, 'line-opacity': 0.8 } });
      map.fitBounds(maplibregl.LngLatBounds.convert([coords[0], coords[coords.length - 1]]), { padding: 50 });
    }

    // ── UI HELPERS ───────────────────────────────────────────────────────────
    // ── UI HELPERS ───────────────────────────────────────────────────────────
    let toastTimeout;
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = message;
      toast.classList.add('show');
      if (isError) toast.classList.add('error');
      else toast.classList.remove('error');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show', 'error');
      }, 4000); // Hides after 4 seconds
    }

    function showPanel(title, sub, content) { document.getElementById('panel-title').innerText = title; document.getElementById('panel-sub').innerText = sub; document.getElementById('panel-content').innerHTML = content; document.getElementById('panel').classList.add('open'); } function closePanel() { document.getElementById('panel').classList.remove('open'); }
    function copyDebugLogs() { const t = Array.from(document.getElementById('debug-content').children).map(el => el.innerText).join('\n'); navigator.clipboard.writeText(t).then(() => dbg('✓ Copied')); }

    window.onload = init;
  </script>
