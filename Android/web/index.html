<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' file: data: gap: https://ssl.gstatic.com;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    worker-src blob:;
    img-src 'self' data: blob: file:;
    connect-src 'self' http://localhost http://localhost:* https://*;
    font-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <script src="./lib/mapbox-gl-rtl-text.js"></script>
  <style>
    :root {
      --c-bg: #0f1117;
      --c-surface: #1c1f2b;
      --c-border: rgba(255, 255, 255, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #e8eaf0;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--c-bg);
      color: var(--c-text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
      position: relative
    }

    /* ── Top bar ── */
    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    /* ── Search wrap (holds input + dropdown) ── */
    #search-wrap {
      flex: 1;
      position: relative;
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      transition: border-color .2s, box-shadow .2s;
    }

    #search-box:focus-within {
      border-color: rgba(129, 140, 248, .5);
      box-shadow: 0 4px 32px rgba(129, 140, 248, .15);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      font-family: inherit;
      text-align: right;
      direction: rtl;
    }

    #search-input::placeholder {
      color: var(--c-muted);
      font-size: 14px;
    }

    #search-input:not(:placeholder-shown) {
      text-align: left;
      direction: ltr;
    }

    #search-clear {
      cursor: pointer;
      opacity: 0;
      font-size: 16px;
      color: var(--c-muted);
      transition: opacity .15s;
      display: none;
      padding: 2px 4px;
    }

    #search-clear.visible {
      display: block;
      opacity: 0.6;
    }

    /* ── Results dropdown ── */
    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
      display: none;
      z-index: 200;
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, .04);
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      line-height: 1.3;
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .search-no-results {
      padding: 16px;
      text-align: center;
      color: var(--c-muted);
      font-size: 13px;
    }

    /* ── Flag button ── */
    #btn-flag {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      flex-shrink: 0;
      transition: border-color .15s;
    }

    #btn-flag:hover {
      border-color: rgba(255, 255, 255, .2);
    }

    /* ── Debug button ── */
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--c-accent);
      color: var(--c-accent);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
      border-color: var(--c-accent);
    }

    /* ── Debug panel ── */
    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      line-height: 1.8;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    /* ── Boundary highlight ── */
    .boundary-pulse {
      animation: bPulse 2s ease-out forwards;
    }

    @keyframes bPulse {
      0% {
        opacity: 0.8;
      }

      60% {
        opacity: 0.5;
      }

      100% {
        opacity: 0.25;
      }
    }

    /* ── MapLibre overrides ── */
    .maplibregl-ctrl-group {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: var(--r) !important;
    }

    .maplibregl-ctrl-group button {
      background: none !important;
      width: 36px !important;
      height: 36px !important;
    }

    .maplibregl-ctrl-group button span {
      filter: invert(1) !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 24px;
      right: 12px;
    }

    .maplibregl-popup-content {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: 8px !important;
      color: var(--c-text) !important;
      font-family: inherit !important;
      font-size: 13px !important;
      padding: 10px 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4) !important;
    }

    .maplibregl-popup-tip {
      display: none !important;
    }

    @media(max-width:480px) {
      #topbar {
        top: 10px;
        left: 8px;
        right: 8px;
      }
    }

    .maplibregl-ctrl-group {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: var(--r) !important;
      backdrop-filter: blur(12px)
    }

    .maplibregl-ctrl-group button {
      background: none !important;
      border-color: var(--c-border) !important;
      width: 36px !important;
      height: 36px !important
    }

    .maplibregl-ctrl-group button span {
      filter: invert(1) !important
    }

    .maplibregl-ctrl-attrib {
      display: none !important
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 24px;
      right: 12px
    }

    .gps-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--c-accent2);
      border: 3px solid white;
      box-shadow: 0 0 0 4px rgba(129, 140, 248, .3);
      animation: gpsPulse 2s infinite
    }

    @keyframes gpsPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(129, 140, 248, .5)
      }

      70% {
        box-shadow: 0 0 0 12px rgba(129, 140, 248, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(129, 140, 248, 0)
      }
    }

    @media(max-width:480px) {
      :root {
        --panel-w: calc(100vw - 24px)
      }
    }

    /* Pulsing route animation */
    @keyframes routePulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .route-pulse {
      animation: routePulse 2s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <!-- ✅ ONLY THE MAP -->
  <div id="map"></div>

  <!-- ✅ ONLY SEARCH + DEBUG BUTTON -->
  <div id="topbar">
    <div id="search-wrap">
      <div id="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          opacity="0.4">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input id="search-input" type="text" placeholder="وين تحب تمشي؟" autocomplete="off" dir="auto" />
        <span id="search-clear" onclick="clearSearch()">✕</span>
      </div>
      <div id="search-results"></div>
    </div>

    <button id="btn-flag" title="English" onclick="/* future */">
      🇬🇧
    </button>

    <button class="icon-btn" id="btn-debug" onclick="toggleDebug()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
    </button>
  </div>

  <!-- ✅ DEBUG PANEL (kept for development) -->
  <div id="debug-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">Debug Logs</span>
      <button onclick="copyDebugLogs()"
        style="background:var(--c-accent);color:#0f1117;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">📋
        Copy</button>
    </div>
    <div id="debug-content" style="max-height:180px;overflow-y:auto"></div>
  </div>

  <!-- ✅ ADD THIS PANEL for offline search results -->
  <div id="panel" style="display:none">
    <div class="panel-handle"></div>
    <div class="panel-title" id="panel-title"></div>
    <div class="panel-sub" id="panel-sub"></div>
    <div id="panel-content"></div>
  </div>
  <script>
    maplibregl.setRTLTextPlugin('./lib/mapbox-gl-rtl-text.js', null, true);

    const PMTILES_PATH = '/data/tunis.pmtiles';
    let _fileCache = null;
    const _origFetch = window.fetch;

    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      const rangeHeader = init?.headers?.Range || init?.headers?.range ||
        (init?.headers instanceof Headers ? init.headers.get('Range') : null);

      if (rangeHeader && url.includes(PMTILES_PATH)) {
        const match = rangeHeader.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          const start = parseInt(match[1]);
          const end = parseInt(match[2]);
          if (!_fileCache) {
            dbg('caching pmtiles file…');
            const r = await _origFetch.call(this, url);
            _fileCache = await r.arrayBuffer();
            dbg('cached: ' + _fileCache.byteLength + ' bytes');
          }
          const slice = _fileCache.slice(start, end + 1);
          return new Response(slice, {
            status: 206,
            statusText: 'Partial Content',
            headers: {
              'Content-Type': 'application/octet-stream',
              'Content-Range': `bytes ${start}-${end}/${_fileCache.byteLength}`,
              'Content-Length': String(slice.byteLength),
            }
          });
        }
      }
      return _origFetch.apply(this, arguments);
    };
    dbg('range-fetch polyfill active');
    // ════════════════════════════════════════════════════════════════════════

    const PMTILES_HTTP_URL = new URL('./data/tunis.pmtiles', window.location.href).href;
    const PMTILES_STYLE_URL = 'pmtiles://' + PMTILES_HTTP_URL;

    dbg('PMTiles HTTP URL: ' + PMTILES_HTTP_URL);
    dbg('PMTiles style URL: ' + PMTILES_STYLE_URL);

    // ✅ ADD THIS LINE
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // ✅ register the file correctly
    const pmtilesFile = new pmtiles.PMTiles(PMTILES_HTTP_URL);
    protocol.add(pmtilesFile);

    // ── 3. Build full OpenMapTiles v3.11 style ────────────────────────────────
    //    Layer names confirmed from: pmtiles show data/tunis.pmtiles
    //    Schema: OpenMapTiles v3.11, id: openmaptiles
    //    Bounds: 9.978–10.493 lng, 36.659–37.008 lat (Tunis metro area)
    // ── Style Loader (uses ./style/style.json) ────────────────────────────────
    let _cachedStyle = null;

    async function buildStyle(theme) {
      const isDark = theme === 'dark';

      // Theme color tokens for overrides
      const c = isDark ? {
        bg: '#0d1017', water: '#111e32', road: '#38405e',
        bld: '#171b27', bldTop: '#1a1f2e',
        rlabel: '#6a7a9a', plabel: '#b8c8e0', poi: '#5a6a88',
        halo: '#0d1017'
      } : {
        bg: '#f5f2ed', water: 'hsl(210,67%,85%)', road: '#fea',
        bld: '#ddd8cf', bldTop: '#c8c4bc',
        rlabel: '#765', plabel: '#333', poi: '#666',
        halo: 'rgba(255,255,255,0.8)'
      };

      // Return cached style if available and theme matches
      if (_cachedStyle && _cachedStyle._theme === theme) {
        return _cachedStyle;
      }

      try {
        // Fetch base style from external JSON
        const res = await fetch('./style/style.json', { cache: 'force-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        let style = await res.json();

        // 🔁 Override source to use local PMTiles (critical for offline)
        style.sources = {
          openmaptiles: {
            type: 'vector',
            url: PMTILES_STYLE_URL  // e.g., 'pmtiles://http://localhost/data/tunis.pmtiles'
          }
        };

        // 🔁 Fix local asset paths
        style.glyphs = './font/{fontstack}/{range}.pbf';
        style.sprite = './sprites/sprite';
        style.spritePixelRatio = 1;

        // 🎨 Apply theme-based paint overrides
        style.layers = style.layers.map(layer => {
          const paint = layer.paint || {};
          const id = layer.id;

          // Background
          if (id === 'background' && paint['background-color']) {
            paint['background-color'] = c.bg;
          }

          // Water fills
          if (id.includes('water') && !id.includes('name') && paint['fill-color']) {
            if (typeof paint['fill-color'] === 'string' && !paint['fill-color'].includes('hsl')) {
              paint['fill-color'] = c.water;
            }
          }

          // Roads (exclude labels/shields)
          if ((id.includes('highway') || id.includes('road')) &&
            !id.includes('name') && !id.includes('shield') &&
            paint['line-color']) {
            if (id.includes('casing')) {
              paint['line-color'] = isDark ? '#252c42' : '#e9ac77';
            } else {
              paint['line-color'] = c.road;
            }
          }

          // Buildings
          if (id === 'building' && paint['fill-color']) {
            paint['fill-color'] = c.bld;
          }
          if (id === 'building-top' && paint['fill-color']) {
            paint['fill-color'] = c.bldTop;
          }

          // Text labels (places, POIs, roads)
          if (layer.type === 'symbol' && layer.layout?.['text-field'] && paint['text-color']) {
            if (id.includes('place') || id.includes('poi') || id.includes('highway-name')) {
              paint['text-color'] = c.plabel;
              paint['text-halo-color'] = c.halo;
            }
          }

          return layer;
        });

        // Cache with theme marker
        style._theme = theme;
        _cachedStyle = style;

        dbg(`✓ Style loaded: ${style.name || 'unnamed'} (${theme})`);
        return style;

      } catch (err) {
        dbg(`⚠ Style fetch failed: ${err.message} — using fallback`);

        // Fallback to minimal hardcoded style (ensures map still loads)
        return {
          version: 8,
          name: "Fallback",
          sources: { openmaptiles: { type: 'vector', url: PMTILES_STYLE_URL } },
          glyphs: './font/{fontstack}/{range}.pbf',
          layers: [
            { id: 'background', type: 'background', paint: { 'background-color': c.bg } },
            { id: 'water', type: 'fill', source: 'openmaptiles', 'source-layer': 'water', paint: { 'fill-color': c.water } },
            {
              id: 'road', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation',
              filter: ['in', 'class', 'primary', 'secondary', 'tertiary', 'trunk', 'motorway'],
              paint: { 'line-color': c.road, 'line-width': 2 }
            }
          ]
        };
      }
    }
    // ── 4. Test fetch + init map (Android-safe pattern) ───────────────────────
    async function runFetchTests() {
      const pmtilesUrl = new URL('./data/tunis.pmtiles', window.location.href).href;
      dbg('Testing PMTiles access: ' + pmtilesUrl);

      try {
        const r = await fetch(pmtilesUrl, { headers: { Range: 'bytes=0-127' } });
        dbg('Range test: ' + r.status + ' (' + r.headers.get('Content-Range') + ')');
        const buf = await r.arrayBuffer();
        dbg('Range bytes: ' + buf.byteLength + ' (expect 128)');
      } catch (e) { dbg('Range test FAIL: ' + e.message); }

      await initMap(pmtilesUrl);
    }

    async function initMap(pmtilesUrl) {
      dbg('Initializing map…');
      const PMTILES_STYLE_URL = 'pmtiles://' + pmtilesUrl;

      // ✅ Android: absolute workerUrl
      maplibregl.workerUrl = new URL('./lib/maplibre-gl.js', window.location.href).href;

      // PMTiles protocol
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
      const pmtilesFile = new pmtiles.PMTiles(pmtilesUrl);
      protocol.add(pmtilesFile);
      window._pmtilesFile = pmtilesFile;

      // ✅ USE SIMPLE STYLE FIRST (verify map loads, then enhance)
      const style = await buildStyle('light');

      const map = new maplibregl.Map({
        container: 'map',
        style,
        center: [10.1815, 36.8065],
        zoom: 12,
        attributionControl: false,
        maxBounds: [[9.5, 36.3], [11.0, 37.4]]
      });

      // ✅ Expose globally for UI handlers
      window.map = map;

      // ✅ Android: force resize after WebView renders
      setTimeout(() => map.resize(), 500);

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');
      map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

      // Events
      map.on('load', async () => {
        dbg('✓ MAP LOAD FIRED');
        try {
          const meta = await window._pmtilesFile.getMetadata();
          const layers = (meta?.vector_layers || []).map(l => l.id);
          dbg('PMTiles layers: ' + layers.join(', '));
          // document.getElementById('tile-label').textContent = 'Tunis offline (' + layers.length + ' layers)';
        } catch (e) { dbg('Meta read failed: ' + e.message); }
      });

      map.on('sourcedata', e => {
        if (e.sourceId === 'openmaptiles' && e.isSourceLoaded) dbg('✓ SOURCE LOADED');
      });

      map.on('data', e => {
        if (e.dataType === 'tile') dbg('✓ tile: z' + e.tile?.tileID?.z);
      });

      map.on('error', e => {
        const msg = e.error?.message || '';
        if (msg.includes('canceled') || msg.includes('abort')) return;
        const url = e.error?.url || e.tile?.tileID?.canonical || '';
        dbg('ERR: ' + msg + (url ? '\n  url: ' + url : ''));
      });

      // Coords on hover
      map.on('mousemove', e => {
        document.getElementById('coords-display').textContent =
          `${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}`;
      });

      // Map click
      let routingClickActive = false;
      map.on('click', e => {
        if (routingClickActive) { handleRoutingClick(e.lngLat); return; }
        const { lat, lng } = e.lngLat;
        showPanel(`${lat.toFixed(5)}, ${lng.toFixed(5)}`, 'Tapped location',
          `<div class="route-card" onclick="setRouteDest(${lat},${lng})">
             <div class="route-icon" style="background:rgba(74,222,128,.15)">📍</div>
             <div class="route-info"><div class="route-label">Route here</div>
             <div class="route-meta">Set as destination</div></div></div>
           <div class="route-card" onclick="copyCoords(${lat},${lng})">
             <div class="route-icon" style="background:rgba(129,140,248,.15)">📋</div>
             <div class="route-info"><div class="route-label">Copy coordinates</div>
             <div class="route-meta">${lat.toFixed(6)}, ${lng.toFixed(6)}</div></div></div>`);
        new maplibregl.Marker({ color: '#4ade80', scale: .7 }).setLngLat([lng, lat]).addTo(map);
        document.getElementById('layers-menu').classList.remove('open');
      });
    }

    // Kick off
    runFetchTests();

    // Debug panel (auto-hides after 12s, click to dismiss)
    // Debug panel — logs accumulate, only shown when user clicks debug button
    function dbg(msg) {
      console.log('[Atlas]', msg);
      const content = document.getElementById('debug-content');

      // Add timestamp and message
      const time = new Date().toLocaleTimeString();

    // Parse "lat,lng" string to object
    function parseLatLng(s) {
      if (!s) return null;
      const p = s.split(',').map(n => parseFloat(n.trim()));
      if (p.length !== 2 || isNaN(p[0]) || isNaN(p[1])) return null;
      return { lat: p[0], lng: p[1] };
    }

    // Decode Valhalla's polyline6 (6-digit precision) to [lng, lat] coordinates
    function decodeValhallaPolyline(encoded) {
      if (!encoded) return [];
      const coords = [];
      let index = 0, lat = 0, lng = 0;

      while (index < encoded.length) {
        // Decode latitude
        let b, shift = 0, result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;

        // Decode longitude
        shift = 0; result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;

        coords.push([lng / 1e6, lat / 1e6]);
      }
      return coords;
    }

    // Draw route line on map
    // Draw route line on map — fixed layer/source cleanup order
    function drawRoute(geom, mode, dashed = false) {
      const colors = { walk: '#4ade80', bike: '#818cf8', car: '#60a5fa' };
      const baseColor = colors[mode] || '#4ade80';
      const id = 'route-line';
      const glowId = 'route-line-glow';

      // CRITICAL: remove layers BEFORE their source.
      // MapLibre will refuse to remove a source while any layer still references it.
      if (map.getLayer(glowId)) map.removeLayer(glowId);
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);

      // Add source (shared by both layers below)
      map.addSource(id, {
        type: 'geojson',
        data: { type: 'Feature', geometry: geom }
      });

      // Glow layer — wider, semi-transparent, drawn first (underneath)
      map.addLayer({
        id: glowId,
        type: 'line',
        source: id,
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': baseColor,
          'line-width': 14,
          'line-opacity': 0.4,
          'line-blur': 3
        }
      });

      // Main line — white core on top of the glow
      map.addLayer({
        id,
        type: 'line',
        source: id,
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 5,
          'line-opacity': 1.0,
          ...(dashed ? { 'line-dasharray': [5, 3] } : {})
        }
      });

      dbg('🎨 Route drawn: ' + geom.coordinates.length + ' points, mode=' + mode + (dashed ? ' (fallback)' : ''));
    }
    // Main routing function
    async function planRoute(mode) {
      // 🔍 DEBUG: Log entry
      dbg('🚦 planRoute() called: mode=' + mode);

      const from = parseLatLng(document.getElementById('from-input').value.trim());
      const to = parseLatLng(document.getElementById('to-input').value.trim());

      dbg('📍 From: ' + (from?.lat + ',' + from?.lng || 'INVALID') +
        ' | To: ' + (to?.lat + ',' + to?.lng || 'INVALID'));

      if (!from || !to) {
        dbg('❌ Invalid coordinates - aborting');
        document.getElementById('route-result').textContent = 'Enter valid coordinates.';
        return;
      }

      document.getElementById('route-result').textContent = 'Calculating…';
      const costing = { car: 'auto', bike: 'bicycle', walk: 'pedestrian' }[mode];
      dbg('🔧 Costing profile: ' + costing);

      try {
        // ── Use native Valhalla plugin (no IP, fully offline) ───────────────────
        const { Plugins } = Capacitor;
        const { Valhalla } = Plugins;

        if (!Valhalla) {
          throw new Error('Valhalla plugin not available — check MainActivity.java');
        }

        dbg('🔌 Calling native Valhalla plugin…');

        const response = await Valhalla.route({
          start: { lat: from.lat, lon: from.lng },
          end: { lat: to.lat, lon: to.lng },
          profile: costing  // 'auto', 'bicycle', or 'pedestrian'
        });

        dbg('✅ Plugin response: distance=' + response.distance + 'km, duration=' + response.duration + 's');

        // Validate response
        if (!response.geometry) {
          throw new Error('No route geometry returned from plugin');
        }

        // Decode the polyline6 geometry to coordinates
        const coordinates = decodeValhallaPolyline(response.geometry);
        dbg('🔗 Decoded polyline: ' + coordinates.length + ' coordinates');

        // Draw the route on map
        drawRoute({ type: 'LineString', coordinates }, mode);
        // Debug: Confirm route layer was added
        setTimeout(() => {
          if (map.getLayer('route-line')) {
            dbg('✅ Route layer confirmed in map style');
            console.log('Route layer config:', map.getLayer('route-line'));
          } else {
            dbg('❌ Route layer NOT found - check layer ordering');
          }
        }, 500);
        // Update UI with results
        const distance = Number(response.distance);
        const duration = Number(response.duration);

        document.getElementById('route-result').innerHTML =
          `<span style="color:var(--c-accent);font-weight:600">${distance.toFixed(1)} km</span> · ${Math.round(duration / 60)} min`;

        // Fit map to route bounds
        map.fitBounds([[from.lng, from.lat], [to.lng, to.lat]], { padding: 80, duration: 1000 });

        dbg('🎉 Route complete: ' + distance.toFixed(1) + ' km in ' + Math.round(duration / 60) + ' min');

      } catch (e) {
        dbg('❌ Routing FAILED: ' + e.message);
        console.error('Routing error:', e);

        // 🔍 Show full error in UI for debugging
        document.getElementById('route-result').innerHTML =
          `<span style="color:var(--c-warn)">⚠ ${e.message}</span><br/>
     <small style="color:var(--c-muted)">${e.stack || ''}</small>`;

        // Fallback: draw straight line between points
        drawRoute({ type: 'LineString', coordinates: [[from.lng, from.lat], [to.lng, to.lat]] }, mode, true);
        // Debug: Confirm route layer was added
        setTimeout(() => {
          if (map.getLayer('route-line')) {
            dbg('✅ Route layer confirmed in map style');
            console.log('Route layer config:', map.getLayer('route-line'));
          } else {
            dbg('❌ Route layer NOT found - check layer ordering');
          }
        }, 500);
      }
    }

    function drawBoundaryHighlight(result) {
      // Remove old highlight
      ['search-boundary-fill', 'search-boundary-line'].forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      if (map.getSource('search-boundary')) map.removeSource('search-boundary');

      // Build a bbox polygon from Nominatim's boundingbox
      if (!result.boundingbox) return;
      const [s, n, w, e] = result.boundingbox.map(Number);

      // Only draw a box for areas (not point POIs)
      const isArea = (n - s) > 0.001 || (e - w) > 0.001;
      if (!isArea) return;

      const polygon = {
        type: 'Feature',
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [w, s], [e, s], [e, n], [w, n], [w, s]
          ]]
        }
      };

      map.addSource('search-boundary', { type: 'geojson', data: polygon });

      // Fill
      map.addLayer({
        id: 'search-boundary-fill',
        type: 'fill',
        source: 'search-boundary',
        paint: {
          'fill-color': '#818cf8',
          'fill-opacity': 0.12
        }
      });

      // Outline
      map.addLayer({
        id: 'search-boundary-line',
        type: 'line',
        source: 'search-boundary',
        paint: {
          'line-color': '#818cf8',
          'line-width': 2,
          'line-opacity': 0.7,
          'line-dasharray': [4, 3]
        }
      });

      // Auto-fade after 4 seconds
      setTimeout(() => {
        if (map.getLayer('search-boundary-fill')) {
          map.setPaintProperty('search-boundary-fill', 'fill-opacity', 0);
          map.setPaintProperty('search-boundary-line', 'line-opacity', 0);
        }
      }, 4000);
    }

            const resultsEl = document.getElementById('search-results');
            if (resultsEl) {
              resultsEl.innerHTML = `<div class="search-no-results">⚠ خطأ: ${err.message}</div>`;
              resultsEl.classList.add('open');
            }
          });

        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('search-clear');
        const resultsEl = document.getElementById('search-results');

        dbg(`🔧 Elements found: input=${!!searchInput}, clear=${!!clearBtn}, results=${!!resultsEl}`);

        let _searchTimer = null;

        searchInput.addEventListener('input', function (e) {
          clearTimeout(_searchTimer);
          const q = e.target.value.trim();
          clearBtn.classList.toggle('visible', q.length > 0);

          if (q.length < 2) {
            resultsEl.classList.remove('open');
            resultsEl.innerHTML = '';
            return;
          }

          _searchTimer = setTimeout(() => {
            dbg(`🔍 Searching for: "${q}" (offlinePlaces.length=${offlinePlaces.length})`);
            const query = q.toLowerCase();

            const matches = offlinePlaces.filter(p => {
              const nameAr = (p.na || '').toLowerCase();
              const nameLatin = (p.nl || '').toLowerCase();
              const nameDefault = (p.n || '').toLowerCase();
              return nameAr.includes(query) || nameLatin.includes(query) || nameDefault.includes(query);
            }).slice(0, 12);

            dbg(`📈 Found ${matches.length} matches`);

            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="search-no-results">لا توجد نتائج</div>';
              resultsEl.classList.add('open');
            } else {
              resultsEl.innerHTML = matches.map(p => {
                const displayName = p.na || p.nl || p.n;
                const type = p.c || '';
                const safeName = displayName.replace(/'/g, "\\'");

                // Add coordinate hint for disambiguation
                const coordHint = `(${p.la.toFixed(3)}, ${p.lo.toFixed(3)})`;

                // Translate common types to Arabic for better UX
                const typeLabels = {
                  'city': 'مدينة', 'town': 'بلدة', 'village': 'قرية',
                  'suburb': 'ضاحية', 'neighbourhood': 'حي', 'quarter': 'حي',
                  'shop': 'متجر', 'cafe': 'مقهى', 'restaurant': 'مطعم',
                  'grocery': 'بقالة', 'bus': 'حافلة', 'police': 'شرطة'
                };
                const typeLabel = typeLabels[type] || type;

                return `
    <div class="search-result-item" onclick="window.goToPlace(${p.lo}, ${p.la}, '${safeName}')">
      <div class="sri-icon">📍</div>
      <div>
        <div class="sri-name">${displayName}</div>
        <div class="sri-sub">${typeLabel} • ${coordHint}</div>
      </div>
    </div>
  `;
              }).join('');
              resultsEl.classList.add('open');
              dbg('✅ Results displayed');
            }
          }, 300);
        });

        clearBtn.addEventListener('click', function () {
          searchInput.value = '';
          clearBtn.classList.remove('visible');
          resultsEl.classList.remove('open');
          resultsEl.innerHTML = '';
          searchInput.focus();
        });

        window.goToPlace = function (lon, lat, name) {
          dbg(`✈️ goToPlace: [${lon}, ${lat}], "${name}"`);

          if (window.map?.flyTo) {
            window.map.flyTo({ center: [lon, lat], zoom: 15, duration: 1000 });

            if (typeof maplibregl !== 'undefined') {
              if (window._searchMarker) window._searchMarker.remove();
              const el = document.createElement('div');
              el.style.cssText = `width:12px;height:12px;border-radius:50%;background:#4ade80;border:2px solid white;box-shadow:0 0 10px rgba(74,222,128,0.8);`;
              window._searchMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(window.map);
            }
          }

          searchInput.value = name;
          clearBtn.classList.add('visible');
          resultsEl.classList.remove('open');
          resultsEl.innerHTML = '';
        };

        dbg('🎉 Offline search ready');
      }
    })();
  </script>
</body>

</html>
