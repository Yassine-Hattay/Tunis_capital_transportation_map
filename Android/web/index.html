<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' file: data: gap: https://ssl.gstatic.com;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    worker-src blob:;
    img-src 'self' data: blob: file:;
    connect-src 'self' http://localhost http://localhost:* https://*;
    font-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <script src="./lib/mapbox-gl-rtl-text.js"></script>
  <style>
    :root {
      --c-bg: #0f1117;
      --c-surface: #1c1f2b;
      --c-border: rgba(255, 255, 255, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #e8eaf0;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--c-bg);
      color: var(--c-text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #map {
      flex: 1;
      width: 100%;
      position: relative
    }

    /* ── Top bar ── */
    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    /* ── Search wrap (holds input + dropdown) ── */
    #search-wrap {
      flex: 1;
      position: relative;
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      transition: border-color .2s, box-shadow .2s;
    }

    #search-box:focus-within {
      border-color: rgba(129, 140, 248, .5);
      box-shadow: 0 4px 32px rgba(129, 140, 248, .15);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      font-family: inherit;
      text-align: right;
      direction: rtl;
    }

    #search-input::placeholder {
      color: var(--c-muted);
      font-size: 14px;
    }

    #search-input:not(:placeholder-shown) {
      text-align: left;
      direction: ltr;
    }

    #search-clear {
      cursor: pointer;
      opacity: 0;
      font-size: 16px;
      color: var(--c-muted);
      transition: opacity .15s;
      display: none;
      padding: 2px 4px;
    }

    #search-clear.visible {
      display: block;
      opacity: 0.6;
    }

    /* ── Results dropdown ── */
    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
      display: none;
      z-index: 200;
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, .04);
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      line-height: 1.3;
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .search-no-results {
      padding: 16px;
      text-align: center;
      color: var(--c-muted);
      font-size: 13px;
    }

    /* ── Flag button ── */
    #btn-flag {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      flex-shrink: 0;
      transition: border-color .15s;
    }

    #btn-flag:hover {
      border-color: rgba(255, 255, 255, .2);
    }

    /* ── Debug button ── */
    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--c-accent);
      color: var(--c-accent);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
      border-color: var(--c-accent);
    }

    /* ── Debug panel ── */
    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      line-height: 1.8;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    /* ── Boundary highlight ── */
    .boundary-pulse {
      animation: bPulse 2s ease-out forwards;
    }

    @keyframes bPulse {
      0% {
        opacity: 0.8;
      }

      60% {
        opacity: 0.5;
      }

      100% {
        opacity: 0.25;
      }
    }

    /* ── MapLibre overrides ── */
    .maplibregl-ctrl-group {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: var(--r) !important;
    }

    .maplibregl-ctrl-group button {
      background: none !important;
      width: 36px !important;
      height: 36px !important;
    }

    .maplibregl-ctrl-group button span {
      filter: invert(1) !important;
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 24px;
      right: 12px;
    }

    .maplibregl-popup-content {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: 8px !important;
      color: var(--c-text) !important;
      font-family: inherit !important;
      font-size: 13px !important;
      padding: 10px 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4) !important;
    }

    .maplibregl-popup-tip {
      display: none !important;
    }

    @media(max-width:480px) {
      #topbar {
        top: 10px;
        left: 8px;
        right: 8px;
      }
    }

    .maplibregl-ctrl-group {
      background: var(--c-surface) !important;
      border: 1px solid var(--c-border) !important;
      border-radius: var(--r) !important;
      backdrop-filter: blur(12px)
    }

    .maplibregl-ctrl-group button {
      background: none !important;
      border-color: var(--c-border) !important;
      width: 36px !important;
      height: 36px !important
    }

    .maplibregl-ctrl-group button span {
      filter: invert(1) !important
    }

    .maplibregl-ctrl-attrib {
      display: none !important
    }

    .maplibregl-ctrl-bottom-right {
      bottom: 24px;
      right: 12px
    }

    .gps-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--c-accent2);
      border: 3px solid white;
      box-shadow: 0 0 0 4px rgba(129, 140, 248, .3);
      animation: gpsPulse 2s infinite
    }

    @keyframes gpsPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(129, 140, 248, .5)
      }

      70% {
        box-shadow: 0 0 0 12px rgba(129, 140, 248, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(129, 140, 248, 0)
      }
    }

    @media(max-width:480px) {
      :root {
        --panel-w: calc(100vw - 24px)
      }
    }

    /* Pulsing route animation */
    @keyframes routePulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    .route-pulse {
      animation: routePulse 2s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <!-- ✅ ONLY THE MAP -->
  <div id="map"></div>

  <!-- ✅ ONLY SEARCH + DEBUG BUTTON -->
  <div id="topbar">
    <div id="search-wrap">
      <div id="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          opacity="0.4">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input id="search-input" type="text" placeholder="وين تحب تمشي؟" autocomplete="off" dir="auto" />
        <span id="search-clear" onclick="clearSearch()">✕</span>
      </div>
      <div id="search-results"></div>
    </div>

    <button id="btn-flag" title="English" onclick="/* future */">
      🇬🇧
    </button>

    <button class="icon-btn" id="btn-debug" onclick="toggleDebug()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
    </button>
  </div>

  <!-- ✅ DEBUG PANEL (kept for development) -->
  <div id="debug-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">Debug Logs</span>
      <button onclick="copyDebugLogs()"
        style="background:var(--c-accent);color:#0f1117;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">📋
        Copy</button>
    </div>
    <div id="debug-content" style="max-height:180px;overflow-y:auto"></div>
  </div>

  <!-- ✅ ADD THIS PANEL for offline search results -->
  <div id="panel" style="display:none">
    <div class="panel-handle"></div>
    <div class="panel-title" id="panel-title"></div>
    <div class="panel-sub" id="panel-sub"></div>
    <div id="panel-content"></div>
  </div>
  <script>
    maplibregl.setRTLTextPlugin('./lib/mapbox-gl-rtl-text.js', null, true);

    const PMTILES_PATH = '/data/tunis.pmtiles';
    let _fileCache = null;
    const _origFetch = window.fetch;

    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      const rangeHeader = init?.headers?.Range || init?.headers?.range ||
        (init?.headers instanceof Headers ? init.headers.get('Range') : null);

      if (rangeHeader && url.includes(PMTILES_PATH)) {
        const match = rangeHeader.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          const start = parseInt(match[1]);
          const end = parseInt(match[2]);
          if (!_fileCache) {
            dbg('caching pmtiles file…');
            const r = await _origFetch.call(this, url);
            _fileCache = await r.arrayBuffer();
            dbg('cached: ' + _fileCache.byteLength + ' bytes');
          }
          const slice = _fileCache.slice(start, end + 1);
          return new Response(slice, {
            status: 206,
            statusText: 'Partial Content',
            headers: {
              'Content-Type': 'application/octet-stream',
              'Content-Range': `bytes ${start}-${end}/${_fileCache.byteLength}`,
              'Content-Length': String(slice.byteLength),
            }
          });
        }
      }
      return _origFetch.apply(this, arguments);
    };
    dbg('range-fetch polyfill active');
    // ════════════════════════════════════════════════════════════════════════

    const PMTILES_HTTP_URL = new URL('./data/tunis.pmtiles', window.location.href).href;
    const PMTILES_STYLE_URL = 'pmtiles://' + PMTILES_HTTP_URL;

    dbg('PMTiles HTTP URL: ' + PMTILES_HTTP_URL);
    dbg('PMTiles style URL: ' + PMTILES_STYLE_URL);

    // ✅ ADD THIS LINE
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // ✅ register the file correctly
    const pmtilesFile = new pmtiles.PMTiles(PMTILES_HTTP_URL);
    protocol.add(pmtilesFile);

    // ── 3. Build full OpenMapTiles v3.11 style ────────────────────────────────
    //    Layer names confirmed from: pmtiles show data/tunis.pmtiles
    //    Schema: OpenMapTiles v3.11, id: openmaptiles
    //    Bounds: 9.978–10.493 lng, 36.659–37.008 lat (Tunis metro area)
    // ── Style Loader (uses ./style/config.json) ────────────────────────────────
    let _cachedStyle = null;

    async function buildStyle(theme) {
      const isDark = theme === 'dark';

      // ── Theme color tokens: Professional, balanced palette ✨ ─────────────────
      const c = isDark ? {
        // Base
        bg: '#0a0e14',
        land: '#121826',
        water: '#0d253f',        // Deeper, richer blue
        waterLine: '#1a4a7a',
        ocean: '#081a33',        // Even deeper for open ocean

        // Land cover (subtle, natural tones)
        forest: '#1a3a2e',
        park: '#1e4a3a',
        grass: '#2a3a2e',
        sand: '#3a3a2a',
        beach: '#4a4a3a',
        industrial: '#2a2a3a',
        residential: '#1a1e2a',
        cemetery: '#2a2a3a',
        wetland: '#1a2a3a',
        scrub: '#2a3a2e',

        // Roads: BRIGHT TEST COLORS ✨ (temporary for debugging)
        roadMotorway: '#f07030',    // Bright orange
        roadTrunk: '#e86820',    // Deep orange
        roadPrimary: '#d05818',    // Darker orange
        roadSecondary: '#b05030',    // Muted dark orange
        roadMinor: '#8a5040',    // Subtle dark orange-brown
        roadPath: '#6a4030',    // Very subtle
        roadRail: '#5a4a6a',    // Keep purple-gray

        // Buildings (subtle depth)
        building: '#1e2230',
        buildingTop: '#2a2e3c',
        buildingOutline: '#3a3a4a',

        // Sites (soft, distinct)
        siteSchool: '#1e3a3a',
        siteHospital: '#3a2a3a',
        siteParking: '#2a2a3a',

        // Labels (excellent contrast, easy to read)
        placeLabel: '#b8c8e8',
        roadLabel: '#9aa8c8',
        poiLabel: '#a8b8d8',
        waterLabel: '#7a9ab8',
        addressLabel: '#8a9ab8',

        // Boundaries (subtle)
        boundary: '#4a4a6a',
        boundaryDisputed: '#6a4a5a',

        // POI icons (coordinated with labels)
        poiIcon: '#8a9ab8',

        // Transport lines
        ferry: '#2a4a7a',
        aerialway: '#5a5a7a',

        // Halos (for label readability)
        halo: '#0a0e14',
        haloLight: 'rgba(10,14,20,0.85)'
      } : {
        bg: '#f5f3f0',
        land: '#f5f3f0',
        water: '#c8dff0',
        waterLine: '#88b0d0',
        ocean: '#b8d0e8',

        forest: '#d4e8c8',
        park: '#ddeedd',
        grass: '#e8f0dc',
        sand: '#f0e8d0',
        beach: '#f8f0e0',
        industrial: '#e4e0e8',
        residential: '#efefef',
        cemetery: '#e0e0d8',
        wetland: '#ccddf0',
        scrub: '#dce8d0',

        roadMotorway: '#e8952a',
        roadTrunk: '#e8952a',
        roadPrimary: '#f0b050',
        roadSecondary: '#f8d090',
        roadMinor: '#ffffff',
        roadPath: '#e8e0d8',
        roadRail: '#aaaaaa',

        building: '#e8e4de',
        buildingTop: '#f0ece8',
        buildingOutline: '#d0ccc8',

        siteSchool: '#eaf0e0',
        siteHospital: '#f0e8e8',
        siteParking: '#ececec',

        placeLabel: '#333333',
        roadLabel: '#666666',
        poiLabel: '#555555',
        waterLabel: '#4a7a9a',
        addressLabel: '#888888',

        boundary: '#bbbbbb',
        boundaryDisputed: '#cc9999',

        poiIcon: '#777777',

        ferry: '#88b0d0',
        aerialway: '#aaaaaa',

        halo: '#f5f3f0',
        haloLight: 'rgba(245,243,240,0.9)'
      };

      // ── Build style from scratch based on style1.json layer structure ──────────
      const style = {
        version: 8,
        name: "Tunis Shortbread — Adapted",
        sources: {
          omt: {
            type: 'vector',
            url: PMTILES_STYLE_URL
          }
        },
        sprite: './sprites/sprites',
        glyphs: './font/{fontstack}/{range}.pbf',
        layers: []
      };


      // 1. Background = ocean color
      style.layers.push({
        id: 'background',
        type: 'background',
        paint: { 'background-color': isDark ? c.ocean : c.ocean }
      });

      // Real land polygon from Natural Earth shapefile
      style.layers.push({
        id: 'land-polygons',
        type: 'fill',
        source: 'omt',
        'source-layer': 'land_polygons',
        minzoom: 0,
        paint: { 'fill-color': isDark ? c.land : c.land }
      });

      // 3. Land tagged areas (forests, residential, etc.) over ocean
      style.layers.push({
        id: 'land-base',
        type: 'fill',
        source: 'omt',
        'source-layer': 'land',
        minzoom: 0,
        paint: { 'fill-color': isDark ? c.land : c.land }
      });

      // Water on top of land
      style.layers.push({
        id: 'water',
        type: 'fill',
        source: 'omt',
        'source-layer': 'water_polygons',
        minzoom: 0,
        paint: { 'fill-color': isDark ? c.water : c.water, 'fill-opacity': 1.0 }
      });

      // 5. Water lines
      style.layers.push({
        id: 'water-lines',
        type: 'line',
        source: 'omt',
        'source-layer': 'water_lines',
        minzoom: 4,
        filter: ['in', 'class', 'river', 'stream', 'canal', 'drain', 'ditch', 'creek'],
        paint: {
          'line-color': c.waterLine,
          'line-width': { base: 1.3, stops: [[10, 0.8], [14, 2], [18, 5]] },
          'line-opacity': { stops: [[10, 0.7], [14, 1.0]] }
        }
      });

      // Subtle land texture for depth (optional)
      style.layers.push({
        id: 'land-texture',
        type: 'fill',
        source: 'omt',
        'source-layer': 'land',
        minzoom: 12,
        paint: {
          'fill-color': isDark ? '#1a1e2a' : '#f0f0f5',
          'fill-opacity': 0.03,
          'fill-pattern': 'pattern-hatched_thin'  // Uses your existing sprite pattern!
        }
      });

      const landCoverTypes = [
        { kind: 'forest', color: c.forest, minzoom: 7 },
        { kind: 'park', color: c.park, minzoom: 11, filter: ['in', 'class', 'park', 'recreation_ground'] },
        { kind: 'grass', color: c.grass, minzoom: 11, filter: ['in', 'class', 'grass', 'meadow'] },
        { kind: 'sand', color: c.sand, minzoom: 10, filter: ['in', 'class', 'sand', 'beach'] },
        { kind: 'cemetery', color: c.cemetery, minzoom: 13 },
        { kind: 'wetland', color: c.wetland, minzoom: 11, filter: ['in', 'class', 'wetland'] },
        { kind: 'scrub', color: c.scrub, minzoom: 11, filter: ['in', 'class', 'scrub', 'heath', 'grassland'] },
        { kind: 'residential', color: c.residential, minzoom: 10 },
        { kind: 'industrial', color: c.industrial, minzoom: 10, filter: ['in', 'class', 'industrial', 'commercial', 'retail'] }
      ];

      landCoverTypes.forEach(cfg => {
        style.layers.push({
          id: `land-${cfg.kind}`,
          type: 'fill',
          source: 'omt',
          'source-layer': 'land',
          minzoom: cfg.minzoom,
          filter: cfg.filter || ['==', 'class', cfg.kind],  // ✅ Use 'class' property          
          paint: {
            'fill-color': cfg.color,
            'fill-opacity': { stops: [[cfg.minzoom, 0.4], [13, 0.8]] }
          }
        });
      });


      style.layers.push(
        {
          id: 'sites-university',
          type: 'fill',
          source: 'omt',
          'source-layer': 'sites',
          filter: ['in', 'class', 'university', 'college'],
          minzoom: 13,
          // Muted, soft purple
          paint: { 'fill-color': isDark ? '#6d597a' : '#e0d1ea', 'fill-opacity': 0.7 }
        },
        {
          id: 'sites-school',
          type: 'fill',
          source: 'omt',
          'source-layer': 'sites',
          filter: ['==', 'class', 'school'],
          minzoom: 13,
          // Soft, sage green
          paint: { 'fill-color': isDark ? '#52796f' : '#b7d4c8', 'fill-opacity': 0.7 }
        },
        {
          id: 'sites-hospital',
          type: 'fill',
          source: 'omt',
          'source-layer': 'sites',
          filter: ['==', 'class', 'hospital'],
          minzoom: 13,
          // Muted, warm rose
          paint: { 'fill-color': isDark ? '#a44a3f' : '#f2c6c2', 'fill-opacity': 0.7 }
        },
        {
          id: 'sites-cemetery',
          type: 'fill',
          source: 'omt',

    async function locateMe() {
      const btn = document.getElementById('btn-gps');
      btn.classList.add('active');
      dbg('📍 Requesting location…');

      try {
        // Request permission first
        const { Geolocation } = Capacitor.Plugins;

        const permission = await Geolocation.requestPermissions();
        if (permission.location !== 'granted') {
          dbg('❌ Location permission denied');
          document.getElementById('route-result').textContent = 'Location permission denied.';
          btn.classList.remove('active');
          return;
        }

        // Get current position
        const pos = await Geolocation.getCurrentPosition({
          enableHighAccuracy: true,
          timeout: 10000
        });

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const accuracy = pos.coords.accuracy;

        dbg(`✅ Location: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(accuracy)}m)`);

        // Fly map to location
        map.flyTo({ center: [lng, lat], zoom: 16, duration: 1000 });

        // Add/update location dot on map
        updateLocationDot(lat, lng, accuracy);

        // Auto-fill the "from" field in routing panel
        document.getElementById('from-input').value = `${lat.toFixed(6)},${lng.toFixed(6)}`;

      } catch (e) {
        dbg('❌ Location error: ' + e.message);
      } finally {
        btn.classList.remove('active');
      }
    }

        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] } }
      });
      map.addLayer({

          'circle-opacity': 0.15,
          'circle-stroke-width': 1,

    width: 16px; height: 16px; border-radius: 50%;

    // Parse "lat,lng" string to object
    function parseLatLng(s) {
      if (!s) return null;
      const p = s.split(',').map(n => parseFloat(n.trim()));
      if (p.length !== 2 || isNaN(p[0]) || isNaN(p[1])) return null;
      return { lat: p[0], lng: p[1] };
    }

    // Decode Valhalla's polyline6 (6-digit precision) to [lng, lat] coordinates
    function decodeValhallaPolyline(encoded) {
      if (!encoded) return [];
      const coords = [];
      let index = 0, lat = 0, lng = 0;

      while (index < encoded.length) {
        // Decode latitude
        let b, shift = 0, result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;

        // Decode longitude
        shift = 0; result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;

        coords.push([lng / 1e6, lat / 1e6]);
      }
      return coords;
    }

    // Draw route line on map
    // Draw route line on map — fixed layer/source cleanup order
    function drawRoute(geom, mode, dashed = false) {
      const colors = { walk: '#4ade80', bike: '#818cf8', car: '#60a5fa' };
      const baseColor = colors[mode] || '#4ade80';
      const id = 'route-line';
      const glowId = 'route-line-glow';

      // CRITICAL: remove layers BEFORE their source.
      // MapLibre will refuse to remove a source while any layer still references it.
      if (map.getLayer(glowId)) map.removeLayer(glowId);
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);

      // Add source (shared by both layers below)
      map.addSource(id, {
        type: 'geojson',
        data: { type: 'Feature', geometry: geom }
      });

      // Glow layer — wider, semi-transparent, drawn first (underneath)
      map.addLayer({
        id: glowId,
        type: 'line',
        source: id,
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': baseColor,
          'line-width': 14,
          'line-opacity': 0.4,
          'line-blur': 3
        }
      });

      // Main line — white core on top of the glow
      map.addLayer({
        id,
        type: 'line',
        source: id,
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#ffffff',
          'line-width': 5,
          'line-opacity': 1.0,
          ...(dashed ? { 'line-dasharray': [5, 3] } : {})
        }
      });

      dbg('🎨 Route drawn: ' + geom.coordinates.length + ' points, mode=' + mode + (dashed ? ' (fallback)' : ''));
    }
    // Main routing function
    async function planRoute(mode) {
      // 🔍 DEBUG: Log entry
      dbg('🚦 planRoute() called: mode=' + mode);

      const from = parseLatLng(document.getElementById('from-input').value.trim());
      const to = parseLatLng(document.getElementById('to-input').value.trim());

      dbg('📍 From: ' + (from?.lat + ',' + from?.lng || 'INVALID') +
        ' | To: ' + (to?.lat + ',' + to?.lng || 'INVALID'));

      if (!from || !to) {
        dbg('❌ Invalid coordinates - aborting');
        document.getElementById('route-result').textContent = 'Enter valid coordinates.';
        return;
      }

      document.getElementById('route-result').textContent = 'Calculating…';
      const costing = { car: 'auto', bike: 'bicycle', walk: 'pedestrian' }[mode];
      dbg('🔧 Costing profile: ' + costing);

      try {
        // ── Use native Valhalla plugin (no IP, fully offline) ───────────────────
        const { Plugins } = Capacitor;
        const { Valhalla } = Plugins;

        if (!Valhalla) {
          throw new Error('Valhalla plugin not available — check MainActivity.java');
        }

        dbg('🔌 Calling native Valhalla plugin…');

        const response = await Valhalla.route({
          start: { lat: from.lat, lon: from.lng },
          end: { lat: to.lat, lon: to.lng },
          profile: costing  // 'auto', 'bicycle', or 'pedestrian'
        });

        dbg('✅ Plugin response: distance=' + response.distance + 'km, duration=' + response.duration + 's');

        // Validate response
        if (!response.geometry) {
          throw new Error('No route geometry returned from plugin');
        }

        // Decode the polyline6 geometry to coordinates
        const coordinates = decodeValhallaPolyline(response.geometry);
        dbg('🔗 Decoded polyline: ' + coordinates.length + ' coordinates');

        // Draw the route on map
        drawRoute({ type: 'LineString', coordinates }, mode);
        // Debug: Confirm route layer was added
        setTimeout(() => {
          if (map.getLayer('route-line')) {
            dbg('✅ Route layer confirmed in map style');
            console.log('Route layer config:', map.getLayer('route-line'));
          } else {
            dbg('❌ Route layer NOT found - check layer ordering');
          }
        }, 500);
        // Update UI with results
        const distance = Number(response.distance);
        const duration = Number(response.duration);

        document.getElementById('route-result').innerHTML =
          `<span style="color:var(--c-accent);font-weight:600">${distance.toFixed(1)} km</span> · ${Math.round(duration / 60)} min`;

        // Fit map to route bounds
        map.fitBounds([[from.lng, from.lat], [to.lng, to.lat]], { padding: 80, duration: 1000 });

        dbg('🎉 Route complete: ' + distance.toFixed(1) + ' km in ' + Math.round(duration / 60) + ' min');

      } catch (e) {
        dbg('❌ Routing FAILED: ' + e.message);
        console.error('Routing error:', e);

        // 🔍 Show full error in UI for debugging
        document.getElementById('route-result').innerHTML =
          `<span style="color:var(--c-warn)">⚠ ${e.message}</span><br/>
     <small style="color:var(--c-muted)">${e.stack || ''}</small>`;

        // Fallback: draw straight line between points
        drawRoute({ type: 'LineString', coordinates: [[from.lng, from.lat], [to.lng, to.lat]] }, mode, true);
        // Debug: Confirm route layer was added
        setTimeout(() => {
          if (map.getLayer('route-line')) {
            dbg('✅ Route layer confirmed in map style');
            console.log('Route layer config:', map.getLayer('route-line'));
          } else {
            dbg('❌ Route layer NOT found - check layer ordering');
          }
        }, 500);
      }
    }

    function zoomForType(type, cls) {
      if (type === 'city') return 12;
      if (type === 'town') return 13;
      if (type === 'suburb' || type === 'neighbourhood' || type === 'village') return 14;
      if (cls === 'highway') return 16;
      return 15;

    function drawBoundaryHighlight(result) {
      // Remove old highlight
      ['search-boundary-fill', 'search-boundary-line'].forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      if (map.getSource('search-boundary')) map.removeSource('search-boundary');

      // Build a bbox polygon from Nominatim's boundingbox
      if (!result.boundingbox) return;
      const [s, n, w, e] = result.boundingbox.map(Number);

      // Only draw a box for areas (not point POIs)
      const isArea = (n - s) > 0.001 || (e - w) > 0.001;
      if (!isArea) return;

      const polygon = {
        type: 'Feature',
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [w, s], [e, s], [e, n], [w, n], [w, s]
          ]]
        }
      };

      map.addSource('search-boundary', { type: 'geojson', data: polygon });

      // Fill
      map.addLayer({
        id: 'search-boundary-fill',
        type: 'fill',
        source: 'search-boundary',
        paint: {
          'fill-color': '#818cf8',
          'fill-opacity': 0.12
        }
      });

      // Outline
      map.addLayer({
        id: 'search-boundary-line',
        type: 'line',
        source: 'search-boundary',
        paint: {
          'line-color': '#818cf8',
          'line-width': 2,
          'line-opacity': 0.7,
          'line-dasharray': [4, 3]
        }
      });

      // Auto-fade after 4 seconds
      setTimeout(() => {
        if (map.getLayer('search-boundary-fill')) {
          map.setPaintProperty('search-boundary-fill', 'fill-opacity', 0);
          map.setPaintProperty('search-boundary-line', 'line-opacity', 0);
        }
      }, 4000);
    }

      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('[Atlas] SW registered'))
        .catch(e => console.warn('[Atlas] SW error:', e));
    }

    function debugRoads() {
      const features = map.querySourceFeatures('openmaptiles', {
        sourceLayer: 'transportation'
      });

      console.log("TOTAL ROAD FEATURES:", features.length);
      console.log("SAMPLE:", features.slice(0, 10));
    }

    map.on('zoom', countVisibleRoads);

    function countVisibleRoads() {
      try {
        // OpenFreeMap Liberty uses 'highway-*' layer names, not 'road-*'
        const features = map.queryRenderedFeatures({
          layers: ['highway-primary', 'highway-secondary', 'highway-motorway']
        });
        console.log("VISIBLE ROADS:", features.length);
      } catch (e) {
        // Silently ignore if layers don't exist
      }
    }

    async function copyDebugLogs() {
      const content = document.getElementById('debug-content');
      const text = Array.from(content.children).map(el => el.textContent).join('\n');

      try {
        await navigator.clipboard.writeText(text);
        dbg('✓ Debug logs copied to clipboard');
      } catch (e) {
        // Fallback for older Android WebView
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        dbg('✓ Debug logs copied (fallback)');
      }
    }

    function toggleDebug() {
      const panel = document.getElementById('debug-panel');
      panel.classList.toggle('show');
      document.getElementById('btn-debug').classList.toggle('active', panel.classList.contains('show'));
    }
    // Initialize Capacitor plugins when DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      // Capacitor auto-loads registered plugins; no explicit init needed
      // But we can log plugin availability for debugging
      const { Plugins } = Capacitor;
      if (Plugins?.Valhalla) {
        dbg('🔌 Valhalla plugin detected at startup');
      } else {
        dbg('⚠ Valhalla plugin NOT detected — check MainActivity.java');
      }
    });

    // Log plugin availability on page load
    window.addEventListener('load', () => {
      const { Plugins } = Capacitor;
      if (Plugins?.Valhalla) {
        dbg('✅ Capacitor sees Valhalla plugin');
      } else {
        dbg('❌ Capacitor does NOT see Valhalla plugin — check MainActivity.java');
      }
    });



  </script>
  <!-- ✅ OFFLINE SEARCH MODULE (separate script to ensure execution) -->
  <script>
    (function () {
      // Wait for DOM to be ready
      if (document.readyState !== 'loading') {
        initOfflineSearch();
      } else {
        document.addEventListener('DOMContentLoaded', initOfflineSearch);
      }

      function initOfflineSearch() {
        dbg('🔍 Offline search module initializing...');

        let offlinePlaces = [];

        // Load places.json with detailed debug
        dbg('🔍 Starting places.json fetch...');

        fetch('./data/places.json', { method: 'HEAD', cache: 'no-store' })
          .then(headRes => {
            dbg(`📥 HEAD request: status=${headRes.status}, ok=${headRes.ok}, url=${headRes.url}`);
            if (!headRes.ok) throw new Error(`HEAD request failed: ${headRes.status}`);
            return fetch('./data/places.json', { cache: 'force-cache' });
          })
          .then(res => {
            dbg(`📥 GET request: status=${res.status}, ok=${res.ok}, url=${res.url}, type=${res.type}`);
            if (!res.ok) return res.text().then(txt => { throw new Error(`HTTP ${res.status}: ${txt.slice(0, 100)}`); });
            return res;
          })
          .then(res => res.json())
          .then(data => {
            dbg(`✅ Loaded ${Array.isArray(data) ? data.length : 'unknown'} places`);
            if (Array.isArray(data) && data.length > 0) {
              dbg(`📋 Sample: ${JSON.stringify(data[0]).slice(0, 100)}...`);
            }
            offlinePlaces = data;
          })
          .catch(err => {
            dbg(`❌ Failed to load places.json: ${err.name} - ${err.message}`);
            const resultsEl = document.getElementById('search-results');
            if (resultsEl) {
              resultsEl.innerHTML = `<div class="search-no-results">⚠ خطأ: ${err.message}</div>`;
              resultsEl.classList.add('open');
            }
          });

        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('search-clear');
        const resultsEl = document.getElementById('search-results');

        dbg(`🔧 Elements found: input=${!!searchInput}, clear=${!!clearBtn}, results=${!!resultsEl}`);

        let _searchTimer = null;

        searchInput.addEventListener('input', function (e) {
          clearTimeout(_searchTimer);
          const q = e.target.value.trim();
          clearBtn.classList.toggle('visible', q.length > 0);

          if (q.length < 2) {
            resultsEl.classList.remove('open');
            resultsEl.innerHTML = '';
            return;
          }

          _searchTimer = setTimeout(() => {
            dbg(`🔍 Searching for: "${q}" (offlinePlaces.length=${offlinePlaces.length})`);
            const query = q.toLowerCase();

            const matches = offlinePlaces.filter(p => {
              const nameAr = (p.na || '').toLowerCase();
              const nameLatin = (p.nl || '').toLowerCase();
              const nameDefault = (p.n || '').toLowerCase();
              return nameAr.includes(query) || nameLatin.includes(query) || nameDefault.includes(query);
            }).slice(0, 12);

            dbg(`📈 Found ${matches.length} matches`);

            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="search-no-results">لا توجد نتائج</div>';
              resultsEl.classList.add('open');
            } else {
              resultsEl.innerHTML = matches.map(p => {
                const displayName = p.na || p.nl || p.n;
                const type = p.c || '';
                const safeName = displayName.replace(/'/g, "\\'");

                // Add coordinate hint for disambiguation
                const coordHint = `(${p.la.toFixed(3)}, ${p.lo.toFixed(3)})`;

                // Translate common types to Arabic for better UX
                const typeLabels = {
                  'city': 'مدينة', 'town': 'بلدة', 'village': 'قرية',
                  'suburb': 'ضاحية', 'neighbourhood': 'حي', 'quarter': 'حي',
                  'shop': 'متجر', 'cafe': 'مقهى', 'restaurant': 'مطعم',
                  'grocery': 'بقالة', 'bus': 'حافلة', 'police': 'شرطة'
                };
                const typeLabel = typeLabels[type] || type;

                return `
    <div class="search-result-item" onclick="window.goToPlace(${p.lo}, ${p.la}, '${safeName}')">
      <div class="sri-icon">📍</div>
      <div>
        <div class="sri-name">${displayName}</div>
        <div class="sri-sub">${typeLabel} • ${coordHint}</div>
      </div>
    </div>
  `;
              }).join('');
              resultsEl.classList.add('open');
              dbg('✅ Results displayed');
            }
          }, 300);
        });

        clearBtn.addEventListener('click', function () {
          searchInput.value = '';
          clearBtn.classList.remove('visible');
          resultsEl.classList.remove('open');
          resultsEl.innerHTML = '';
          searchInput.focus();
        });

        window.goToPlace = function (lon, lat, name) {
          dbg(`✈️ goToPlace: [${lon}, ${lat}], "${name}"`);

          if (window.map?.flyTo) {
            window.map.flyTo({ center: [lon, lat], zoom: 15, duration: 1000 });

            if (typeof maplibregl !== 'undefined') {
              if (window._searchMarker) window._searchMarker.remove();
              const el = document.createElement('div');
              el.style.cssText = `width:12px;height:12px;border-radius:50%;background:#4ade80;border:2px solid white;box-shadow:0 0 10px rgba(74,222,128,0.8);`;
              window._searchMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(window.map);
            }
          }

          searchInput.value = name;
          clearBtn.classList.add('visible');
          resultsEl.classList.remove('open');
          resultsEl.innerHTML = '';
        };

        dbg('🎉 Offline search ready');
      }
    })();
  </script>
