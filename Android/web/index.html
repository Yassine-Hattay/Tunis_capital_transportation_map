<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: file: data: gap: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; img-src 'self' data: blob: file: https:; connect-src 'self' https://localhost https://localhost:* http://localhost http://localhost:* https://*; font-src 'self' data: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <style>
    :root {
      --c-bg: #f5f3f0;
      --c-surface: #ffffff;
      --c-border: rgba(0, 0, 0, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #333333;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      color: var(--c-text);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #c8dff0;
    }

    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    #search-wrap {
      flex: 1;
      min-width: 0;
      /* Crucial: allows the search bar to shrink on narrow screens */
      position: relative;
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      direction: rtl;
      text-align: right;
    }

    #search-input:not(:placeholder-shown) {
      direction: ltr;
      text-align: left;
    }

    #search-clear {
      cursor: pointer;
      display: none;
      padding: 4px;
      opacity: 0.6;
      font-size: 16px;
    }

    #search-clear.visible {
      display: block;
    }

    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow: hidden;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      /* Crucial: prevents buttons from shrinking and clipping */
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
    }

    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    #routing-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--c-surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      z-index: 400;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
    }

    #panel.open {
      display: block;
    }

    .route-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--c-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--c-border);
    }

    .route-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .route-input {
      width: 100%;
      min-width: 0;
      /* Crucial: allows grid items to shrink and prevents cutoff */
      box-sizing: border-box;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--c-text);
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
    }

    /* Highlight effect when the user taps the field */
    .route-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
      outline: none;
      background: #ffffff;
    }

    /* Toast Notification Styling */
    #toast {
      position: fixed;
      top: 80px;
      /* Positioned just below the top bar */
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      /* Allows tapping through the message to the map */
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: var(--c-warn);
      color: #92400e;
      /* Dark amber for error text */
    }

    #bus-panel,
    #Ligne-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    .bus-route-item,
    .Ligne-route-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--c-border);
    }

    .bus-route-item:last-child,
    .Ligne-route-item:last-child {
      border-bottom: none;
    }

    .bus-route-item label,
    .Ligne-route-item label {
      flex: 1;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .bus-route-item input[type="checkbox"],
    .Ligne-route-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--c-accent2);
      cursor: pointer;
    }

    .Ligne-route-item input[type="checkbox"] {
      accent-color: #dc2626;
      /* Red for Ligne */
    }

    #coord-picker-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      max-height: 400px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-accent2);
      border-radius: var(--r);
      padding: 12px;
      z-index: 260;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
      font-family: monospace;
      font-size: 11px;
    }

    #coord-picker-panel.open {
      display: block;
    }

    #coord-picker-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--c-text);
      font-family: inherit;
    }

    #coord-list {
      max-height: 220px;
      overflow-y: auto;
      background: var(--c-bg);
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #coord-picker-panel button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="topbar">
    <div id="search-wrap">
      <div id="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          opacity="0.4">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input id="search-input" type="text" placeholder="وين تحب تمشي؟" autocomplete="off" />
        <span id="search-clear">✕</span>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- NEW: Geolocation Button -->
    <button class="icon-btn" id="btn-geolocate" title="My Location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
    <button class="icon-btn" id="btn-route" title="Route"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg></button>
    <button class="icon-btn" id="btn-bus" title="Bus Routes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6v6" />
        <path d="M15 6v6" />
        <path d="M2 12h19.6" />
        <path
          d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3" />
        <circle cx="7" cy="18" r="2" />
        <path d="M9 18h5" />
        <circle cx="16" cy="18" r="2" />
      </svg></button>
    <button class="icon-btn" id="btn-Ligne" title="Ligne / Metro"><svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="16" rx="2" />
        <path d="M4 11h16" />
        <path d="M12 3v8" />
        <path d="m8 19-2 3" />
        <path d="m18 22-2-3" />
        <circle cx="8" cy="15" r="1" />
        <circle cx="16" cy="15" r="1" />
      </svg></button>
    <button class="icon-btn" id="btn-debug" title="Debug"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg></button>

    <button class="icon-btn" id="btn-coord-debug" title="Coordinate Order Debug"
      onclick="document.getElementById('coord-debug-panel').style.display='block'">🔢</button>

    <button class="icon-btn" id="btn-picker" title="Coordinate Picker">📌</button>
  </div>
  <div id="debug-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">Debug Logs</span>
      <div>
        <button onclick="debugRails()"
          style="background:#7c3aed;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;margin-right:4px;color:#fff">🚆
          Rails</button>
        <button onclick="inspectMapCenter()"
          style="background:var(--c-accent2);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;margin-right:4px;color:#fff">🔍
          Inspect Center</button>
        <button onclick="copyDebugLogs()"
          style="background:var(--c-accent);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">📋
          Copy</button>
      </div>
    </div>
    <div id="debug-content"></div>
  </div>
  <div id="routing-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🗺️ Route</span><button onclick="toggleRoutingPanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px">
      <input id="from-input" class="route-input" type="text" placeholder="From: lat,lng" readonly
        onfocus="setActiveRouteInput('from-input')">
      <span style="color:var(--c-muted);font-size:12px">→</span>
      <input id="to-input" class="route-input" type="text" placeholder="To: lat,lng" readonly
        onfocus="setActiveRouteInput('to-input')">
    </div>


    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button onclick="planRoute('car')"
        style="flex:1;padding:10px;background:var(--c-accent2);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚗
        Car</button>
      <button onclick="planRoute('walk')"
        style="flex:1;padding:10px;background:var(--c-warn);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚶
        Walk</button>
    </div>
    <div id="route-result" style="text-align:center;font-size:13px;color:var(--c-muted);min-height:20px"></div>
  </div>
  <div id="bus-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🚌 Bus Routes</span><button onclick="toggleBusPanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>
    <div id="bus-route-list" style="max-height: 300px; overflow-y: auto;">
      <!-- Checkboxes will be injected here -->
    </div>
  </div>
  <div id="Ligne-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🚆 Ligne / Metro</span><button onclick="toggleLignePanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>
    <div id="Ligne-route-list" style="max-height: 300px; overflow-y: auto;">
      <!-- Checkboxes will be injected here -->
    </div>
  </div>
  <div id="coord-picker-panel">
    <h4>📌 Coordinate Picker (<span id="coord-count">0</span> points)</h4>
    <div id="coord-list">Click on the map to add points...</div>
    <button onclick="copyAllCoords()" style="background:var(--c-accent);color:#0f1117;font-weight:600">📋 Copy
      All</button>
    <button onclick="clearAllCoords()" style="background:#ef4444;color:#fff">🗑️ Clear</button>
    <button onclick="togglePickerMode()" style="background:var(--c-muted);color:#fff">✖ Close</button>
  </div>
  <!-- ── ROUTE COORDINATE DEBUG PANEL ─────────────────────────────────────── -->
  <!-- Pick any route file, tap "Show Numbers", and each coordinate gets a    -->
  <!-- numbered label on the map so you can verify sequential order visually. -->
  <!-- Tap "Clear" to remove all labels before loading the next file.         -->
  <div id="coord-debug-panel" style="
    display:none; position:fixed; bottom:20px; left:12px; right:12px;
    background:var(--c-surface); border:1.5px solid var(--c-border);
    border-radius:var(--r); padding:14px; z-index:300;
    box-shadow:0 8px 32px rgba(0,0,0,.15); backdrop-filter:blur(16px);
  ">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:600;font-size:13px">🔢 Coordinate Order Debug</span>
      <button onclick="document.getElementById('coord-debug-panel').style.display='none'"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer;line-height:1">×</button>
    </div>
    <select id="coord-debug-file" style="
      width:100%;box-sizing:border-box;background:var(--c-bg);border:1px solid var(--c-border);
      border-radius:8px;padding:8px 10px;color:var(--c-text);font-size:13px;margin-bottom:10px;
    ">
      <option value="">— pick a route file —</option>
      <option value="light_metro_1_departure_track.json">Metro 1 Departure</option>
      <option value="light_metro_1_return_track.json">Metro 1 Return</option>
      <option value="light_metro_2_departure_track.json">Metro 2 Departure</option>
      <option value="light_metro_2_return_track.json">Metro 2 Return</option>
      <option value="light_metro_3_departure_track.json">Metro 3 Departure</option>
      <option value="light_metro_3_return_track.json">Metro 3 Return</option>
      <option value="light_metro_4_departure_track.json">Metro 4 Departure</option>
      <option value="light_metro_4_return_track.json">Metro 4 Return</option>
      <option value="light_metro_5_departure_track.json">Metro 5 Departure</option>
      <option value="light_metro_5_return_track.json">Metro 5 Return</option>
      <option value="tgm_routes.json">TGM Routes</option>
    </select>
    <div style="display:flex;gap:8px">
      <button onclick="debugRouteCoords()"
        style="flex:1;padding:9px;background:var(--c-accent2);border:none;border-radius:8px;color:#fff;font-weight:600;font-size:13px;cursor:pointer">
        🔢 Show Numbers
      </button>
      <button onclick="clearCoordDebug()"
        style="flex:1;padding:9px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-weight:600;font-size:13px;cursor:pointer">
        🗑️ Clear
      </button>
    </div>
    <div id="coord-debug-status"
      style="margin-top:8px;font-size:11px;color:var(--c-muted);min-height:14px;text-align:center"></div>
  </div>
  <div id="toast"></div>

  <div id="panel">
    <div id="panel-title" style="font-weight:bold;font-size:16px"></div>
    <div id="panel-sub" style="font-size:12px;color:var(--c-muted);margin-bottom:12px"></div>
    <div id="panel-content"></div>
    <button onclick="closePanel()"
      style="width:100%;padding:10px;margin-top:15px;background:var(--c-border);border:none;border-radius:8px;color:var(--c-text)">Close</button>
  </div>

  <script>
    // ── GLOBALS ──────────────────────────────────────────────────────────────
    let map = null;
    let _protocolAdded = false;
    let _fileCache = null;
    let _fetchPromise = null;
    let _offlinePlaces = [];
    let routingClickActive = false;
    let activeRouteInput = null; // Tracks which input is waiting for a map tap
    let pickerMode = false;
    let pickedCoords = [];
    let pickedMarkers = [];
    let clickMarker = null; // Tracks the click-to-coordinates marker
    const PMTILES_PATH = '/data/tunis.pmtiles';

    // Bus routes state
    let selectedRoutes = new Set();
    let availableRoutes = [];

    // Ligne routes state
    let selectedLigneRoutes = new Set();
    let availableLigneRoutes = [];

    // ── DEBUG ────────────────────────────────────────────────────────────────
    function dbg(msg) {
      console.log('[Atlas]', msg);
      const content = document.getElementById('debug-content');
      if (!content) return;
      const div = document.createElement('div');
      div.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.1);padding:2px 0';
      div.innerHTML = `<span style="color:var(--c-muted)">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
      content.appendChild(div);
      content.scrollTop = content.scrollHeight;
    }

    // ── PMTILES RANGE FETCH POLYFILL (STABLE) ─────────────────────────────────
    const _origFetch = window.fetch;
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      let range = null;
      if (init?.headers) {
        if (typeof init.headers.get === 'function') range = init.headers.get('Range');
        else range = init.headers['Range'] || init.headers['range'];
      }
      if (range && url.includes('tunis.pmtiles')) {
        const match = range.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          if (!_fileCache) {
            if (!_fetchPromise) {
              _fetchPromise = (async () => {
                dbg('📥 Caching PMTiles...');
                try {
                  const r = await _origFetch.call(window, url);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const buf = await r.arrayBuffer();
                  _fileCache = buf;
                  dbg('✅ PMTiles Cached');
                  return _fileCache;
                } catch (e) {
                  dbg('❌ Cache Failed: ' + e.message);
                  _fetchPromise = null;
                  throw e;
                }
              })();
            }
            await _fetchPromise;
          }
          if (_fileCache) {
            const start = parseInt(match[1]), end = parseInt(match[2]);
            const slice = _fileCache.slice(start, end + 1);
            return new Response(slice, { status: 206, headers: { 'Content-Range': `bytes ${start}-${end}/${_fileCache.byteLength}`, 'Content-Length': String(slice.byteLength), 'Content-Type': 'application/octet-stream' } });
          }
        }
      }
      return _origFetch.apply(window, arguments);
    };

              availableRoutes = Array.from(routeIds).sort((a, b) => {

                const matchB = b.match(/^(\d+)/);

                if (matchA && matchB) {
                  const numA = parseInt(matchA[1]);
                  const numB = parseInt(matchB[1]);

                } else if (matchA) {

            (position) => {

              // 1. Fly to the location

              if (error.code === 1) { // PERMISSION_DENIED
                msg = '🚫 Location access denied. Please enable it in your phone settings.';
              } else if (error.code === 2) { // POSITION_UNAVAILABLE

    // How far to fly in when a search result is selected, based on the
    // place's class (the 'c' field from places.json). Settlement-level
    // places get a lower zoom (zoomed OUT, so you see the area), individual
    // points of interest get a higher zoom (zoomed IN close). Tune freely.
    const ZOOM_BY_CLASS = {
      city: 12,
      town: 13,
      village: 14,
      suburb: 14,
      neighbourhood: 15,
      quarter: 15,
      hamlet: 15,
      locality: 15,
    };
    const DEFAULT_POI_ZOOM = 17; // cafes, shops, schools, hospitals, transit stops, etc.

    async function initOfflineSearch() {
      try {
        const r = await fetch('./data/places.json');
        _offlinePlaces = await r.json();
        dbg(`🔍 Loaded ${_offlinePlaces.length} places`);
      } catch (e) { dbg('❌ Search load failed'); }
      const input = document.getElementById('search-input'), resultsEl = document.getElementById('search-results');

      // NEW: Handle Enter key to fly to coordinates
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const val = input.value.trim();
          // Regex to match "lat, lon" or "lat,lon" (with or without spaces)
          const match = val.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
          if (match) {
            const lat = parseFloat(match[1]);
            const lon = parseFloat(match[3]);
            // Basic validation to ensure it's a valid lat/lon
            if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
              e.preventDefault();
              flyToCoordinates(lat, lon);
            }
          }
        }
      });

      input.addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        document.getElementById('search-clear').classList.toggle('visible', q.length > 0);
        if (q.length < 2) { resultsEl.classList.remove('open'); return; }
        const allMatches = _offlinePlaces.filter(p => (p.na || '').toLowerCase().includes(q) || (p.nl || '').toLowerCase().includes(q) || (p.n || '').toLowerCase().includes(q));
        const matches = allMatches.slice(0, 10);
        dbg(`🔎 Search "${q}": ${allMatches.length} total matches, showing top ${matches.length}`);
        resultsEl.innerHTML = matches.map(p => `<div class="search-result-item" onclick="goToPlace(${p.lo},${p.la},'${(p.na || p.nl || p.n).replace(/'/g, "\\'")}','${(p.c || '').replace(/'/g, "\\'")}')"><div class="sri-icon">📍</div><div><div class="sri-name">${p.na || p.nl || p.n}</div><div class="sri-sub">${p.c || ''}</div></div></div>`).join('');
        resultsEl.classList.add('open');
      });
    }

    async function planRoute(mode) {
      const fromS = document.getElementById('from-input').value, toS = document.getElementById('to-input').value;
      if (!fromS || !toS) { dbg('⚠ Enter both points'); return; }
      const from = fromS.split(',').map(Number), to = toS.split(',').map(Number);

      // 🔌 Check if Capacitor and Valhalla plugin are actually available
      if (typeof Capacitor === 'undefined' || !Capacitor.Plugins?.Valhalla) {
        dbg('❌ Capacitor Valhalla plugin not found! (Are you running in a native container?)');
        document.getElementById('route-result').innerText = 'Routing plugin missing';
        return;
      }

      dbg(`🚗 Routing (${mode}) from [${from}] to [${to}]`);
      document.getElementById('route-result').innerText = 'Calculating...';

      try {
        const startTime = performance.now();
        const res = await Capacitor.Plugins.Valhalla.route({
          start: { lat: from[0], lon: from[1] },
          end: { lat: to[0], lon: to[1] },
          profile: mode === 'walk' ? 'pedestrian' : 'auto'
        });
        const endTime = performance.now();

        dbg(`✅ Route calculated in ${(endTime - startTime).toFixed(0)}ms | Dist: ${res.distance.toFixed(2)} km`);
        document.getElementById('route-result').innerHTML = `<b>${res.distance.toFixed(2)} km</b> · ${Math.round(res.duration / 60)} min`;

        if (res.geometry) {
          const coords = decodeValhallaPolyline(res.geometry);
          dbg(`📏 Route decoded: ${coords.length} coordinate points`);
          drawRoute(coords);
        }
      } catch (e) {
        dbg('❌ Route error: ' + e.message);
        document.getElementById('route-result').innerText = 'Failed';
      }
    }

    function decodeValhallaPolyline(encoded) {
      let inv = 1 / 1e6, index = 0, lat = 0, lng = 0, coords = [];
      while (index < encoded.length) {
        let b, shift = 0, res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (res & 1 ? ~(res >> 1) : (res >> 1));
        shift = 0; res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (res & 1 ? ~(res >> 1) : (res >> 1));
        coords.push([lng * inv, lat * inv]);
      }
      return coords;
    }

    function drawRoute(coords) {
      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#4ade80', 'line-width': 6, 'line-opacity': 0.8 } });
      map.fitBounds(maplibregl.LngLatBounds.convert([coords[0], coords[coords.length - 1]]), { padding: 50 });
    }

    // ── RAIL DEBUG ────────────────────────────────────────────────────────────
    // Answers two questions:
    //   Q1 — What features/classes are actually in the public_transport layer?
    //        This tells us whether rail lines are there at all, and what class
    //        strings the tile generator used (could be 'rail', 'light_rail',
    //        'tram', or something custom). LineString entries are the tracks.
    //   Q2 — Are the style layers registered and visible?
    // Run by tapping "🚆 Rails" in the debug panel, or call debugRails() in
    // the browser console. Re-run after panning to a known rail area.
    window.debugRails = function () {
      if (!map) { dbg('⚠️ debugRails: map not ready'); return; }
      dbg('🚆 ── Rail Debug (public_transport layer) ──');

      let features = [];
      try {
        features = map.querySourceFeatures('omt', { sourceLayer: 'public_transport' });
      } catch (e) {
        dbg('❌ querySourceFeatures failed: ' + e.message);
        return;
      }

      dbg(`📦 public_transport — ${features.length} features in viewport`);
      if (features.length === 0) {
        dbg('   ⚠️ 0 features. Pan to a rail/transit area and run again.');
      } else {
        // Break down by geometry type AND class so we can see exactly
        // what the tile generator put in this layer.
        const summary = {};
        features.forEach(f => {
          const geomType = f.geometry?.type || '?';
          const cls = f.properties?.class || '(no class)';
          const key = `${geomType} | class="${cls}"`;
          summary[key] = (summary[key] || 0) + 1;
        });
        Object.entries(summary)
          .sort((a, b) => b[1] - a[1])
          .forEach(([key, n]) => {
            const isLine = key.startsWith('LineString');
            dbg(`   ${isLine ? '🚆' : '  '} ${key}: ${n}${isLine ? ' ← potential rail track' : ''}`);
          });
      }

      // Q2: style layer registration
      ['rail-casing', 'rail-line'].forEach(id => {
        const layer = map.getLayer(id);
        if (!layer) {
          dbg(`❌ Style layer "${id}" NOT found — buildStyle() may have errored`);
        } else {
          const vis = map.getLayoutProperty(id, 'visibility') || 'visible';
          dbg(`✅ Style layer "${id}" | visibility: ${vis}`);
        }
      });
      dbg('🚆 ───────────────────────────────────────');
    };

    function inspectMapCenter() {
      if (!map) return;
      const center = map.getCenter();
      const point = map.project(center);

      // Query all rendered features at the center pixel
      const features = map.queryRenderedFeatures(point);

      dbg(`🔍 Inspecting features at map center (${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}) | Zoom: ${map.getZoom().toFixed(1)}`);

      // Group by source-layer and class
      const grouped = {};
      features.forEach(f => {
        const layer = f.layer['source-layer'] || f.layer.id;
        const cls = f.properties.class || f.properties.subclass || 'N/A';
        const key = `${layer} -> ${cls}`;
        if (!grouped[key]) grouped[key] = 0;
        grouped[key]++;
      });

      const keys = Object.keys(grouped).sort();
      if (keys.length === 0) {
        dbg("   ⚠️ No features found at this zoom level / location.");
      } else {
        keys.forEach(k => {
          dbg(`   📦 ${k}: ${grouped[k]} features`);
        });
      }
    }

    function copyDebugLogs() { const t = Array.from(document.getElementById('debug-content').children).map(el => el.innerText).join('\n'); navigator.clipboard.writeText(t).then(() => dbg('✓ Copied')); }
    // ── COORDINATE ORDER DEBUG ────────────────────────────────────────────────
    // Loads any route .json and places a numbered label at every coordinate
    // so you can visually confirm the points are in the right sequential order.
    //
    // Uses MapLibre markers with custom HTML so:
    //   • Numbers are always readable (white text on coloured pill)
    //   • First point (0) = green, last point = red, rest = blue
    //   • All markers are tracked in _coordDebugMarkers so clearCoordDebug()
    //     removes them without affecting any other map layer
    let _coordDebugMarkers = [];

    window.debugRouteCoords = function () {
      const select = document.getElementById('coord-debug-file');
      const status = document.getElementById('coord-debug-status');
      const file = select.value;
      if (!file) { status.textContent = 'Pick a file first.'; return; }

      status.textContent = '⏳ Loading…';
      clearCoordDebug();   // remove any previous set before adding new ones

      fetch(`./data/${file}`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status} — file not in assets/public/data/`);
          return res.json();
        })
        .then(data => {
          const feat = data.features[0];
          const coords = feat.geometry.coordinates;   // each is [lon, lat]
          const total = coords.length;

          // Only label every Nth point when there are a lot, to avoid
          // overlapping labels at tight zoom. Adjust STEP to taste.
          // At step=1 every single point gets a label.
          const STEP = total > 200 ? 5 : total > 100 ? 3 : total > 50 ? 2 : 1;

          coords.forEach(([lon, lat], i) => {
            if (i % STEP !== 0 && i !== total - 1) return;   // always show last

            const isFirst = i === 0;
            const isLast = i === total - 1;
            const bg = isFirst ? '#16a34a' : isLast ? '#dc2626' : '#2563eb';

            // Custom HTML element — a small pill with the index number
            const el = document.createElement('div');
            el.style.cssText = `
              background:${bg}; color:#fff; font-size:9px; font-weight:700;
              padding:1px 4px; border-radius:4px; white-space:nowrap;
              border:1px solid rgba(255,255,255,0.5);
              pointer-events:none; line-height:14px;
            `;
            el.textContent = String(i);

            const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
              .setLngLat([lon, lat])
              .addTo(map);

            _coordDebugMarkers.push(marker);
          });

          const shown = _coordDebugMarkers.length;
          status.textContent = `✅ ${total} coords — showing ${shown} label(s) (step=${STEP}). Green=0, Red=${total - 1}.`;
          dbg(`🔢 Coord debug: ${file} — ${total} points, ${shown} labels shown`);

          // Fly to the first coordinate so it's immediately visible
          map.flyTo({ center: coords[0], zoom: Math.max(map.getZoom(), 14) });
        })
        .catch(err => {
          status.textContent = `❌ ${err.message}`;
          dbg(`❌ Coord debug failed: ${err.message}`);
        });
    };

    window.clearCoordDebug = function () {
      _coordDebugMarkers.forEach(m => m.remove());
      _coordDebugMarkers = [];
      const status = document.getElementById('coord-debug-status');
      if (status) status.textContent = 'Labels cleared.';
    };

    window.onload = init;
  </script>
</body>
