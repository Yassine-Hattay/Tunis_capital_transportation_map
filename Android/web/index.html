<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: file: data: gap: https://ssl.gstatic.com; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; img-src 'self' data: blob: file: https:; connect-src 'self' https://localhost https://localhost:* http://localhost http://localhost:* https://*; font-src 'self' data: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />
  <title>Atlas — Offline Maps</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <script src="./lib/maplibre-gl.js"></script>
  <script src="./lib/pmtiles.js"></script>
  <style>
    :root {
      --c-bg: #f5f3f0;
      --c-surface: #ffffff;
      --c-border: rgba(0, 0, 0, 0.09);
      --c-accent: #4ade80;
      --c-accent2: #818cf8;
      --c-text: #333333;
      --c-muted: #6b7280;
      --c-warn: #fbbf24;
      --r: 14px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: var(--c-bg);
      color: var(--c-text);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #c8dff0;
    }

    #topbar {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    #search-wrap {
      flex: 1;
      min-width: 140px;
      /* Crucial: allows the search bar to shrink on narrow screens, but not below a usable width */
      position: relative;
    }

    #search-box {
      display: flex;
      align-items: center;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 14px;
      height: 48px;
      gap: 10px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--c-text);
      font-size: 15px;
      direction: rtl;
      text-align: right;
    }

    #search-input:not(:placeholder-shown) {
      direction: ltr;
      text-align: left;
    }

    /* English UI: the placeholder must read left-to-right too, otherwise the "?" jumps to the wrong end */
    html[dir="ltr"] #search-input:placeholder-shown {
      direction: ltr;
      text-align: left;
    }

    #search-clear {
      cursor: pointer;
      display: none;
      padding: 4px;
      opacity: 0.6;
      font-size: 16px;
    }

    #search-clear.visible {
      display: block;
    }

    #search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      overflow-x: hidden;
      overflow-y: auto;
      /* the list scrolls */
      max-height: min(62vh, calc(100vh - 150px));
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
    }

    #search-results.open {
      display: block;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--c-border);
      transition: background .12s;
    }

    .sri-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(129, 140, 248, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .sri-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
    }

    .sr-chips {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      background: var(--c-surface);
      border-bottom: 1px solid var(--c-border);
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
    }

    .sr-chips::-webkit-scrollbar {
      display: none;
    }

    .sr-chip {
      flex: none;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      background: var(--c-bg);
      cursor: pointer;
      white-space: nowrap;
    }

    .sr-chip small {
      color: var(--c-muted);
      font-size: 10px;
    }

    .sr-chip.active {
      background: var(--c-accent2);
      border-color: var(--c-accent2);
      color: #fff;
    }

    .sr-chip.active small {
      color: rgba(255, 255, 255, .8);
    }

    .sr-head {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--c-accent2);
      background: rgba(129, 140, 248, .08);
      border-bottom: 1px solid var(--c-border);
    }

    .sr-empty {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--c-muted);
    }

    .sri-sub {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 1px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      /* Crucial: prevents buttons from shrinking and clipping */
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
    }

    .icon-btn.active {
      background: var(--c-accent);
      color: #0f1117;
    }

    #debug-panel {
      position: absolute;
      top: 76px;
      left: 12px;
      right: 12px;
      background: #0a0f1a;
      border: 1px solid var(--c-accent2);
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #a0c0ff;
      z-index: 300;
      font-family: monospace;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    #debug-panel.show {
      display: block;
    }

    #routing-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #panel {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--c-surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      z-index: 400;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
    }

    #panel.open {
      display: block;
    }

    .route-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--c-bg);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid var(--c-border);
    }

    .route-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .route-input {
      width: 100%;
      min-width: 0;
      /* Crucial: allows grid items to shrink and prevents cutoff */
      box-sizing: border-box;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--c-text);
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
    }

    /* Highlight effect when the user taps the field */
    .route-input:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
      outline: none;
      background: #ffffff;
    }

    /* Toast Notification Styling */
    #toast {
      position: fixed;
      top: 80px;
      /* Positioned just below the top bar */
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      /* Allows tapping through the message to the map */
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.error {
      border-color: var(--c-warn);
      color: #92400e;
      /* Dark amber for error text */
    }

    #bus-panel,
    #Ligne-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 12px;
      right: 12px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      border-radius: var(--r);
      padding: 16px;
      z-index: 250;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    .bus-route-item,
    .Ligne-route-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--c-border);
    }

    .bus-route-item:last-child,
    .Ligne-route-item:last-child {
      border-bottom: none;
    }

    .bus-route-item label,
    .Ligne-route-item label {
      flex: 1;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .bus-route-item input[type="checkbox"],
    .Ligne-route-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--c-accent2);
      cursor: pointer;
    }

    .Ligne-route-item input[type="checkbox"] {
      accent-color: #dc2626;
      /* Red for Ligne */
    }

    #coord-picker-panel {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      max-height: 400px;
      background: var(--c-surface);
      border: 1.5px solid var(--c-accent2);
      border-radius: var(--r);
      padding: 12px;
      z-index: 260;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
      font-family: monospace;
      font-size: 11px;
    }

    #coord-picker-panel.open {
      display: block;
    }

    #coord-picker-panel h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--c-text);
      font-family: inherit;
    }

    #coord-list {
      max-height: 220px;
      overflow-y: auto;
      background: var(--c-bg);
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #coord-picker-panel button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-right: 4px;
    }

    /* ── DATA COLLECTION MODE: Hide existing UI ─────────────────────────────── */
    body.data-collecting #topbar,
    body.data-collecting #routing-panel,
    body.data-collecting #bus-panel,
    body.data-collecting #Ligne-panel,
    body.data-collecting #debug-panel,
    body.data-collecting #coord-picker-panel {
      display: none !important;
    }

    /* ── Data Collection Panel Styles ───────────────────────────────────────── */
    #data-collection-panel {
      display: none;
      /* Hidden by default */
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      z-index: 100;
      background: var(--c-surface);
      border: 1.5px solid var(--c-accent);
      border-radius: var(--r);
      padding: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .15);
      backdrop-filter: blur(16px);
    }

    #data-collection-panel.visible {
      display: block !important;
    }

    .dc-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 14px;
      color: var(--c-text);
    }

    .dc-status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      /* Red = stopped */
    }

    .dc-status-dot.ready {
      background: #fbbf24;
    }

    /* Yellow = GPS ready */
    .dc-status-dot.recording {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }

    .dc-status-dot.saved {
      background: #4ade80;
    }

    .dc-status-dot.requesting {
      background: #fbbf24;
      animation: pulse 1s infinite;
    }

    /* Green = saved */
    /* ── Pulsating Location Marker ────────────────────────────────────────── */
    .location-marker {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(59, 130, 246, 0.4);
      animation: pulse-location 2s infinite;
    }

    @keyframes pulse-location {
      0% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(59, 130, 246, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      }
    }

    /* ── Marked Point Markers ─────────────────────────────────────────────── */
    .marked-point-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: white;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .marked-point-marker.in {
      background: #16a34a;
      /* Green */
    }

    .marked-point-marker.out {
      background: #ef4444;
      /* Red */
    }

    .marked-point-marker.point {
      background: #3b82f6;
      /* Blue */
    }

    .marked-point-marker.bench {
      background: #d97706;
      /* Amber/Brown for Benches */
    }

    .marked-point-marker.ticket_booth {
      background: #8b5cf6;
      /* Violet for Ticket Booths */
    }

    /* Blue */

    .dc-btn-mark {
      background: var(--c-accent2);
      color: white;
    }

    .dc-btn-mark:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-btn-follow.active {
      background: #ef4444 !important;
      /* Turns red when actively following */
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .dc-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--c-border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 15px;
      box-sizing: border-box;
      background: var(--c-bg);
      color: var(--c-text);
    }

    .dc-input:focus {
      outline: none;
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
    }

    .dc-buttons {
      display: flex;
      gap: 8px;
    }

    .dc-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dc-btn-start {
      background: var(--c-accent);
      color: #0f1117;
    }

    .dc-btn-start:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-btn-stop {
      background: #ef4444;
      color: white;
    }

    .dc-btn-stop:disabled {
      background: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .dc-info {
      margin-top: 12px;
      font-size: 12px;
      color: var(--c-muted);
      text-align: center;
      font-family: monospace;
    }

    /* ── DATA COLLECTION MODE: Mask existing UI (Do not delete) ────────────────── */
    body.data-collecting #topbar,
    body.data-collecting #routing-panel,
    body.data-collecting #bus-panel,
    body.data-collecting #Ligne-panel,
    body.data-collecting #debug-panel,
    body.data-collecting #coord-picker-panel,
    body.data-collecting #panel {
      display: none !important;
    }


    /* ── Save Result Modal ──────────────────────────────────────────────────── */
    #save-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #save-modal.open {
      display: flex;
    }

    #save-modal-content {
      background: var(--c-surface);
      border-radius: var(--r);
      padding: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #save-modal-content h3 {
      margin: 0;
      font-size: 16px;
    }

    #save-modal-content textarea {
      width: 100%;
      min-height: 200px;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }

    #save-modal-content button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    #save-modal-content .btn-copy {
      background: var(--c-accent);
      color: #0f1117;
    }

    #save-modal-content .btn-close {
      background: var(--c-muted);
      color: white;
    }

    /* ── Interactive Decision Tree UI ──────────────────────────────────────── */
    .tree-container {
      padding: 10px;
    }

    .tree-node {
      margin-left: 16px;
      border-left: 2px solid var(--c-border);
      padding-left: 12px;
      margin-bottom: 8px;
    }

    .tree-label {
      background: var(--c-surface);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--c-border);
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--c-text);
    }

    .tree-children {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tree-branch {
      position: relative;
      padding-left: 16px;
    }

    .tree-branch::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      width: 12px;
      height: 2px;
      background: var(--c-border);
    }

    .tree-choice-btn {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tree-choice-btn:hover {
      background: var(--c-accent2);
      color: white;
      border-color: var(--c-accent2);
    }

    .tree-choice-btn.yes {
      border-left: 3px solid #22c55e;
    }

    .tree-choice-btn.no {
      border-left: 3px solid #ef4444;
    }

    .tree-children-content {
      margin-top: 8px;
    }

    .tree-leaf {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid #22c55e;
      color: #15803d;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-left: 16px;
      border-left: 3px solid #22c55e;
    }

    .tree-leaf.active {
      background: rgba(129, 140, 248, 0.15);
      color: var(--c-accent2);
      border-color: var(--c-accent2);
      font-weight: 600;
    }

    /* ── Custom Transfer & Home Markers ────────────────────────────────────── */
    .custom-marker-number {
      width: 26px;
      height: 26px;
      background: #ef4444;
      color: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .custom-marker-home {
      width: 30px;
      height: 30px;
      background: #f59e0b;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .custom-marker-bus {
      width: 30px;
      height: 30px;
      background: #2563eb;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    /* (removed) old rule that hid the whole #topbar incl. the search bar.
       Search-only mode is handled by the TRIP PLANNER MODE rules below. */

    /* ═══ TRIP PLANNER MODE ═══════════════════════════════════════════════════
       Only the search bar is visible. All data-collection / debug UI is hidden
       unless DEV_UI is on (add ?dev to the URL, or run
       localStorage.setItem('atlas_dev','1') in the webview inspector).        */
    body:not(.dev-ui) #ui-toggle-btn,
    body:not(.dev-ui) #data-collection-panel,
    body:not(.dev-ui) #save-modal,
    body:not(.dev-ui) #topbar>.icon-btn,
    body:not(.dev-ui) #routing-panel,
    body:not(.dev-ui) #bus-panel,
    body:not(.dev-ui) #Ligne-panel,
    body:not(.dev-ui) #debug-panel,
    body:not(.dev-ui) #coord-picker-panel,
    body:not(.dev-ui) #coord-debug-panel,
    body:not(.dev-ui) #panel {
      display: none !important;
    }

    #trip-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      display: none;
      flex-direction: column;
      max-height: 56vh;
      background: var(--c-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 32px rgba(0, 0, 0, .18);
      padding: 8px 14px calc(12px + env(safe-area-inset-bottom));
    }

    #trip-sheet.open {
      display: flex;
    }

    #trip-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--c-border);
      margin: 2px auto 8px;
      flex: none;
    }

    #trip-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex: none;
    }

    #trip-title {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.25;
    }

    #trip-sub {
      font-size: 12px;
      color: var(--c-muted);
      margin: 2px 0 8px;
    }

    #trip-close {
      background: none;
      border: none;
      color: var(--c-muted);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    #trip-list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
    }

    .trip-msg {
      padding: 18px 4px;
      text-align: center;
      color: var(--c-muted);
      font-size: 13px;
    }

    .trip-card {
      border: 1.5px solid var(--c-border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background: var(--c-bg);
    }

    .trip-card.sel {
      border-color: var(--c-accent2);
      background: #fff;
      box-shadow: 0 2px 12px rgba(129, 140, 248, .25);
    }

    .trip-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .trip-dist {
      font-size: 13px;
      font-weight: 500;
      color: var(--c-muted);
    }

    .trip-time {
      font-size: 19px;
      font-weight: 700;
    }

    .trip-eta {
      font-size: 12px;
      color: var(--c-muted);
    }

    .trip-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin: 6px 0 4px;
    }

    .chip {
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .chip-walk {
      background: #e5e7eb;
      color: #374151;
    }

    .chip-or {
      font-size: 11px;
      font-style: italic;
      color: var(--c-muted);
      padding: 0 2px;
    }

    /* ── Language Toggle Button ─────────────────────────────────────────── */
    #lang-toggle {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: var(--r);
      background: var(--c-surface);
      border: 1.5px solid var(--c-border);
      color: var(--c-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .1);
      order: 1;
      /* Pushes it to the far right in LTR (English) */
    }

    /* In RTL (Arabic), the start of the flex container is the right side. 
   Setting order to -1 makes it the first visual item, keeping it on the right. */
    html[dir="rtl"] #lang-toggle {
      order: -1;
    }

    /* ── RTL Support (Arabic) ───────────────────────────────────────────── */
    html[dir="rtl"] body {
      font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
    }

    html[dir="rtl"] .trip-card,
    html[dir="rtl"] .trip-title,
    html[dir="rtl"] .trip-sub,
    html[dir="rtl"] .trip-mini,
    html[dir="rtl"] .trip-subline,
    html[dir="rtl"] .trip-steps,
    html[dir="rtl"] .trip-foot {
      text-align: right;
    }

    html[dir="rtl"] .step {
      flex-direction: row-reverse !important;
      text-align: right;
    }

    html[dir="rtl"] .step>div {
      flex: 1;
      text-align: right;
    }

    html[dir="rtl"] .step .ico {
      width: 22px !important;
      text-align: center !important;
      margin-left: 10px !important;
      margin-right: 0 !important;
      order: 2 !important;
    }

    html[dir="rtl"] .step small {
      text-align: right;
      display: block;
    }

    .chip-sep {
      color: var(--c-muted);
      font-size: 12px;
    }

    .trip-subline {
      font-size: 12px;
      color: var(--c-muted);
    }

    .tag {
      background: #dcfce7;
      color: #166534;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 11px;
    }

    .trip-steps {
      margin-top: 10px;
      border-top: 1px solid var(--c-border);
      padding-top: 8px;
    }

    .step {
      display: flex;
      gap: 10px;
      font-size: 13px;
      padding: 5px 0;
    }

    .step .ico {
      width: 22px;
      text-align: center;
      flex: none;
    }

    .step small {
      color: var(--c-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    #trip-handle {
      cursor: pointer;
      padding: 6px 0;
      background-clip: content-box;
      width: 60px;
      height: 16px;
      box-sizing: border-box;
      margin: 0 auto 2px;
      background: linear-gradient(var(--c-border), var(--c-border)) center / 40px 4px no-repeat;
      border-radius: 0;
    }

    #trip-actions {
      display: flex;
      align-items: center;
      flex: none;
    }

    #trip-toggle {
      background: none;
      border: none;
      color: var(--c-muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0 8px;
      transition: transform .2s;
    }

    #trip-sheet.collapsed #trip-toggle {
      transform: rotate(180deg);
    }

    #trip-mini {
      display: none;
      font-size: 12px;
      color: var(--c-muted);
      margin: 2px 0 4px;
    }

    #trip-sheet.collapsed #trip-list,
    #trip-sheet.collapsed #trip-sub {
      display: none;
    }

    #trip-sheet.collapsed #trip-mini {
      display: block;
    }

    .trip-foot {
      text-align: center;
      font-size: 11px;
      color: var(--c-muted);
      padding: 4px 0 2px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- UI Toggle Button -->
  <button id="ui-toggle-btn"
    style="position: fixed; top: 14px; right: 12px; z-index: 1000; width: 48px; height: 48px; border-radius: 14px; background: #ffffff; border: 1.5px solid rgba(0,0,0,0.09); box-shadow: 0 4px 24px rgba(0,0,0,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px;"
    title="Toggle UI">⚙️</button>

  <!-- ── DATA COLLECTION PANEL ─────────────────────────────────────────────── -->
  <!-- ── SAVE RESULT MODAL ─────────────────────────────────────────────────── -->
  <div id="save-modal">
    <div id="save-modal-content">
      <h3>✅ Route Saved!</h3>
      <p style="margin:0;font-size:12px;color:var(--c-muted)">Copy the GeoJSON below or share it:</p>
      <textarea id="save-modal-textarea" readonly></textarea>
      <button class="btn-copy" onclick="copyModalContent()">📋 Copy to Clipboard</button>
      <button class="btn-close" onclick="closeSaveModal()">✖ Close</button>
    </div>
  </div>

  <div id="data-collection-panel">
    <div class="dc-status">
      <div id="dc-status-dot" class="dc-status-dot"></div>
      <span id="dc-status-text">Initializing GPS...</span>
    </div>

    <input type="text" id="dc-route-name" class="dc-input" placeholder="Route Name (e.g., 23 Aller)" />

    <div class="dc-buttons">
      <button id="dc-btn-start" class="dc-btn dc-btn-start" onclick="startRecording()" disabled>▶ Start</button>
      <button id="dc-btn-stop" class="dc-btn dc-btn-stop" onclick="stopRecording()" disabled>⏹ Stop & Save</button>
    </div>
    <select id="dc-point-type" class="dc-input" style="margin-bottom: 8px; padding: 10px;">
      <option value="point" selected>📍 Point (Default)</option>
      <option value="in">🟢 In</option>
      <option value="out">🔴 Out</option>
      <option value="bench">🪑 Bench</option>
      <option value="ticket_booth">🎟️ Ticket Booth</option>
    </select>
    <div class="dc-buttons" style="margin-top: 8px;">
      <button id="dc-btn-mark" class="dc-btn dc-btn-mark" onclick="markCurrentPoint()" disabled>📍 Mark Point</button>
      <button id="dc-btn-follow" class="dc-btn" style="background: var(--c-accent2); color: white;"
        onclick="toggleFollowMode()">🎯 Follow</button>
    </div>
    <div id="navigator-ui" style="margin-top: 8px; padding: 12px; background: var(--c-bg); border-radius: 8px;">
      <div id="nav-info" style="font-size: 12px; margin-bottom: 8px; font-weight: 600;">Loading primary route...</div>
    </div>
    <div class="dc-info" id="dc-info-text">Waiting for GPS signal...</div>
  </div>

  <div id="topbar">
    <button id="lang-toggle" title="English / العربية">EN</button>
    <div id="search-wrap">
      <div id="search-box">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          opacity="0.4">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input id="search-input" type="text" placeholder="إلى أين تريد الذهاب؟" autocomplete="off" />
        <span id="search-clear">✕</span>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- NEW: Geolocation Button -->
    <button class="icon-btn" id="btn-geolocate" title="My Location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
    <button class="icon-btn" id="btn-route" title="Route"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg></button>
    <button class="icon-btn" id="btn-bus" title="Bus Routes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6v6" />
        <path d="M15 6v6" />
        <path d="M2 12h19.6" />
        <path
          d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3" />
        <circle cx="7" cy="18" r="2" />
        <path d="M9 18h5" />
        <circle cx="16" cy="18" r="2" />
      </svg></button>
    <button class="icon-btn" id="btn-Ligne" title="Ligne / Metro"><svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="16" rx="2" />
        <path d="M4 11h16" />
        <path d="M12 3v8" />
        <path d="m8 19-2 3" />
        <path d="m18 22-2-3" />
        <circle cx="8" cy="15" r="1" />
        <circle cx="16" cy="15" r="1" />
      </svg></button>
    <button class="icon-btn" id="btn-debug" title="Debug"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg></button>

    <button class="icon-btn" id="btn-coord-debug" title="Coordinate Order Debug"
      onclick="document.getElementById('coord-debug-panel').style.display='block'">🔢</button>

    <button class="icon-btn" id="btn-picker" title="Coordinate Picker">📌</button>

    <button class="icon-btn" id="btn-satellite" title="Satellite View">🛰️</button>
  </div>
  <div id="debug-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">Debug Logs</span>
      <div>
        <button onclick="debugRails()"
          style="background:#7c3aed;border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;margin-right:4px;color:#fff">🚆
          Rails</button>
        <button onclick="inspectMapCenter()"
          style="background:var(--c-accent2);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;margin-right:4px;color:#fff">🔍
          Inspect Center</button>
        <button onclick="copyDebugLogs()"
          style="background:var(--c-accent);border:none;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer">📋
          Copy</button>
      </div>
    </div>
    <div id="debug-content"></div>
  </div>
  <div id="routing-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🗺️ Route</span><button onclick="toggleRoutingPanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px">
      <input id="from-input" class="route-input" type="text" placeholder="From: lat,lng" readonly
        onfocus="setActiveRouteInput('from-input')">
      <span style="color:var(--c-muted);font-size:12px">→</span>
      <input id="to-input" class="route-input" type="text" placeholder="To: lat,lng" readonly
        onfocus="setActiveRouteInput('to-input')">
    </div>


    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button onclick="planRoute('car')"
        style="flex:1;padding:10px;background:var(--c-accent2);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚗
        Car</button>
      <button onclick="planRoute('walk')"
        style="flex:1;padding:10px;background:var(--c-warn);border:none;border-radius:8px;color:#ffffff;font-weight:600;font-size:13px;cursor:pointer">🚶
        Walk</button>
    </div>
    <div id="route-result" style="text-align:center;font-size:13px;color:var(--c-muted);min-height:20px"></div>
  </div>
  <div id="bus-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🚌 Bus Routes</span><button onclick="toggleBusPanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>
    <div id="bus-route-list" style="max-height: 300px; overflow-y: auto;">
      <!-- Checkboxes will be injected here -->
    </div>
  </div>
  <div id="Ligne-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span
        style="font-weight:600;font-size:14px">🚆 Ligne / Metro</span><button onclick="toggleLignePanel()"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer">×</button></div>
    <div id="Ligne-route-list" style="max-height: 300px; overflow-y: auto;">
      <!-- Checkboxes will be injected here -->
    </div>
  </div>
  <div id="coord-picker-panel">
    <h4>📌 Coordinate Picker (<span id="coord-count">0</span> points)</h4>
    <div id="coord-list">Click on the map to add points...</div>
    <button onclick="copyAllCoords()" style="background:var(--c-accent);color:#0f1117;font-weight:600">📋 Copy
      All</button>
    <button onclick="clearAllCoords()" style="background:#ef4444;color:#fff">🗑️ Clear</button>
    <button onclick="togglePickerMode()" style="background:var(--c-muted);color:#fff">✖ Close</button>
  </div>
  <!-- ── ROUTE COORDINATE DEBUG PANEL ─────────────────────────────────────── -->
  <!-- Pick any route file, tap "Show Numbers", and each coordinate gets a    -->
  <!-- numbered label on the map so you can verify sequential order visually. -->
  <!-- Tap "Clear" to remove all labels before loading the next file.         -->
  <div id="coord-debug-panel" style="
    display:none; position:fixed; bottom:20px; left:12px; right:12px;
    background:var(--c-surface); border:1.5px solid var(--c-border);
    border-radius:var(--r); padding:14px; z-index:300;
    box-shadow:0 8px 32px rgba(0,0,0,.15); backdrop-filter:blur(16px);
  ">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:600;font-size:13px">🔢 Coordinate Order Debug</span>
      <button onclick="document.getElementById('coord-debug-panel').style.display='none'"
        style="background:none;border:none;color:var(--c-muted);font-size:20px;cursor:pointer;line-height:1">×</button>
    </div>
    <select id="coord-debug-file" style="
      width:100%;box-sizing:border-box;background:var(--c-bg);border:1px solid var(--c-border);
      border-radius:8px;padding:8px 10px;color:var(--c-text);font-size:13px;margin-bottom:10px;
    ">
      <option value="">— pick a route file —</option>
      <option value="light_metro_1_departure_track.json">Metro 1 Departure</option>
      <option value="light_metro_1_return_track.json">Metro 1 Return</option>
      <option value="light_metro_2_departure_track.json">Metro 2 Departure</option>
      <option value="light_metro_2_return_track.json">Metro 2 Return</option>
      <option value="light_metro_3_departure_track.json">Metro 3 Departure</option>
      <option value="light_metro_3_return_track.json">Metro 3 Return</option>
      <option value="light_metro_4_departure_track.json">Metro 4 Departure</option>
      <option value="light_metro_4_return_track.json">Metro 4 Return</option>
      <option value="light_metro_5_departure_track.json">Metro 5 Departure</option>
      <option value="light_metro_5_return_track.json">Metro 5 Return</option>
      <option value="tgm_routes.json">TGM Routes</option>
    </select>
    <div style="display:flex;gap:8px">
      <button onclick="debugRouteCoords()"
        style="flex:1;padding:9px;background:var(--c-accent2);border:none;border-radius:8px;color:#fff;font-weight:600;font-size:13px;cursor:pointer">
        🔢 Show Numbers
      </button>
      <button onclick="clearCoordDebug()"
        style="flex:1;padding:9px;background:var(--c-bg);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-weight:600;font-size:13px;cursor:pointer">
        🗑️ Clear
      </button>
    </div>
    <div id="coord-debug-status"
      style="margin-top:8px;font-size:11px;color:var(--c-muted);min-height:14px;text-align:center"></div>
  </div>
  <!-- ── TRIP PLANNER SHEET ─────────────────────────────────────────────────── -->
  <div id="trip-sheet">
    <div id="trip-handle"></div>
    <div id="trip-head">
      <div>
        <div id="trip-title"></div>
        <div id="trip-sub"></div>
        <div id="trip-mini"></div>
      </div>
      <div id="trip-actions">
        <button id="trip-toggle" aria-label="Hide / show routes">⌄</button>
        <button id="trip-close" aria-label="Clear route">×</button>
      </div>
    </div>
    <select id="trip-sort"
      style="width:100%; padding:8px 10px; border:1px solid var(--c-border); border-radius:8px; background:var(--c-bg); color:var(--c-text); font-size:13px; margin-bottom:8px; outline:none;">
      <option value="fastest">⚡ Fastest overall (Default)</option>
      <option value="least_walking">🚶 Least walking</option>
      <option value="least_transfers">🔄 Fewest transfers</option>
      <option value="prefer_metro">🚊 Prefer Métro</option>
      <option value="prefer_bus">🚌 Prefer Bus</option>
      <option value="prefer_rfr">🚆 Prefer RFR</option>
    </select>
    <div id="trip-list"></div>
  </div>
  <div id="toast"></div>

  <div id="panel">
    <div id="panel-title" style="font-weight:bold;font-size:16px"></div>
    <div id="panel-sub" style="font-size:12px;color:var(--c-muted);margin-bottom:12px"></div>
    <div id="panel-content"></div>
    <button onclick="closePanel()"
      style="width:100%;padding:10px;margin-top:15px;background:var(--c-border);border:none;border-radius:8px;color:var(--c-text)">Close</button>
  </div>

  <script>
    // ── GLOBALS ──────────────────────────────────────────────────────────────
    let map = null;
    let _protocolAdded = false;
    let _fileCache = null;
    let _fetchPromise = null;

    // ── PMTILES RANGE FETCH POLYFILL (STABLE, MULTI-FILE) ──────────────────────
    // Caches each .pmtiles file separately, keyed by its own URL, so the
    // vector basemap (tunis.pmtiles) and the satellite raster
    // (satellite_tunis.pmtiles) can both be cached side by side without
    // overwriting each other.
    const _fileCaches = {};
    const _fetchPromises = {};
    const _origFetch = window.fetch;
    window.fetch = async function (input, init) {
      const url = typeof input === 'string' ? input : (input?.url || String(input));
      let range = null;
      if (init?.headers) {
        if (typeof init.headers.get === 'function') range = init.headers.get('Range');
        else range = init.headers['Range'] || init.headers['range'];
      }
      if (range && url.endsWith('.pmtiles')) {
        const match = range.match(/bytes=(\d+)-(\d+)/);
        if (match) {
          if (!_fileCaches[url]) {
            if (!_fetchPromises[url]) {
              _fetchPromises[url] = (async () => {
                dbg('📥 Caching PMTiles: ' + url.split('/').pop());
                try {
                  const r = await _origFetch.call(window, url);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const buf = await r.arrayBuffer();
                  _fileCaches[url] = buf;
                  dbg('✅ PMTiles Cached: ' + url.split('/').pop());
                  return buf;
                } catch (e) {
                  dbg('❌ Cache Failed: ' + e.message);
                  delete _fetchPromises[url];
                  throw e;
                }
              })();
            }
            await _fetchPromises[url];
          }
          const cached = _fileCaches[url];
          if (cached) {
            const start = parseInt(match[1]), end = parseInt(match[2]);
            const slice = cached.slice(start, end + 1);
            return new Response(slice, { status: 206, headers: { 'Content-Range': `bytes ${start}-${end}/${cached.byteLength}`, 'Content-Length': String(slice.byteLength), 'Content-Type': 'application/octet-stream' } });
          }
        }
      }
      return _origFetch.apply(window, arguments);
    };

    // ── CSV PARSER (Handles Comma, Tab, or Semicolon separated files) ─────────
    function parseCSV(text) {
      const firstLine = text.split('\n')[0];
      let delimiter = ',';
      if (firstLine.split('\t').length > firstLine.split(',').length) delimiter = '\t';
      else if (firstLine.split(';').length > firstLine.split(',').length) delimiter = ';';

      const rows = [];
      let cur = '';
      let inQuotes = false;
      let row = [];
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { cur += '"'; i++; }
            else inQuotes = false;
          } else {
            cur += c;
          }
        } else {
          if (c === '"') inQuotes = true;
          else if (c === delimiter) { row.push(cur); cur = ''; }
          else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
          else if (c === '\r') { }
          else cur += c;
        }
      }
      if (cur.length > 0 || row.length > 0) {
        row.push(cur);
        rows.push(row);
      }
      return rows;
    }

    function addPickedCoord(lat, lng) {
      const num = pickedCoords.length + 1;
      pickedCoords.push([lng, lat]);

      const el = document.createElement('div');
      el.style.cssText = `background:#818cf8;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);`;
      el.innerText = num;

      const marker = new maplibregl.Marker({ element: el })
        .setLngLat([lng, lat])
        .addTo(map);
      pickedMarkers.push(marker);

      updateCoordList();
      dbg(`📌 Point #${num}: (${lng.toFixed(7)}, ${lat.toFixed(7)})`);
    }

    function updateCoordList() {
      const list = document.getElementById('coord-list');
      const count = document.getElementById('coord-count');
      count.innerText = pickedCoords.length;

      if (pickedCoords.length === 0) {
        list.innerText = 'Click on the map to add points...';
        return;
      }

      list.innerText = pickedCoords.map((c, i) =>
        `${String(i).padStart(2, ' ')}. (${c[0].toFixed(7)}, ${c[1].toFixed(7)})`
      ).join('\n');
    }

    function copyAllCoords() {
      if (pickedCoords.length === 0) {

        return;
      }
      const text = pickedCoords.map(c =>
        `(${c[0].toFixed(7)}, ${c[1].toFixed(7)}),`
      ).join('\n');

      navigator.clipboard.writeText(text).then(() => {
        showToast(`✅ Copied ${pickedCoords.length} coordinates`);
        dbg(`📋 Copied ${pickedCoords.length} coords to clipboard`);
      });
    }

        else if (toks.length > 1 && toks.every(x => k.words.some(w => w.startsWith(x) || w.replace(/^ال/, '').startsWith(x)))) t = 3;   // all words present, any order

        if (t < best) best = t;

    }
    function rankPlaces(raw) {

      for (const p of _offlinePlaces) {
        const t = _tier(p, q, toks);
        if (t === 9) continue;
        const pen = PLACE_CATS.has(_cat(p)) ? 0 : MAJOR_CATS.has(_cat(p)) ? 5 : 10;
        out.push({ p, s: t * 10 + pen + Math.min(30, (p.n || p.nl || p.na || '').length) / 100 });   // shorter names first on ties
      }
      out.sort((a, b) => a.s - b.s);
      return out.map(x => x.p);
    }

    let _ranked = [], _shown = [], _placeFilter = null, _lastQ = '', _distInfo = null;
    function renderSearchResults() {
      const el = document.getElementById('search-results');

        el.classList.add('open'); _shown = []; return;
      }
      // category chips are built from what the current query actually matched
      const counts = new Map();
      _ranked.forEach(p => { const c = _cat(p); if (c) counts.set(c, (counts.get(c) || 0) + 1); });
      if (_placeFilter && !counts.has(_placeFilter)) _placeFilter = null;
      const cats = [...counts.entries()].sort((a, b) => (PLACE_CATS.has(b[0]) - PLACE_CATS.has(a[0])) || b[1] - a[1]).slice(0, MAX_CHIPS);
      if (_placeFilter && !cats.some(c => c[0] === _placeFilter)) cats.unshift([_placeFilter, counts.get(_placeFilter)]);

        + cats.map(([c, n]) => `<span class="sr-chip${c === _placeFilter ? ' active' : ''}" data-c="${_escS(c)}" onclick="setPlaceFilter(this.dataset.c)">${_escS(catLabel(c))} <small>${n}</small></span>`).join('') + '</div>'

      const head = _distInfo ? `<div class="sr-head">${districtHeader(_distInfo)}</div>` : '';
      el.innerHTML = chips + head + _shown.map((p, i) =>
        `<div class="search-result-item" onclick="pickPlace(${i})"><div class="sri-icon">📍</div><div><div class="sri-name">${_escS(placeLabel(p))}</div><div class="sri-sub">${_escS(catLabel(_cat(p)))}</div></div></div>`).join('');

    function pickPlace(i) {

    // ── DISTRICT SEARCH ("hotel marsa", "pharmacie ezzahra", "فنادق المرسى") ──────────────────────────
    // places.json has no district field, so we look places up in data/district_boundaries.json instead:
    //   1. find a district (or governorate) name inside the query, in French / English / Arabic
    //   2. turn the remaining words into a category ("hotel" → hotel) or, failing that, a name filter ("pizza")
    //   3. keep every place whose coordinates fall INSIDE that district's polygon (point-in-polygon)
    // The normal name-based results are still appended underneath, so nothing that used to match disappears.
    let _distAliases = null;                       // alias → district / governorate entry
    const _stripAp = s => s.replace(/['’\-]/g, '');
    const DIST_STOP = new Set(['in', 'at', 'near', 'around', 'a', 'à', 'au', 'aux', 'de', 'du', 'des', 'dans', 'en', 'la', 'le', 'les', 'el', 'al', 'l', 'd', 'et', 'and', 'في', 'ب', 'قرب', 'حول', 'و']);

    const CAT_SYNONYMS = [

      [['guest house', 'maison d hote', 'maisons d hotes', 'gite', 'دار ضيافة', 'نزل'], ['guest_house']],
      [['restaurant', 'restaurants', 'resto', 'restos', 'مطعم', 'مطاعم'], ['restaurant']],

      [['ecole', 'école', 'ecoles', 'écoles', 'school', 'schools', 'مدرسة', 'مدارس'], ['school']],
      [['lycee', 'lycée', 'lycees', 'college', 'collège', 'معهد', 'معاهد', 'إعدادية'], ['college']],
      [['universite', 'université', 'university', 'faculte', 'faculté', 'جامعة', 'جامعات', 'كلية'], ['university']],
      [['hopital', 'hôpital', 'hospital', 'مستشفى', 'مستشفيات'], ['hospital']],
      [['clinique', 'cliniques', 'clinic', 'clinics', 'مصحة', 'مصحات', 'عيادة', 'عيادات'], ['clinic']],

      [['mosquee', 'mosquée', 'mosquees', 'mosque', 'mosques', 'جامع', 'مسجد', 'مساجد', 'جوامع'], ['place_of_worship']],
      [['station service', 'station-service', 'essence', 'fuel', 'petrol', 'gas station', 'محطة وقود', 'بنزين'], ['fuel']],
      [['parking', 'parkings', 'موقف سيارات', 'مواقف'], ['parking']],
      [['police', 'commissariat', 'شرطة'], ['police']],
      [['poste', 'bureau de poste', 'post office', 'مكتب بريد', 'بريد'], ['post_office']],
      [['boulangerie', 'boulangeries', 'bakery', 'مخبزة', 'مخابز'], ['bakery']],
      [['patisserie', 'pâtisserie', 'patisseries', 'pastry', 'حلويات'], ['pastry', 'confectionery']],
      [['boucherie', 'boucheries', 'butcher', 'جزار', 'جزارة'], ['butcher']],
      [['vetement', 'vêtements', 'vetements', 'clothes', 'clothing', 'ملابس'], ['clothes']],
      [['gym', 'salle de sport', 'fitness', 'قاعة رياضة'], ['fitness_centre', 'sports_centre']],
      [['parc', 'parcs', 'park', 'parks', 'jardin', 'jardins', 'garden', 'حديقة', 'حدائق'], ['park', 'garden']],
      [['marche', 'marché', 'marches', 'souk', 'marketplace', 'سوق', 'أسواق'], ['marketplace']],
      [['mall', 'malls', 'centre commercial', 'مركز تجاري'], ['mall']],
      [['coiffeur', 'coiffure', 'hairdresser', 'salon de coiffure', 'حلاق', 'حلاقة'], ['hairdresser']],
      [['garage', 'mecanicien', 'mécanicien', 'car repair', 'ورشة سيارات'], ['car_repair']],
      [['creche', 'crèche', 'garderie', 'kindergarten', 'روضة', 'روضة أطفال'], ['kindergarten', 'childcare']],
      [['librairie', 'bookstore', 'books', 'مكتبة كتب', 'كتب'], ['books']],
      [['bibliotheque', 'bibliothèque', 'library', 'مكتبة'], ['library']],
      [['optique', 'opticien', 'optician', 'نظارات'], ['optician']]
    ];
    let _catKeyMap = null;
    function _catKeys() {
      if (_catKeyMap) return _catKeyMap;
      const m = new Map(), add = (k, cats) => {
        const key = _stripAp(_norm(k)).replace(/_/g, ' ').trim(); if (!key) return;
        if (!m.has(key)) m.set(key, new Set()); cats.forEach(c => m.get(key).add(c));
      };
      const all = new Set(_offlinePlaces.map(_cat).filter(Boolean)); Object.keys(CAT_AR).forEach(c => all.add(c));
      all.forEach(c => { add(c, [c]); add(c + 's', [c]); add(c.replace(/_/g, ' '), [c]); if (CAT_AR[c]) add(CAT_AR[c], [c]); });
      CAT_SYNONYMS.forEach(([keys, cats]) => keys.forEach(k => add(k, cats)));
      return (_catKeyMap = m);
    }

    function _bbox(ring) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, y] of ring) { if (x < a) a = x; if (x > c) c = x; if (y < b) b = y; if (y > d) d = y; } return [a, b, c, d]; }
    function _inRing(x, y, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    function _inPoly(d, lo, la) {                                   // d.rings[0] = outer ring, the rest are holes
      if (lo < d.bbox[0] || lo > d.bbox[2] || la < d.bbox[1] || la > d.bbox[3]) return false;
      if (!_inRing(lo, la, d.rings[0])) return false;
      for (let k = 1; k < d.rings.length; k++) if (_inRing(lo, la, d.rings[k])) return false;
      return true;
    }
    function _membersOf(e) {                                        // all places inside a district / governorate (cached)
      if (e._members) return e._members;
      const polys = e.parts || [e];
      return (e._members = _offlinePlaces.filter(p => polys.some(d => _inPoly(d, p.lo, p.la))));
    }
    async function loadDistricts() {
      try {
        const r = await fetch('./data/district_boundaries.json');
        const fc = await r.json();
        const aliases = new Map(), govs = new Map(), districts = [];
        const keyOf = s => _stripAp(_norm(s)).trim();
        const addAlias = (names, entry) => names.filter(Boolean).forEach(n => {
          const k = keyOf(n); if (!k) return;
          [k, k.replace(/^(la |le |les |el |al |ال)/, ''), k.replace(/^cite /, '').replace(/^(la |le |les |el |al )/, '')]
            .filter(x => x && x.length > 1).forEach(x => { if (!aliases.has(x) || entry.gov) aliases.set(x, entry); });   // a governorate beats a district of the same name
        });
        for (const f of fc.features) {
          const g = f.geometry; if (!g || (g.type !== 'Polygon' && g.type !== 'MultiPolygon')) continue;
          const pr = f.properties, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
          const parts = polys.map(rings => ({ rings, bbox: _bbox(rings[0]) }));
          const e = { en: pr.adm3_name, ar: pr.adm3_name1 || pr.adm3_name, parts, center: [pr.center_lon, pr.center_lat], gov: false };
          // a MultiPolygon is just several polygons that share one name
          if (parts.length === 1) { e.rings = parts[0].rings; e.bbox = parts[0].bbox; delete e.parts; }
          districts.push({ e, pr });
          addAlias([pr.adm3_name, pr.adm3_name1, pr.adm3_ref_name], e);
          const gk = pr.adm2_pcode;
          if (!govs.has(gk)) govs.set(gk, { en: pr.adm2_name, ar: pr.adm2_name1 || pr.adm2_name, parts: [], gov: true, names: [pr.adm2_name, pr.adm2_name1, pr.adm2_name2, 'Manouba'].filter(Boolean), centers: [] });
          const gv = govs.get(gk); (e.parts || [e]).forEach(p => gv.parts.push(p)); gv.centers.push(e.center);
        }
        for (const gv of govs.values()) {
          gv.center = [gv.centers.reduce((s, c) => s + c[0], 0) / gv.centers.length, gv.centers.reduce((s, c) => s + c[1], 0) / gv.centers.length];
          if (gv.en === 'Manubah') gv.names.push('Manouba');
          addAlias(gv.names, gv);

        _distAliases = aliases;

      } catch (e) { dbg('⚠️ district boundaries not loaded: ' + e.message); }
    }

    // "hotels in la marsa" → { dist: <La Marsa>, rest: ['hotels'] }
    function parseDistrictQuery(raw) {
      if (!_distAliases) return null;
      const toks = _norm(raw).trim().split(' ').map(_stripAp).filter(Boolean);
      if (toks.length < 2) return null;
      const fixAr = k => k.startsWith('بال') ? 'ال' + k.slice(3) : k;           // "بالمرسى" → "المرسى"
      for (let len = Math.min(3, toks.length - 1); len >= 1; len--) {
        for (let i = 0; i + len <= toks.length; i++) {
          const key = toks.slice(i, i + len).join(' ');
          const dist = _distAliases.get(key) || _distAliases.get(fixAr(key));
          if (!dist) continue;
          const rest = [...toks.slice(0, i), ...toks.slice(i + len)].filter(t => !DIST_STOP.has(t));
          if (rest.length) return { dist, rest };
        }
      }
      return null;
    }
    // remaining words → a category (longest phrase first) + leftover words that must appear in the place's name
    function resolveTerm(rest) {
      const map = _catKeys(), left = rest.slice();
      let cats = null;
      for (let len = Math.min(3, left.length); len >= 1 && !cats; len--) {
        for (let i = 0; i + len <= left.length && !cats; i++) {
          const c = map.get(left.slice(i, i + len).join(' '));
          if (c) { cats = c; left.splice(i, len); }
        }
      }
      return { cats, name: left };
    }
    // sort anchor = the actual town / suburb inside the district (its real centre), falling back to the polygon's centroid
    function _anchorOf(dist) {
      if (dist._anchor) return dist._anchor;
      let c = dist.center;
      if (!dist.gov) {
        const key = _stripAp(_norm(dist.en)).trim();
        const town = _membersOf(dist).find(p => PLACE_CATS.has(_cat(p)) && _keys(p).some(k => k.full === key || k.bare === key));
        if (town) c = [town.lo, town.la];
      }
      return (dist._anchor = c);
    }
    function districtSearch(dist, term) {
      const q = term.name.join(' '), out = [], [cx, cy] = _anchorOf(dist);
      for (const p of _membersOf(dist)) {
        if (term.cats && !term.cats.has(_cat(p))) continue;
        let s = 0;
        if (term.name.length) { s = _tier(p, q, term.name); if (s === 9) continue; }
        out.push({ p, s, d: ((p.lo - cx) * 0.8) ** 2 + (p.la - cy) ** 2 });          // name match first, then nearest the centre
      }
      out.sort((a, b) => a.s - b.s || a.d - b.d);
      return out.map(x => x.p);
    }
    // the full list: district results first, then the normal name matches that aren't already in it
    function searchAll(raw) {
      const normal = rankPlaces(raw);
      const dq = parseDistrictQuery(raw);
      if (!dq) return { list: normal, info: null };
      const term = resolveTerm(dq.rest), hits = districtSearch(dq.dist, term);
      if (!hits.length) return { list: normal, info: null };
      const seen = new Set(hits);
      return { list: hits.concat(normal.filter(p => !seen.has(p))), info: { dist: dq.dist, term, n: hits.length } };
    }
    function districtHeader(info) {
      const dn = LANG === 'ar' ? info.dist.ar : info.dist.en, inw = LANG === 'ar' ? 'في' : 'in';
      const what = info.term.cats ? catLabel([...info.term.cats][0]) : '“' + info.term.name.join(' ') + '”';
      return `${_escS(what)} ${inw} ${_escS(dn)} · ${info.n}`;
    }

    async function initOfflineSearch() {
      try {
        const r = await fetch('./data/places.json');
        _offlinePlaces = await r.json();
        dbg(`🔍 Loaded ${_offlinePlaces.length} places`);
        loadDistricts();            // district polygons for "hotel marsa" style searches (loads in the background)
      } catch (e) { dbg('❌ Search load failed'); }
      const input = document.getElementById('search-input'), resultsEl = document.getElementById('search-results');

      // NEW: Handle Enter key to fly to coordinates
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const val = input.value.trim();
          // Regex to match "lat, lon" or "lat,lon" (with or without spaces)
          const match = val.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
          if (match) {
            const lat = parseFloat(match[1]);
            const lon = parseFloat(match[3]);
            // Basic validation to ensure it's a valid lat/lon
            if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
              e.preventDefault();
              flyToCoordinates(lat, lon);
            }
          }
        }
      });

      input.addEventListener('input', e => {
        const raw = e.target.value.trim();
        document.getElementById('search-clear').classList.toggle('visible', raw.length > 0);
        if (raw.length < 2) { resultsEl.classList.remove('open'); _lastQ = raw; _placeFilter = null; _distInfo = null; return; }
        if (_lastQ.length < 2) _placeFilter = null;          // a new search starts without a leftover filter
        _lastQ = raw;
        const found = searchAll(raw);              // name matches + (if the query names a district) everything inside that district
        _ranked = found.list; _distInfo = found.info;
        dbg(`🔎 Search "${raw}": ${_ranked.length} matches${_distInfo ? ' (' + _distInfo.n + ' in district)' : ''}`);
        renderSearchResults();
      });
    }

    window.goToPlace = (lon, lat, name, cls) => {
      const coords = [lon, lat];
      dbg(`📍 Flying to: ${name} at [${lat}, ${lon}] (Class: ${cls})`);

      // 1. Remove previous search marker if it exists
      if (window._searchMarker) {
        window._searchMarker.remove();
      }

      // 2. Add a new RED Marker for this search result
      // This allows you to visually verify the exact location on the map
      window._searchMarker = new maplibregl.Marker({ color: '#ff0000' })
        .setLngLat(coords)
        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b>${name}</b><br><small>${cls}</small>`))
        .addTo(map);

      // 3. Fly to the location
      if (DEV_UI) map.flyTo({ center: coords, zoom: zoomForClass(cls) });
      else planTripTo(lat, lon, name);

      // 4. Update UI
      document.getElementById('search-input').value = name;
      document.getElementById('search-results').classList.remove('open');
    };

    function flyToCoordinates(lat, lon) {
      const coords = [lon, lat];
      const name = `${lat.toFixed(7)}, ${lon.toFixed(7)}`;
      dbg(`📍 Flying to coordinates: [${lat}, ${lon}]`);

      // Remove previous search marker if it exists
      if (window._searchMarker) {
        window._searchMarker.remove();
      }

      // Add a new RED Marker for the coordinates
      window._searchMarker = new maplibregl.Marker({ color: '#ff0000' })
        .setLngLat(coords)
        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<b>Selected Location</b><br><small>${name}</small>`))
        .addTo(map);

      // Fly to the location at a detailed zoom level
      if (DEV_UI) map.flyTo({ center: coords, zoom: 17 });
      else planTripTo(lat, lon, name);

      // Update the search bar text and close the dropdown
      document.getElementById('search-input').value = name;
      document.getElementById('search-results').classList.remove('open');
    }

    function clearSearch() { document.getElementById('search-input').value = ''; document.getElementById('search-results').classList.remove('open'); document.getElementById('search-clear').classList.remove('visible'); }
    // ── ROUTING ──────────────────────────────────────────────────────────────

    function toggleLigneRoute(id) {

    function updateLigneFilter() {
      if (!map.getLayer('Ligne-routes-line')) return;

      let filter;
      if (selectedLigneRoutes.size === 0) {
        filter = ['==', ['get', 'line_id'], '__NONE__'];
      } else {
        filter = ['in', ['get', 'line_id'], ['literal', Array.from(selectedLigneRoutes)]];

      // Filter the route lines and floating labels
      map.setFilter('Ligne-routes-line', filter);

    function updateRouteFilter() {
      if (!map.getLayer('bus-routes-line')) return;

      let filter;
      if (selectedRoutes.size === 0) {
        // Match nothing
        filter = ['==', ['get', 'line_id'], '__NONE__'];
      } else {
        // Match selected
        filter = ['in', ['get', 'line_id'], ['literal', Array.from(selectedRoutes)]];

    async function planRoute(mode) {
      const fromS = document.getElementById('from-input').value, toS = document.getElementById('to-input').value;
      if (!fromS || !toS) { dbg('⚠ Enter both points'); return; }
      const from = fromS.split(',').map(Number), to = toS.split(',').map(Number);

      // 🔌 Check if Capacitor and Valhalla plugin are actually available
      if (typeof Capacitor === 'undefined' || !Capacitor.Plugins?.Valhalla) {
        dbg('❌ Capacitor Valhalla plugin not found! (Are you running in a native container?)');
        document.getElementById('route-result').innerText = 'Routing plugin missing';
        return;
      }

      dbg(`🚗 Routing (${mode}) from [${from}] to [${to}]`);
      document.getElementById('route-result').innerText = 'Calculating...';

      try {
        const startTime = performance.now();
        const res = await Capacitor.Plugins.Valhalla.route({
          start: { lat: from[0], lon: from[1] },
          end: { lat: to[0], lon: to[1] },
          profile: mode === 'walk' ? 'pedestrian' : 'auto'
        });
        const endTime = performance.now();

        dbg(`✅ Route calculated in ${(endTime - startTime).toFixed(0)}ms | Dist: ${res.distance.toFixed(2)} km`);
        document.getElementById('route-result').innerHTML = `<b>${res.distance.toFixed(2)} km</b> · ${Math.round(res.duration / 60)} min`;

        if (res.geometry) {
          const coords = decodeValhallaPolyline(res.geometry);
          dbg(`📏 Route decoded: ${coords.length} coordinate points`);
          drawRoute(coords);
        }
      } catch (e) {
        dbg('❌ Route error: ' + e.message);
        document.getElementById('route-result').innerText = 'Failed';
      }
    }

    function decodeValhallaPolyline(encoded) {
      let inv = 1 / 1e6, index = 0, lat = 0, lng = 0, coords = [];
      while (index < encoded.length) {
        let b, shift = 0, res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lat += (res & 1 ? ~(res >> 1) : (res >> 1));
        shift = 0; res = 0;
        do { b = encoded.charCodeAt(index++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        lng += (res & 1 ? ~(res >> 1) : (res >> 1));
        coords.push([lng * inv, lat * inv]);
      }
      return coords;
    }

    function drawRoute(coords) {
      if (map.getLayer('route')) map.removeLayer('route');
      if (map.getSource('route')) map.removeSource('route');
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#4ade80', 'line-width': 6, 'line-opacity': 0.8 } });
      map.fitBounds(maplibregl.LngLatBounds.convert([coords[0], coords[coords.length - 1]]), { padding: 50 });
    }

    // ── RAIL DEBUG ────────────────────────────────────────────────────────────
    // Answers two questions:
    //   Q1 — What features/classes are actually in the public_transport layer?
    //        This tells us whether rail lines are there at all, and what class
    //        strings the tile generator used (could be 'rail', 'light_rail',
    //        'tram', or something custom). LineString entries are the tracks.
    //   Q2 — Are the style layers registered and visible?
    // Run by tapping "🚆 Rails" in the debug panel, or call debugRails() in
    // the browser console. Re-run after panning to a known rail area.
    window.debugRails = function () {
      if (!map) { dbg('⚠️ debugRails: map not ready'); return; }
      dbg('🚆 ── Rail Debug (public_transport layer) ──');

      let features = [];
      try {
        features = map.querySourceFeatures('omt', { sourceLayer: 'public_transport' });
      } catch (e) {
        dbg('❌ querySourceFeatures failed: ' + e.message);
        return;
      }

      dbg(`📦 public_transport — ${features.length} features in viewport`);
      if (features.length === 0) {
        dbg('   ⚠️ 0 features. Pan to a rail/transit area and run again.');
      } else {
        // Break down by geometry type AND class so we can see exactly
        // what the tile generator put in this layer.
        const summary = {};
        features.forEach(f => {
          const geomType = f.geometry?.type || '?';
          const cls = f.properties?.class || '(no class)';
          const key = `${geomType} | class="${cls}"`;
          summary[key] = (summary[key] || 0) + 1;
        });
        Object.entries(summary)
          .sort((a, b) => b[1] - a[1])
          .forEach(([key, n]) => {
            const isLine = key.startsWith('LineString');
            dbg(`   ${isLine ? '🚆' : '  '} ${key}: ${n}${isLine ? ' ← potential rail track' : ''}`);
          });
      }

      // Q2: style layer registration
      ['rail-casing', 'rail-line'].forEach(id => {
        const layer = map.getLayer(id);
        if (!layer) {
          dbg(`❌ Style layer "${id}" NOT found — buildStyle() may have errored`);
        } else {
          const vis = map.getLayoutProperty(id, 'visibility') || 'visible';
          dbg(`✅ Style layer "${id}" | visibility: ${vis}`);
        }
      });
      dbg('🚆 ───────────────────────────────────────');
    };

    function inspectMapCenter() {
      if (!map) return;
      const center = map.getCenter();
      const point = map.project(center);

      // Query all rendered features at the center pixel
      const features = map.queryRenderedFeatures(point);

      dbg(`🔍 Inspecting features at map center (${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}) | Zoom: ${map.getZoom().toFixed(1)}`);

      // Group by source-layer and class
      const grouped = {};
      features.forEach(f => {
        const layer = f.layer['source-layer'] || f.layer.id;
        const cls = f.properties.class || f.properties.subclass || 'N/A';
        const key = `${layer} -> ${cls}`;
        if (!grouped[key]) grouped[key] = 0;
        grouped[key]++;
      });

      const keys = Object.keys(grouped).sort();
      if (keys.length === 0) {
        dbg("   ⚠️ No features found at this zoom level / location.");
      } else {
        keys.forEach(k => {
          dbg(`   📦 ${k}: ${grouped[k]} features`);
        });
      }
    }

    // ── COORDINATE ORDER DEBUG ────────────────────────────────────────────────
    // Loads any route .json and places a numbered label at every coordinate
    // so you can visually confirm the points are in the right sequential order.
    //
    // Uses MapLibre markers with custom HTML so:
    //   • Numbers are always readable (white text on coloured pill)
    //   • First point (0) = green, last point = red, rest = blue

    let _coordDebugMarkers = [];

    window.debugRouteCoords = function () {
      const select = document.getElementById('coord-debug-file');
      const status = document.getElementById('coord-debug-status');
      const file = select.value;
      if (!file) { status.textContent = 'Pick a file first.'; return; }

      status.textContent = '⏳ Loading…';
      clearCoordDebug();   // remove any previous set before adding new ones

      fetch(`./data/${file}`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status} — file not in assets/public/data/`);
          return res.json();
        })
        .then(data => {
          const feat = data.features[0];
          const coords = feat.geometry.coordinates;   // each is [lon, lat]
          const total = coords.length;

          // Only label every Nth point when there are a lot, to avoid
          // overlapping labels at tight zoom. Adjust STEP to taste.
          // At step=1 every single point gets a label.
          const STEP = total > 200 ? 5 : total > 100 ? 3 : total > 50 ? 2 : 1;

          coords.forEach(([lon, lat], i) => {
            if (i % STEP !== 0 && i !== total - 1) return;   // always show last

            const isFirst = i === 0;
            const isLast = i === total - 1;
            const bg = isFirst ? '#16a34a' : isLast ? '#dc2626' : '#2563eb';

            // Custom HTML element — a small pill with the index number
            const el = document.createElement('div');
            el.style.cssText = `
              background:${bg}; color:#fff; font-size:9px; font-weight:700;
              padding:1px 4px; border-radius:4px; white-space:nowrap;
              border:1px solid rgba(255,255,255,0.5);
              pointer-events:none; line-height:14px;
            `;
            el.textContent = String(i);

            const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
              .setLngLat([lon, lat])
              .addTo(map);

            _coordDebugMarkers.push(marker);
          });

          const shown = _coordDebugMarkers.length;
          status.textContent = `✅ ${total} coords — showing ${shown} label(s) (step=${STEP}). Green=0, Red=${total - 1}.`;
          dbg(`🔢 Coord debug: ${file} — ${total} points, ${shown} labels shown`);

          // Fly to the first coordinate so it's immediately visible
          map.flyTo({ center: coords[0], zoom: Math.max(map.getZoom(), 14) });
        })
        .catch(err => {
          status.textContent = `❌ ${err.message}`;
          dbg(`❌ Coord debug failed: ${err.message}`);
        });
    };

    function markCurrentPoint() {
      if (!navigator.geolocation) {
        showToast('❌ GPS not supported', true);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;

          // Get type from the dropdown (defaults to "point")
          const selectElement = document.getElementById('dc-point-type');
          const finalType = selectElement ? selectElement.value : 'point';

          markedPoints.push({
            lon: longitude,
            lat: latitude,
            type: finalType,
            timestamp: new Date().toISOString()
          });

          // Add visual marker to map
          const el = document.createElement('div');
          el.className = `marked-point-marker ${finalType}`;

          // Set icon based on type
          let icon = '📍';
          if (finalType === 'in') icon = '🟢';
          else if (finalType === 'out') icon = '🔴';

          el.innerText = icon;

          const marker = new maplibregl.Marker({ element: el })
            .setLngLat([longitude, latitude])
            .setPopup(new maplibregl.Popup().setHTML(`<b>${finalType.toUpperCase()}</b><br>Lat: ${latitude.toFixed(7)}<br>Lng: ${longitude.toFixed(7)}`))
            .addTo(map);

          markedPointMarkers.push(marker);
          showToast(`✅ Marked as ${finalType}`);
          dbg(`📍 Marked ${finalType} at ${latitude}, ${longitude}`);
        },
        (error) => {
          showToast('❌ Could not get current location', true);
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }

    function requestLocation() {
      updateDCStatus('requesting', '📡 Getting your location...');
      dcInfoText.innerText = 'Please wait...';

      if ("geolocation" in navigator) {
        // Use watchPosition to continuously update location even before pressing Start
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude, accuracy, speed, heading } = position.coords;

            // Enable buttons on first successful fix
            if (dcBtnStart.disabled && !isRecording) {
              updateDCStatus('ready', `✅ Location acquired`);
              dcBtnStart.disabled = false;
              document.getElementById('dc-btn-mark').disabled = false;
              map.flyTo({ center: [longitude, latitude], zoom: 16 });
            }

            // Always update the pulsating marker in real-time
            updateLocationMarker(latitude, longitude);

            // Update info text and record if active
            if (isRecording) {
              recordedTrack.push({
                lon: longitude,
                lat: latitude,
                accuracy: accuracy,
                speed: speed,
                heading: heading,
                timestamp: new Date().toISOString()
              });
              dcInfoText.innerText = `Recording: ${recordedTrack.length} pts | Acc: ${Math.round(accuracy)}m | Speed: ${speed ? (speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}`;
            } else {
              dcInfoText.innerText = `Lat: ${latitude.toFixed(7)}, Lng: ${longitude.toFixed(7)} | Accuracy: ${Math.round(accuracy)}m`;
            }
          },
          (error) => {
            console.error("GPS Error:", error);
            if (error.code === 3) { // TIMEOUT
              if (!isRecording) dcInfoText.innerText = '⏳ GPS timed out. Retrying...';
            } else {
              updateDCStatus('', '❌ Location failed');
              dcInfoText.innerText = `Error: ${error.message}. Please enable GPS.`;
            }
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        updateDCStatus('', '❌ GPS not supported');
        dcInfoText.innerText = 'Your device does not support geolocation.';
      }
